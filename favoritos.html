<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favoritos • Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#0b0b12;color:white;overflow-x:hidden;}
header{position:fixed;width:100%;top:0;background:#111;backdrop-filter:blur(12px);border-bottom:1px solid #1f1f2e;z-index:1000;}
.header-content{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;color:#c084fc;}
nav a{margin-left:20px;text-decoration:none;color:#aaa;transition:.3s;}
nav a:hover{color:#c084fc;}
.user-box{display:flex;align-items:center;gap:10px;}
.container{max-width:1100px;margin:auto;padding:100px 20px 40px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:25px;}
.card{background:#14141c;border-radius:14px;overflow:hidden;cursor:pointer;transition:.3s;position:relative;}
.card:hover{transform:translateY(-8px) scale(1.03);}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,#a855f7,transparent);opacity:0;}
.card:hover::after{opacity:0.2;}
.fav{position:absolute;top:10px;right:10px;background:#000a;padding:6px;border-radius:50%;cursor:pointer;transition:.2s;z-index:2;}
.fav:hover{transform:scale(1.2);}
.card img{width:100%;height:240px;object-fit:cover;}
.card h3{padding:12px;text-align:center;}
footer{text-align:center;padding:30px;color:#666;}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img" style="width:28px;height:28px;border-radius:50%;">
      <span>Noctra Core</span>
    </div>

    <nav>
      <a href="index.html">Início</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="manhwas.html">Manhwas</a>
      <a href="#" id="loginLink">Entrar</a>
    </nav>

    <div class="user-box" id="userBox"></div>
  </div>
</header>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<footer>© Noctra Core</footer>

<script type="module">
// 🔥 FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const userBox = document.getElementById("userBox");
const loginLink = document.getElementById("loginLink");
let currentUser = null;
let favoritos = {};

// LOGIN / LOGOUT
loginLink.addEventListener("click", e=>{
  e.preventDefault();
  if(!currentUser) signInWithPopup(auth, provider);
});

function logout(){ signOut(auth); }

// OBRAS EXEMPLO
const obras = [
  {id:"solo",titulo:"Solo Leveling",capa:"https://i.imgur.com/8Km9tLL.jpg"},
  {id:"nano",titulo:"Nano Machine",capa:"https://i.imgur.com/qIufhof.png"},
  {id:"tower",titulo:"Tower of God",capa:"https://i.imgur.com/4AiXzf8.jpeg"},
  {id:"bleach",titulo:"Bleach",capa:"https://i.imgur.com/Yv2Jt0I.jpeg"},
  {id:"naruto",titulo:"Naruto",capa:"https://i.imgur.com/9iQhx0P.jpeg"}
];

const grid = document.getElementById("grid");

// RENDER
function render(lista){
  grid.innerHTML="";
  lista.forEach(o=>{
    if(!favoritos[o.id]) return; // só mostra favoritos
    let div=document.createElement("div");
    div.className="card";
    let isFav = favoritos[o.id];
    div.innerHTML = `
      <div class="fav" onclick="fav(event,'${o.id}')">${isFav ? "💜":"🤍"}</div>
      <img src="${o.capa}">
      <h3>${o.titulo}</h3>
    `;
    div.addEventListener("click", ()=> window.location.href="manhwas.html?id="+o.id);
    grid.appendChild(div);
  });
}

// FAVORITAR
window.fav = async function(e,id){
  e.stopPropagation();
  if(!currentUser){ alert("Faça login primeiro"); return; }
  favoritos[id] = !favoritos[id];
  await setDoc(doc(db,"users",currentUser.uid), favoritos, {merge:true});
  render(obras);
}

// AUTENTICAÇÃO
onAuthStateChanged(auth,user=>{
  currentUser = user;
  if(user){
    userBox.innerHTML = `<img src="${user.photoURL}" width="30" style="border-radius:50%"><span>${user.displayName}</span><button onclick="logout()">Sair</button>`;
  } else { userBox.innerHTML = ""; }
  render(obras);
});
</script>

</body>
</html>
