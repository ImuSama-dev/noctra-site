<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favoritos • Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top,rgba(168,85,247,.16),transparent 35%),
    #08080f;
  color:white;
  overflow-x:hidden;
}

header{
  position:sticky;
  top:0;
  width:100%;
  background:rgba(12,12,20,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index:1000;
}

.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:14px 18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  color:#e9d5ff;
  white-space:nowrap;
}

.logo-img{
  width:30px;
  height:30px;
  border-radius:50%;
}

nav{
  display:flex;
  align-items:center;
  gap:18px;
}

nav a{
  text-decoration:none;
  color:#aaa;
  font-size:14px;
  transition:.2s;
}

nav a:hover,
nav a.active{
  color:#c084fc;
}

.user-box{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:max-content;
}

.btn{
  border:none;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;
  padding:8px 14px;
  border-radius:999px;
  font-family:'Poppins',sans-serif;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 16px rgba(168,85,247,.25);
}

.user-name{
  max-width:120px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  color:#ddd;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:34px 18px 40px;
}

.page-title{
  margin:0 0 6px;
  font-size:28px;
}

.subtitle{
  margin:0 0 24px;
  color:#aaa;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:22px;
}

.card{
  background:#14141c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s ease;
  position:relative;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}

.card:hover{
  transform:translateY(-5px);
  border-color:rgba(168,85,247,.55);
}

.fav{
  position:absolute;
  top:10px;
  right:10px;
  background:rgba(0,0,0,.65);
  padding:7px 9px;
  border-radius:50%;
  cursor:pointer;
  transition:.2s;
  z-index:2;
}

.fav:hover{
  transform:scale(1.15);
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#1b1b2b;
}

.card h3{
  margin:0;
  padding:12px;
  text-align:center;
  font-size:14px;
  line-height:1.35;
}

.empty{
  background:#14141c;
  border:1px solid rgba(255,255,255,.08);
  padding:24px;
  border-radius:18px;
  color:#bbb;
  text-align:center;
}

footer{
  text-align:center;
  padding:30px;
  color:#666;
}

@media(max-width:760px){
  .header-content{
    flex-wrap:wrap;
    justify-content:center;
  }

  nav{
    order:3;
    width:100%;
    justify-content:center;
    gap:16px;
  }

  .container{
    padding:26px 12px 35px;
  }

  .grid{
    grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
    gap:14px;
  }

  .page-title{
    font-size:24px;
  }

  .user-name{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img">
      <span>Noctra Core</span>
    </div>

    <nav>
      <a href="index.html">Início</a>
      <a href="favoritos.html" class="active">Favoritos</a>
      <a href="manhwas.html">Manhwas</a>
    </nav>

    <div class="user-box" id="userBox">
      <button class="btn" id="loginBtn">Entrar</button>
    </div>
  </div>
</header>

<div class="container">
  <h1 class="page-title">Favoritos</h1>
  <p class="subtitle">Seus manhwas salvos aparecem aqui.</p>

  <div class="grid" id="grid"></div>

  <div class="empty" id="emptyBox" style="display:none;">
    Nenhum favorito encontrado.
  </div>
</div>

<footer>© Noctra Core</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, 
  GoogleAuthProvider, 
  signInWithPopup, 
  signOut, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { 
  getFirestore, 
  doc, 
  setDoc, 
  getDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const userBox = document.getElementById("userBox");
const grid = document.getElementById("grid");
const emptyBox = document.getElementById("emptyBox");

let currentUser = null;
let favoritos = {};

const obras = [
  {id:"solo",titulo:"Solo Leveling",capa:"https://i.imgur.com/8Km9tLL.jpg"},
  {id:"nano",titulo:"Nano Machine",capa:"https://i.imgur.com/qIufhof.png"},
  {id:"tower",titulo:"Tower of God",capa:"https://i.imgur.com/4AiXzf8.jpeg"},
  {id:"bleach",titulo:"Bleach",capa:"https://i.imgur.com/Yv2Jt0I.jpeg"},
  {id:"naruto",titulo:"Naruto",capa:"https://i.imgur.com/9iQhx0P.jpeg"}
];

function montarLogin(){
  userBox.innerHTML = `<button class="btn" id="loginBtn">Entrar</button>`;

  document.getElementById("loginBtn").onclick = async()=>{
    await signInWithPopup(auth, provider);
  };
}

function montarUsuario(user){
  userBox.innerHTML = `
    <img src="${user.photoURL || "noctra-logo.png"}" width="30" height="30" style="border-radius:50%;object-fit:cover;">
    <span class="user-name">${user.displayName || "Usuário"}</span>
    <button class="btn" id="logoutBtn">Sair</button>
  `;

  document.getElementById("logoutBtn").onclick = async()=>{
    await signOut(auth);
  };
}

async function carregarFavoritos(){
  favoritos = {};

  if(!currentUser){
    render();
    return;
  }

  const ref = doc(db,"users",currentUser.uid);
  const snap = await getDoc(ref);

  if(snap.exists()){
    favoritos = snap.data() || {};
  }

  render();
}

function render(){
  grid.innerHTML = "";

  if(!currentUser){
    emptyBox.style.display = "block";
    emptyBox.innerText = "Faça login para ver seus favoritos.";
    return;
  }

  const favoritosFiltrados = obras.filter(o => favoritos[o.id]);

  if(favoritosFiltrados.length === 0){
    emptyBox.style.display = "block";
    emptyBox.innerText = "Nenhum favorito encontrado.";
    return;
  }

  emptyBox.style.display = "none";

  favoritosFiltrados.forEach(o=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="fav" data-id="${o.id}">💜</div>
      <img src="${o.capa}" alt="${o.titulo}">
      <h3>${o.titulo}</h3>
    `;

    div.onclick = ()=>{
      window.location.href = "manhwas.html?id=" + o.id;
    };

    div.querySelector(".fav").onclick = async(e)=>{
      e.stopPropagation();
      await removerFavorito(o.id);
    };

    grid.appendChild(div);
  });
}

async function removerFavorito(id){
  if(!currentUser){
    alert("Faça login primeiro.");
    return;
  }

  favoritos[id] = false;

  await setDoc(doc(db,"users",currentUser.uid), favoritos, {merge:true});

  render();
}

onAuthStateChanged(auth, async(user)=>{
  currentUser = user;

  if(user){
    montarUsuario(user);
  }else{
    montarLogin();
  }

  await carregarFavoritos();
});
</script>

</body>
</html>
