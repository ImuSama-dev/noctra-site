<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favoritos - Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#07070d;
  color:white;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 18% 4%,rgba(236,72,153,.20),transparent 28%),
    radial-gradient(circle at 82% 10%,rgba(124,58,237,.18),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(14,165,233,.10),transparent 36%),
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:auto,auto,auto,44px 44px,44px 44px;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,.04),transparent 18%,rgba(236,72,153,.035) 48%,transparent 70%);
  pointer-events:none;
  z-index:-1;
}

header{
  position:sticky;
  top:0;
  width:100%;
  background:rgba(7,7,13,.82);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index:1000;
}

.header-content{
  max-width:1180px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:14px 18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:18px;
  color:#f5d0fe;
  white-space:nowrap;
}

.logo-img{
  width:32px;
  height:32px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 18px rgba(236,72,153,.45);
}

nav{
  display:flex;
  align-items:center;
  gap:4px;
}

nav a{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:#aaa;
  font-size:14px;
  transition:.2s;
}

.side-icon{
  width:auto;
  color:var(--pink);
  font-size:11px;
}

nav a:hover,
nav a.active{
  color:#f9a8d4;
}

.user-box{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:max-content;
}

.user-name{
  max-width:120px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  color:#ddd;
}

.btn,
.user-box button{
  border:none;
  background:linear-gradient(135deg,#ff2f68,#a855f7);
  color:white;
  padding:10px 16px;
  border-radius:9px;
  font-family:'Poppins',sans-serif;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 12px 28px rgba(236,72,153,.18);
}

.btn:hover,
.user-box button:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.container{
  max-width:1180px;
  margin:auto;
  padding:38px 18px 48px;
}

.page-title{
  margin:0 0 6px;
  font-size:30px;
  color:#fff;
}

.subtitle{
  margin:0 0 24px;
  color:#aaa;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:22px;
}

.card{
  background:rgba(18,18,28,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s ease;
  position:relative;
  box-shadow:0 12px 28px rgba(0,0,0,.38);
}

.card:hover{
  transform:translateY(-6px);
  border-color:rgba(236,72,153,.65);
  box-shadow:0 18px 38px rgba(0,0,0,.5);
}

.fav{
  position:absolute;
  top:10px;
  right:10px;
  background:rgba(0,0,0,.68);
  padding:7px 9px;
  border-radius:50%;
  cursor:pointer;
  transition:.2s;
  z-index:4;
  backdrop-filter:blur(8px);
}

.fav:hover{
  transform:scale(1.15);
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#1b1b2b;
}

.card h3{
  margin:0;
  padding:12px;
  text-align:center;
  font-size:14px;
  line-height:1.35;
}

.empty{
  background:rgba(18,18,28,.88);
  border:1px solid rgba(255,255,255,.08);
  padding:24px;
  border-radius:14px;
  color:#bbb;
  text-align:center;
}

footer{
  text-align:center;
  padding:30px;
  color:#666;
}

/* ===== NOCTRA 2026: FAVORITOS REDESIGN ===== */
:root{
  --bg:#07060b;
  --line:rgba(255,255,255,.09);
  --line-pink:rgba(241,90,172,.28);
  --pink:#f15aac;
  --pink-soft:#ffb4dc;
  --text:#f8f5fa;
  --muted:#a99fad;
}

body{background:var(--bg);color:var(--text)}
body::before{
  background:
    radial-gradient(circle at 8% 0%,rgba(241,90,172,.13),transparent 26%),
    radial-gradient(circle at 92% 12%,rgba(159,108,255,.10),transparent 25%),
    #07060b;
}
body::after{background:linear-gradient(180deg,transparent 55%,rgba(241,90,172,.035))}

header{
  top:12px;
  background:transparent;
  border:0;
  padding:0 30px;
}
.header-content{
  width:min(1380px,100%);
  max-width:none;
  min-height:68px;
  padding:0 18px;
  border-radius:16px;
  border:1px solid var(--line);
  background:rgba(10,8,14,.82);
  box-shadow:0 12px 40px rgba(0,0,0,.28);
  backdrop-filter:blur(22px);
}
.logo{color:#fff;font-size:17px;letter-spacing:-.4px}
.logo-img{
  width:38px;
  height:38px;
  box-shadow:0 0 0 1px rgba(241,90,172,.24),0 0 24px rgba(241,90,172,.20);
}
nav{
  gap:4px;
  justify-content:center;
}
nav a{
  padding:9px 13px;
  border-radius:9px;
  color:#bbb2c0;
  font-size:13px;
  font-weight:600;
}
nav a:hover,
nav a.active{
  color:#fff;
  background:rgba(255,255,255,.065);
}
.btn,
.user-box button{
  border:none;
  border-radius:10px;
  background:var(--pink);
  color:#fff;
  padding:11px 16px;
  font-family:Poppins,sans-serif;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:none;
  transition:transform .2s ease,background .2s ease,border-color .2s ease;
}
.btn:hover,
.user-box button:hover{
  transform:translateY(-1px);
  background:#ff69b9;
  filter:none;
}
.container{
  width:min(1380px,100%);
  max-width:none;
  padding:40px 30px 52px;
}
.page-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
  padding:26px 28px;
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),
    radial-gradient(circle at 0% 0%,rgba(241,90,172,.11),transparent 34%);
}
.page-title{
  font-size:clamp(32px,4vw,48px);
  line-height:1;
  letter-spacing:-.055em;
  margin-bottom:9px;
}
.subtitle{color:#cbc2ce;font-size:14px;margin:0}
.discord-banner{
  margin-top:22px;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:18px;
  padding:16px 18px;
  border:1px solid rgba(241,90,172,.25);
  border-radius:16px;
  background:
    radial-gradient(circle at 8% 50%,rgba(241,90,172,.18),transparent 28%),
    linear-gradient(135deg,rgba(255,255,255,.045),rgba(88,101,242,.08)),
    rgba(13,10,17,.78);
}

.discord-banner img{
  width:74px;
  height:74px;
  object-fit:contain;
  filter:drop-shadow(0 0 18px rgba(241,90,172,.38));
}

.discord-banner h2{
  font-size:20px;
  letter-spacing:-.35px;
  margin-bottom:4px;
}

.discord-banner p{
  color:#cfc6d2;
  font-size:13px;
  line-height:1.55;
}

.discord-banner .btn{
  background:rgba(88,101,242,.22);
  border:1px solid rgba(156,165,255,.30);
  color:#eef0ff;
}

.discord-banner .btn:hover{
  background:rgba(88,101,242,.32);
}
.grid{
  grid-template-columns:repeat(auto-fill,minmax(176px,1fr));
  gap:18px;
}
.card{
  border-radius:13px;
  border-color:var(--line);
  background:#100d15;
  box-shadow:0 12px 26px rgba(0,0,0,.16);
}
.card:hover{
  transform:translateY(-4px);
  border-color:var(--line-pink);
  box-shadow:0 18px 38px rgba(0,0,0,.30);
}
.fav{color:var(--pink-soft);background:rgba(7,6,11,.76)}
.card img{background:#111}
.card h3{padding:12px;font-size:13px;letter-spacing:-.15px}
.empty{
  border-color:var(--line);
  background:rgba(13,10,17,.78);
  padding:28px;
}
footer{color:#6f6674}

@media(max-width:760px){
  .header-content{
    flex-wrap:wrap;
    justify-content:center;
  }

  nav{
    order:3;
    width:100%;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .container{
    padding:30px 12px 40px;
  }

  .grid{
    grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
    gap:14px;
  }

  .page-title{
    font-size:24px;
  }

  .user-name{
    display:none;
  }

  header{
    top:6px;
    padding:0 8px;
  }

  .header-content{
    display:block;
    min-height:0;
    padding:10px;
    border-radius:14px;
  }

  .logo{
    justify-content:flex-start;
    margin-bottom:10px;
    font-size:15px;
  }

  .logo-img{
    width:32px;
    height:32px;
  }

  nav{
    width:100%;
    justify-content:flex-start;
    overflow-x:auto;
    flex-wrap:nowrap;
    gap:4px;
    scrollbar-width:none;
  }

  nav::-webkit-scrollbar{display:none}

  nav a{
    white-space:nowrap;
    padding:8px 11px;
    font-size:11px;
  }

  .user-box{display:none}

  .container{
    padding:18px 8px 40px;
  }

  .page-head{
    display:block;
    padding:20px;
    margin-bottom:14px;
  }

  .page-title{font-size:32px}
  .subtitle{font-size:13px;margin-bottom:16px}
  .discord-banner{
    grid-template-columns:58px 1fr;
    gap:12px;
    padding:14px;
  }

  .discord-banner img{
    width:58px;
    height:58px;
  }

  .discord-banner h2{
    font-size:16px;
  }

  .discord-banner p{
    font-size:12px;
  }

  .discord-banner .btn{
    grid-column:1 / -1;
    width:100%;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img" alt="Noctra">
      <span>Noctra Core</span>
    </div>

    <nav>
      <a href="/"><span class="side-icon">◆</span>In&iacute;cio</a>
      <a href="/manhwas"><span class="side-icon">▣</span>Manhwas</a>
      <a href="/favoritos" class="active"><span class="side-icon">♡</span>Favoritos</a>
      <a href="/admin" id="adminLink" style="display:none;"><span class="side-icon">✦</span>Admin</a>
    </nav>

    <div class="user-box" id="userBox">
      <button class="btn" id="loginBtn">Entrar</button>
    </div>
  </div>
</header>

<div class="container">
  <section class="page-head">
    <div>
      <h1 class="page-title">Favoritos</h1>
      <p class="subtitle">Seus manhwas salvos aparecem aqui.</p>
    </div>
  </section>

  <div class="grid" id="grid"></div>

  <div class="empty" id="emptyBox" style="display:none;">
    Nenhum favorito encontrado.
  </div>

  <section class="discord-banner">
    <img src="https://i.ibb.co/B28KzCtC/noctra-core-bat-icon-transparent.png" alt="Noctra Core">
    <div>
      <h2>Discord Noctra</h2>
      <p>Entre para receber avisos de capítulos, novidades do site e conversar com a comunidade.</p>
    </div>
    <a class="btn" href="https://discord.gg/UjUEeFk4zx" target="_blank" rel="noopener">Entrar na comunidade</a>
  </section>
</div>

<footer>© Noctra Core</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const ADMIN_UIDS = ["yeckgLVGVIMrMiByikAj8FpbjTm2"];

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);
const provider = new GoogleAuthProvider();

const userBox = document.getElementById("userBox");
const grid = document.getElementById("grid");
const emptyBox = document.getElementById("emptyBox");
const adminLink = document.getElementById("adminLink");

let currentUser = null;
let favoritos = {};
let obras = [];

function montarLogin(){
  userBox.innerHTML = `<button class="btn" id="loginBtn">Entrar</button>`;

  document.getElementById("loginBtn").onclick = async()=>{
    await signInWithPopup(auth, provider);
  };
}

function montarUsuario(user){
  const isAdmin = ADMIN_UIDS.includes(user.uid);
  const adminTag = isAdmin ? " \\u2022 ADM" : "";

  userBox.innerHTML = `
    <img src="${user.photoURL || "noctra-logo.png"}" width="30" height="30" style="border-radius:50%;object-fit:cover;">
    <span class="user-name">${user.displayName || "Usu\u00e1rio"}${adminTag}</span>
    <button class="btn" id="logoutBtn">Sair</button>
  `;

  adminLink.style.display = isAdmin ? "inline" : "none";

  document.getElementById("logoutBtn").onclick = async()=>{
    await signOut(auth);
  };
}

async function carregarObras(){
  obras = [];

  try{
    const snap = await getDocs(collection(db,"manhwas"));

    snap.forEach(item=>{
      const data = item.data();

      if(data.publicado === false || data.published === false){
        return;
      }

      obras.push({
        id:item.id,
        titulo:data.titulo || data.nome || "Sem t\u00edtulo",
        nome:data.nome || data.titulo || "Sem t\u00edtulo",
        capa:data.capa || "noctra-logo.png"
      });
    });
  }catch(error){
    console.warn("Não foi possível carregar manhwas do Firebase:", error);
  }
}

async function carregarFavoritos(){
  favoritos = {};

  if(!currentUser){
    render();
    return;
  }

  const ref = doc(db,"users",currentUser.uid);
  const snap = await getDoc(ref);

  if(snap.exists()){
    favoritos = snap.data() || {};
  }

  render();
}

function render(){
  grid.innerHTML = "";

  if(!currentUser){
    emptyBox.style.display = "block";
    emptyBox.innerText = "Faça login para ver seus favoritos.";
    return;
  }

  const favoritosFiltrados = obras.filter(obra=>favoritos[obra.id] === true);

  if(favoritosFiltrados.length === 0){
    emptyBox.style.display = "block";
    emptyBox.innerText = "Nenhum favorito encontrado.";
    return;
  }

  emptyBox.style.display = "none";

  favoritosFiltrados.forEach(obra=>{
    const titulo = obra.titulo || obra.nome || "Sem t\u00edtulo";
    const capa = obra.capa || "noctra-logo.png";

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="fav" data-id="${obra.id}">&hearts;</div>
      <img src="${capa}" alt="${titulo}">
      <h3>${titulo}</h3>
    `;

    div.onclick = ()=>{
      window.location.href = "/obra?id=" + encodeURIComponent(obra.id);
    };

    div.querySelector(".fav").onclick = async(event)=>{
      event.stopPropagation();
      await removerFavorito(obra.id);
    };

    grid.appendChild(div);
  });
}

async function removerFavorito(id){
  if(!currentUser){
    alert("Fa\u00e7a login primeiro.");
    return;
  }

  favoritos[id] = false;

  await setDoc(doc(db,"users",currentUser.uid), favoritos, {merge:true});

  render();
}

onAuthStateChanged(auth, async(user)=>{
  currentUser = user;

  if(user){
    montarUsuario(user);
  }else{
    adminLink.style.display = "none";
    montarLogin();
  }

  await carregarObras();
  await carregarFavoritos();
});
</script>

</body>
</html>
