<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favoritos • Noctra</title>
<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif;}
body{background:#0b0b12;color:white;overflow-x:hidden;}

/* CONTAINER */
.container{max-width:1100px;margin:auto;padding:0 20px;}

/* HEADER */
header{position:fixed;width:100%;top:0;background:rgba(10,10,20,0.85);backdrop-filter:blur(12px);border-bottom:1px solid #1f1f2e;z-index:1000;}
.header-content{display:flex;justify-content:space-between;align-items:center;padding:15px 0;}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;color:#c084fc;}
.logo-img{width:28px;height:28px;border-radius:50%;}
nav a{margin-left:15px;text-decoration:none;color:#aaa;transition:.3s;}
nav a:hover{color:#c084fc;}
.user-box{display:flex;align-items:center;gap:10px;}

/* GRID */
.grid{margin-top:100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:25px;}
.card{background:#14141c;border-radius:14px;overflow:hidden;cursor:pointer;transition:.3s;position:relative;}
.card:hover{transform:translateY(-6px) scale(1.03);}
.card img{width:100%;height:240px;object-fit:cover;}
.card h3{padding:12px;font-size:14px;text-align:center;}

/* FOOTER */
footer{text-align:center;padding:30px;color:#666;margin-top:30px;}
</style>
</head>

<body>

<header>
  <div class="container header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img">
      <span>Noctra Core</span>
    </div>
    <nav>
      <a href="index.html">Início</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="manhwas.html">Manhwas</a>
      <a href="#" id="loginBtn">Entrar</a>
    </nav>
    <div class="user-box" id="userBox"></div>
  </div>
</header>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<footer>© Noctra Core</footer>

<script type="module">
// 🔥 FIREBASE MESMO DO INDEX
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const userBox = document.getElementById("userBox");
const grid = document.getElementById("grid");
let currentUser = null;
let favoritos = {};
const obras = {
  solo:{nome:"Solo Leveling",capa:"https://i.imgur.com/8Km9tLL.jpg"},
  nano:{nome:"Nano Machine",capa:"https://i.imgur.com/qIufhof.png"},
  tower:{nome:"Tower of God",capa:"https://i.imgur.com/4AiXzf8.jpeg"}
};

// LOGIN
function login(){ signInWithPopup(auth, provider); }
function logout(){ signOut(auth); }

onAuthStateChanged(auth, async user=>{
  currentUser = user;
  if(user){
    userBox.innerHTML = `<img src="${user.photoURL}" width="30" style="border-radius:50%"><span>${user.displayName}</span><button onclick="logout()">Sair</button>`;
    const snap = await getDoc(doc(db,"users",user.uid));
    if(snap.exists()) favoritos = snap.data();
  } else {
    userBox.innerHTML = `<button onclick="login()">Entrar</button>`;
  }
  renderFavoritos();
});

window.login = login;
window.logout = logout;

function renderFavoritos(){
  grid.innerHTML="";
  if(!currentUser){
    grid.innerHTML="<p style='color:#bbb;text-align:center;'>Faça login para ver seus favoritos.</p>";
    return;
  }

  let favList = Object.keys(favoritos).filter(id=>favoritos[id]===true);

  if(favList.length===0){
    grid.innerHTML="<p style='color:#bbb;text-align:center;'>Nenhum favorito ainda.</p>";
    return;
  }

  favList.forEach(id=>{
    if(!obras[id]) return;
    let div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <img src="${obras[id].capa}">
      <h3>${obras[id].nome}</h3>
    `;
    div.onclick = ()=> window.location.href=`manhwas.html?id=${id}`;
    grid.appendChild(div);
  });
}
</script>

</body>
</html>
