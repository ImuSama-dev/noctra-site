<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favoritos - Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#07070d;
  color:white;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 18% 4%,rgba(236,72,153,.20),transparent 28%),
    radial-gradient(circle at 82% 10%,rgba(124,58,237,.18),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(14,165,233,.10),transparent 36%),
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:auto,auto,auto,44px 44px,44px 44px;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,.04),transparent 18%,rgba(236,72,153,.035) 48%,transparent 70%);
  pointer-events:none;
  z-index:-1;
}

header{
  position:sticky;
  top:0;
  width:100%;
  background:rgba(7,7,13,.82);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index:1000;
}

.header-content{
  max-width:1180px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:14px 18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:18px;
  color:#f5d0fe;
  white-space:nowrap;
}

.logo-img{
  width:32px;
  height:32px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 18px rgba(236,72,153,.45);
}

nav{
  display:flex;
  align-items:center;
  gap:18px;
}

nav a{
  text-decoration:none;
  color:#aaa;
  font-size:14px;
  transition:.2s;
}

nav a:hover,
nav a.active{
  color:#f9a8d4;
}

.user-box{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:max-content;
}

.user-name{
  max-width:120px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  color:#ddd;
}

.btn,
.user-box button{
  border:none;
  background:linear-gradient(135deg,#ff2f68,#a855f7);
  color:white;
  padding:10px 16px;
  border-radius:9px;
  font-family:'Poppins',sans-serif;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 12px 28px rgba(236,72,153,.18);
}

.btn:hover,
.user-box button:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.container{
  max-width:1180px;
  margin:auto;
  padding:38px 18px 48px;
}

.page-title{
  margin:0 0 6px;
  font-size:30px;
  color:#fff;
}

.subtitle{
  margin:0 0 24px;
  color:#aaa;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:22px;
}

.card{
  background:rgba(18,18,28,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s ease;
  position:relative;
  box-shadow:0 12px 28px rgba(0,0,0,.38);
}

.card:hover{
  transform:translateY(-6px);
  border-color:rgba(236,72,153,.65);
  box-shadow:0 18px 38px rgba(0,0,0,.5);
}

.fav{
  position:absolute;
  top:10px;
  right:10px;
  background:rgba(0,0,0,.68);
  padding:7px 9px;
  border-radius:50%;
  cursor:pointer;
  transition:.2s;
  z-index:4;
  backdrop-filter:blur(8px);
}

.fav:hover{
  transform:scale(1.15);
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#1b1b2b;
}

.card h3{
  margin:0;
  padding:12px;
  text-align:center;
  font-size:14px;
  line-height:1.35;
}

.empty{
  background:rgba(18,18,28,.88);
  border:1px solid rgba(255,255,255,.08);
  padding:24px;
  border-radius:14px;
  color:#bbb;
  text-align:center;
}

footer{
  text-align:center;
  padding:30px;
  color:#666;
}

@media(max-width:760px){
  .header-content{
    flex-wrap:wrap;
    justify-content:center;
  }

  nav{
    order:3;
    width:100%;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .container{
    padding:30px 12px 40px;
  }

  .grid{
    grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
    gap:14px;
  }

  .page-title{
    font-size:24px;
  }

  .user-name{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img" alt="Noctra">
      <span>Noctra Core</span>
    </div>

    <nav>
      <a href="/">Inicio</a>
      <a href="/favoritos" class="active">Favoritos</a>
      <a href="/manhwas">Manhwas</a>
      <a href="/admin" id="adminLink" style="display:none;">Admin</a>
    </nav>

    <div class="user-box" id="userBox">
      <button class="btn" id="loginBtn">Entrar</button>
    </div>
  </div>
</header>

<div class="container">
  <h1 class="page-title">Favoritos</h1>
  <p class="subtitle">Seus manhwas salvos aparecem aqui.</p>

  <div class="grid" id="grid"></div>

  <div class="empty" id="emptyBox" style="display:none;">
    Nenhum favorito encontrado.
  </div>
</div>

<footer>© Noctra Core</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const ADMIN_UIDS = ["yeckgLVGVIMrMiByikAj8FpbjTm2"];

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);
const provider = new GoogleAuthProvider();

const userBox = document.getElementById("userBox");
const grid = document.getElementById("grid");
const emptyBox = document.getElementById("emptyBox");
const adminLink = document.getElementById("adminLink");

let currentUser = null;
let favoritos = {};
let obras = [];

function montarLogin(){
  userBox.innerHTML = `<button class="btn" id="loginBtn">Entrar</button>`;

  document.getElementById("loginBtn").onclick = async()=>{
    await signInWithPopup(auth, provider);
  };
}

function montarUsuario(user){
  const isAdmin = ADMIN_UIDS.includes(user.uid);
  const adminTag = isAdmin ? " - ADM" : "";

  userBox.innerHTML = `
    <img src="${user.photoURL || "noctra-logo.png"}" width="30" height="30" style="border-radius:50%;object-fit:cover;">
    <span class="user-name">${user.displayName || "Usuario"}${adminTag}</span>
    <button class="btn" id="logoutBtn">Sair</button>
  `;

  adminLink.style.display = isAdmin ? "inline" : "none";

  document.getElementById("logoutBtn").onclick = async()=>{
    await signOut(auth);
  };
}

async function carregarObras(){
  obras = [];

  try{
    const snap = await getDocs(collection(db,"manhwas"));

    snap.forEach(item=>{
      const data = item.data();

      if(data.publicado === false || data.published === false){
        return;
      }

      obras.push({
        id:item.id,
        titulo:data.titulo || data.nome || "Sem titulo",
        nome:data.nome || data.titulo || "Sem titulo",
        capa:data.capa || "noctra-logo.png"
      });
    });
  }catch(error){
    console.warn("Nao foi possivel carregar manhwas do Firebase:", error);
  }
}

async function carregarFavoritos(){
  favoritos = {};

  if(!currentUser){
    render();
    return;
  }

  const ref = doc(db,"users",currentUser.uid);
  const snap = await getDoc(ref);

  if(snap.exists()){
    favoritos = snap.data() || {};
  }

  render();
}

function render(){
  grid.innerHTML = "";

  if(!currentUser){
    emptyBox.style.display = "block";
    emptyBox.innerText = "Faca login para ver seus favoritos.";
    return;
  }

  const favoritosFiltrados = obras.filter(obra=>favoritos[obra.id] === true);

  if(favoritosFiltrados.length === 0){
    emptyBox.style.display = "block";
    emptyBox.innerText = "Nenhum favorito encontrado.";
    return;
  }

  emptyBox.style.display = "none";

  favoritosFiltrados.forEach(obra=>{
    const titulo = obra.titulo || obra.nome || "Sem titulo";
    const capa = obra.capa || "noctra-logo.png";

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="fav" data-id="${obra.id}">💜</div>
      <img src="${capa}" alt="${titulo}">
      <h3>${titulo}</h3>
    `;

    div.onclick = ()=>{
      window.location.href = "/obra?id=" + encodeURIComponent(obra.id);
    };

    div.querySelector(".fav").onclick = async(event)=>{
      event.stopPropagation();
      await removerFavorito(obra.id);
    };

    grid.appendChild(div);
  });
}

async function removerFavorito(id){
  if(!currentUser){
    alert("Faca login primeiro.");
    return;
  }

  favoritos[id] = false;

  await setDoc(doc(db,"users",currentUser.uid), favoritos, {merge:true});

  render();
}

onAuthStateChanged(auth, async(user)=>{
  currentUser = user;

  if(user){
    montarUsuario(user);
  }else{
    adminLink.style.display = "none";
    montarLogin();
  }

  await carregarObras();
  await carregarFavoritos();
});
</script>

</body>
</html>
