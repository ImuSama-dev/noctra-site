<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Leitor</title>
<link rel="stylesheet" href="style.css">

<style>
.reader {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 60px;
}

.reader img {
  max-width: 900px;
  width: 100%;
  margin-bottom: 10px;
}
</style>

</head>

<body>

<header>
  <div class="logo">Leitor</div>
  <nav>
    <a href="manhwas.html">Voltar</a>
  </nav>
</header>

<div class="reader" id="reader"></div>

<script>
const paginas = [
  "https://i.imgur.com/8Km9tLL.jpg",
  "https://i.imgur.com/qIufhof.png",
  "https://i.imgur.com/4AiXzf8.jpeg"
];

const reader = document.getElementById("reader");

paginas.forEach(src => {
  const img = document.createElement("img");
  img.src = src;
  reader.appendChild(img);
});
</script>

</body>
</html>
