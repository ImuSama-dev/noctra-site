<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Leitor</title>

<style>
body {margin:0;background:#000;}

.topbar {
  position:fixed;
  top:0;
  width:100%;
  background:#111;
  padding:10px;
  color:white;
  display:flex;
  justify-content:space-between;
}

.reader img {
  width:100%;
  max-width:900px;
  display:block;
  margin:auto;
}

.container {
  margin-top:50px;
}
</style>
</head>

<body>

<div class="topbar">
<button onclick="history.back()">Voltar</button>
<span id="capitulo"></span>
</div>

<div class="container">
<div class="reader" id="reader"></div>
</div>

<script>
const capitulos = {
  1: [
    "https://i.imgur.com/8Km9tLL.jpg",
    "https://i.imgur.com/qIufhof.png"
  ],
  2: [
    "https://i.imgur.com/4AiXzf8.jpeg"
  ]
};

const url = new URLSearchParams(window.location.search);
const cap = url.get("cap") || 1;

document.getElementById("capitulo").innerText = "Capítulo " + cap;

const reader = document.getElementById("reader");

capitulos[cap].forEach(src=>{
  let img=document.createElement("img");
  img.src=src;
  reader.appendChild(img);
});
</script>

</body>
</html>
