<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Leitor</title>

<style>
body{margin:0;background:#000;}
.reader img{width:100%;max-width:900px;display:block;margin:auto;}
.top{
  position:fixed;top:0;width:100%;
  background:#111;color:white;padding:10px;
}
</style>
</head>

<body>

<div class="top">
<button onclick="history.back()">Voltar</button>
<span id="titulo"></span>
</div>

<div class="reader" id="reader"></div>

<script>

// 📚 CAPÍTULOS DIFERENTES
const capitulos = {
  1: [
    "https://i.imgur.com/8Km9tLL.jpg",
    "https://i.imgur.com/qIufhof.png"
  ],
  2: [
    "https://i.imgur.com/4AiXzf8.jpeg"
  ]
};

// PEGAR CAPÍTULO DA URL
const url = new URLSearchParams(window.location.search);
const cap = url.get("cap") || 1;

document.getElementById("titulo").innerText = "Capítulo " + cap;

// CARREGAR IMAGENS
const reader = document.getElementById("reader");

capitulos[cap].forEach(src=>{
  const img=document.createElement("img");
  img.src=src;
  reader.appendChild(img);
});
</script>

</body>
</html>
