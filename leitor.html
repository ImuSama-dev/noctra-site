<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<style>
body {
  margin: 0;
  background: #0a0a0f;
  font-family: "Segoe UI", sans-serif;
}

/* TOP BAR */
.topbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(10,10,15,0.9);
  backdrop-filter: blur(10px);
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 1000;
  border-bottom: 1px solid #1f1f2e;
  color: white;
}

.topbar button {
  background: #a855f7;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

/* READER */
.reader {
  margin-top: 70px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.reader img {
  width: 100%;
  max-width: 900px;
  margin-bottom: 10px;
  border-radius: 6px;
}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="voltar()">← Voltar</button>
  <div>Capítulo 1</div>
</div>

<div class="reader" id="reader"></div>

<script>

// 📚 LISTA DE IMAGENS DO CAPÍTULO
const paginas = [
  "https://i.imgur.com/8Km9tLL.jpg",
  "https://i.imgur.com/qIufhof.png",
  "https://i.imgur.com/4AiXzf8.jpeg"
];

// 🔥 CARREGAR IMAGENS AUTOMATICAMENTE
const reader = document.getElementById("reader");

paginas.forEach(src => {
  const img = document.createElement("img");
  img.src = src;
  reader.appendChild(img);
});

// ⬅️ VOLTAR
function voltar() {
  window.history.back();
}

</script>

</body>
</html>
