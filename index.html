<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins',sans-serif;
  background:#08080f;
  color:white;
}

/* HERO MENOR */
.hero{
  min-height:520px; /* antes era muito grande */
  padding:50px 18px;
}

/* FUNDO MENOS ROXO */
.hero-bg{
  background:
    linear-gradient(90deg,rgba(8,8,15,.85),rgba(8,8,15,.65)),
    url("https://i.pinimg.com/736x/c8/ec/01/c8ec01ccd4a742da5c692551fa21f3ef.jpg");
  background-size:cover;
  background-position:center;
  opacity:.85;
}

/* REMOVE EXCESSO DE ROXO */
.hero-bg::after{
  background:
    linear-gradient(to bottom,transparent 0%,#08080f 95%);
}

/* GRID FIXO */
.hero-inner{
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  min-height:420px;
}

/* CARDS AJUSTADOS */
.glass-card{
  width:200px; /* menor */
}

.card-a{
  right:140px;
  top:30px;
}

.card-b{
  right:20px;
  top:90px;
}

.card-c{
  right:100px;
  top:200px;
}

/* TEXTO MAIS CONTROLADO */
.hero h1{
  font-size:48px;
}

.hero p{
  font-size:15px;
}

/* MOBILE */
@media(max-width:900px){
  .hero-inner{
    grid-template-columns:1fr;
  }

  .hero-visual{
    display:none;
  }

  .hero{
    text-align:center;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img">
      Noctra Core
    </div>

    <nav>
      <a href="index.html">Início</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="manhwas.html">Manhwas</a>
      <a href="admin.html">Admin</a>
    </nav>

    <div class="user-box" id="userBox"></div>
  </div>
</header>

<section class="hero">
  <div class="hero-bg"></div>

  <div class="hero-inner">
    <div class="hero-copy">

      <h1>
        Entre o silêncio e o desejo…<br>
        <span>existem histórias que só a noite entende.</span>
      </h1>

      <p>
        Não é só leitura — é experiência.
      </p>

      <div class="hero-actions">
        <button class="btn" onclick="location.href='manhwas.html'">
          Explorar histórias
        </button>

        <button class="btn btn-ghost" onclick="location.href='manhwas.html'">
          Biblioteca
        </button>
      </div>

      <div class="tags">
        <div class="tag">YURI</div>
        <div class="tag">YAOI</div>
        <div class="tag">ROMANCE</div>
        <div class="tag">DRAMA</div>
      </div>

    </div>

    <div class="hero-visual">

      <div class="glass-card card-a">
        <img src="https://i.pinimg.com/736x/c8/ec/01/c8ec01ccd4a742da5c692551fa21f3ef.jpg">
      </div>

      <div class="glass-card card-b">
        <img src="https://i.pinimg.com/736x/ab/3f/1e/ab3f1e9949f080f42c85dbbe1524b04b.jpg">
      </div>

      <div class="glass-card card-c">
        <img src="https://i.pinimg.com/1200x/d9/e9/3f/d9e93f73ebb83c54168415a650ac3656.jpg">
      </div>

    </div>
  </div>
</section>

</body>
</html>
