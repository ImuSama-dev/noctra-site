<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #0a0a0f;
  color: white;
}

/* HEADER */
header {
  background: rgba(15,15,25,0.9);
  backdrop-filter: blur(10px);
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #1f1f2e;
}

.logo {
  font-size: 20px;
  font-weight: 600;
  color: #a855f7;
}

nav a {
  color: #aaa;
  margin-left: 20px;
  text-decoration: none;
  font-size: 14px;
  transition: 0.2s;
}

nav a:hover {
  color: #a855f7;
}

/* USER */
.user-box {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* BANNER */
.banner {
  height: 260px;
  display: flex;
  align-items: center;
  padding: 50px;
  font-size: 28px;
  font-weight: 600;
  background: linear-gradient(120deg, #0f0f1a, #1a1030);
}

/* CONTAINER */
.container {
  padding: 40px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 25px;
}

/* CARD */
.card {
  background: #12121a;
  border-radius: 14px;
  overflow: hidden;
  transition: 0.3s;
  border: 1px solid #1f1f2e;
}

.card:hover {
  transform: translateY(-6px);
  border-color: #a855f7;
}

.card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
}

.card .info {
  padding: 12px;
}

.card h3 {
  font-size: 14px;
  margin-bottom: 8px;
}

.btn {
  display: block;
  text-align: center;
  padding: 7px;
  background: #a855f7;
  border-radius: 8px;
  text-decoration: none;
  color: white;
  font-size: 12px;
  transition: 0.2s;
}

.btn:hover {
  background: #9333ea;
}

/* LOGIN BUTTON */
.login-btn {
  background: #a855f7;
  border: none;
  padding: 7px 12px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 25px;
  color: #666;
  border-top: 1px solid #1f1f2e;
  margin-top: 40px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Noctra Core</div>

  <nav>
    <a href="#">Início</a>
    <a href="#">Manhwas</a>
    <a href="https://discord.gg/JJ3xncPnm" target="_blank" style="
  background:#5865F2;
  padding:6px 14px;
  border-radius:8px;
  color:white;
  font-size:13px;
  text-decoration:none;
  transition:0.2s;
">
  Entrar no Discord
</a>
  </nav>

  <div class="user-box" id="userBox"></div>
</header>

<div class="banner">
  Explore o universo Noctra
</div>

<div class="container">
  <div class="grid">

    <div class="card">
      <img src="https://i.imgur.com/8Km9tLL.jpg">
      <div class="info">
        <h3>Em breve</h3>
        <a class="btn">Indisponível</a>
      </div>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/qIufhof.png">
      <div class="info">
        <h3>Em breve</h3>
        <a class="btn">Indisponível</a>
      </div>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/4AiXzf8.jpeg">
      <div class="info">
        <h3>Em breve</h3>
        <a class="btn">Indisponível</a>
      </div>
    </div>

  </div>
</div>

<footer>
© Noctra Core • Todos os direitos reservados
</footer>

<!-- FIREBASE + LOGIN -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const provider = new GoogleAuthProvider();

const userBox = document.getElementById("userBox");

function login() {
  signInWithPopup(auth, provider);
}

function logout() {
  signOut(auth);
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    userBox.innerHTML = `
      <img src="${user.photoURL}" style="width:32px;height:32px;border-radius:50%;">
      <span style="font-size:13px;color:#ccc;">${user.displayName}</span>
      <button onclick="logout()" style="
        background:#ff4d6d;
        border:none;
        padding:6px 10px;
        border-radius:6px;
        color:white;
        cursor:pointer;
      ">Sair</button>
    `;
  } else {
    userBox.innerHTML = `
      <button class="login-btn" onclick="login()">Entrar</button>
    `;
  }
});

window.login = login;
window.logout = logout;
</script>

</body>
</html>
