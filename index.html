<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>

<style>
body {
  margin:0;
  font-family:Segoe UI;
  background:#0a0a0f;
  color:white;
}

/* HEADER */
header {
  position:fixed;
  width:100%;
  top:0;
  display:flex;
  justify-content:space-between;
  padding:15px 40px;
  background:rgba(10,10,15,0.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #1f1f2e;
  z-index:1000;
}

.logo {
  color:#a855f7;
  font-weight:600;
}

nav a {
  margin-left:20px;
  color:#aaa;
  text-decoration:none;
}

nav a:hover {
  color:#a855f7;
}

/* HERO */
.hero {
  height:300px;
  display:flex;
  align-items:center;
  padding:60px;
  font-size:32px;
  font-weight:600;
  background:linear-gradient(120deg,#0f0f1a,#1a1030);
}

/* SEARCH */
.search {
  padding:20px 40px;
}

.search input {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#12121a;
  color:white;
}

/* GRID */
.section {
  padding:40px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}

/* CARD */
.card {
  background:#12121a;
  border-radius:12px;
  overflow:hidden;
  transition:.3s;
}

.card:hover {
  transform:translateY(-6px);
}

.card img {
  width:100%;
  height:240px;
  object-fit:cover;
}

.card .info {
  padding:10px;
}

.btn {
  display:block;
  text-align:center;
  padding:8px;
  background:#a855f7;
  border-radius:6px;
  text-decoration:none;
  color:white;
  margin-top:5px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Noctra Core</div>
  <nav>
    <a href="#inicio">Início</a>
    <a href="#manhwas">Manhwas</a>
    <a href="https://discord.gg/JJ3xncPnm" target="_blank">Discord</a>
  </nav>
</header>

<div id="inicio" class="hero">
  Explore o universo Noctra
</div>

<div class="search">
  <input id="search" placeholder="Pesquisar manhwa..." onkeyup="buscar()">
</div>

<div id="manhwas" class="section">
  <h2>Manhwas</h2>

  <div class="grid">

    <div class="card">
      <img src="https://i.imgur.com/8Km9tLL.jpg">
      <div class="info">
        <h3>Solo Leveling</h3>
        <a class="btn" href="manga.html">Ver obra</a>
      </div>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/qIufhof.png">
      <div class="info">
        <h3>Nano Machine</h3>
        <a class="btn" href="manga.html">Ver obra</a>
      </div>
    </div>

  </div>
</div>

<script>
function buscar(){
  let val=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display=c.innerText.toLowerCase().includes(val)?"block":"none";
  });
}
</script>

</body>
</html>
