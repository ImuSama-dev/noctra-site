<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  background: #0b0b0f;
  color: white;
}

/* HEADER */
header {
  background: #111;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #222;
}

.logo {
  color: violet;
  font-size: 22px;
  font-weight: bold;
}

nav a {
  color: #ccc;
  margin-left: 15px;
  text-decoration: none;
  transition: 0.2s;
}

nav a:hover {
  color: violet;
}

/* USER */
#userBox {
  display: flex;
  align-items: center;
  gap: 8px;
}

#userBox button {
  background: violet;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  color: white;
}

/* BANNER */
.banner {
  height: 250px;
  background: linear-gradient(90deg, #1a1a2e, #0b0b0f);
  display: flex;
  align-items: center;
  padding: 40px;
  font-size: 26px;
  font-weight: bold;
}

/* GRID */
.container {
  padding: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: #14141c;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.card .info {
  padding: 10px;
}

.card h3 {
  font-size: 14px;
  margin-bottom: 5px;
}

.btn {
  display: block;
  text-align: center;
  margin-top: 8px;
  padding: 6px;
  background: violet;
  border-radius: 6px;
  text-decoration: none;
  color: white;
  font-size: 12px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  color: #777;
  border-top: 1px solid #222;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🌙 Noctra Core</div>

  <nav>
    <a href="#">Início</a>
    <a href="#">Manhwas</a>
    <a href="#">Discord</a>
  </nav>

  <div id="userBox"></div>
</header>

<div class="banner">
🔥 Bem-vindo ao universo Noctra
</div>

<div class="container">
  <div class="grid">

    <div class="card">
      <img src="https://via.placeholder.com/300x400">
      <div class="info">
        <h3>Em breve</h3>
        <a class="btn">Indisponível</a>
      </div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x400">
      <div class="info">
        <h3>Em breve</h3>
        <a class="btn">Indisponível</a>
      </div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x400">
      <div class="info">
        <h3>Em breve</h3>
        <a class="btn">Indisponível</a>
      </div>
    </div>

  </div>
</div>

<footer>
© Noctra Core • Todos os direitos reservados
</footer>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

function logout() {
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  const userBox = document.getElementById("userBox");

  if (user) {
    userBox.innerHTML = `
      <img src="${user.photoURL}" style="width:30px;border-radius:50%;">
      <span>${user.displayName}</span>
      <button onclick="logout()">Sair</button>
    `;
  } else {
    userBox.innerHTML = `<button onclick="login()">Entrar</button>`;
  }
});
</script>

</body>
</html>
