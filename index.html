<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>

<style>
body {margin:0;font-family:Segoe UI;background:#0a0a0f;color:white;}
header {
  position:fixed;width:100%;top:0;
  display:flex;justify-content:space-between;
  padding:15px 40px;background:#111;
  border-bottom:1px solid #222;z-index:1000;
}
.logo {color:#a855f7;font-weight:600;}
nav a {margin-left:20px;color:#aaa;text-decoration:none;}
nav a:hover {color:#a855f7;}

.section {padding:100px 40px 40px;}

.banner {
  height:250px;
  display:flex;align-items:center;
  font-size:28px;font-weight:600;
  background:linear-gradient(120deg,#0f0f1a,#1a1030);
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
  margin-top:20px;
}

.card {
  background:#12121a;border-radius:10px;
  overflow:hidden;transition:.3s;
}
.card:hover {transform:translateY(-5px);}
.card img {width:100%;height:240px;object-fit:cover;}

.btn {
  display:block;text-align:center;
  padding:8px;background:#a855f7;
  color:white;text-decoration:none;
}

.search input {
  width:100%;padding:10px;border:none;
  border-radius:8px;background:#12121a;color:white;
}
</style>
</head>

<body>

<header>
  <div class="logo">Noctra Core</div>
  <nav>
    <a href="#inicio">Início</a>
    <a href="#manhwas">Manhwas</a>
    <a href="https://discord.gg/JJ3xncPnm" target="_blank">Discord</a>
  </nav>
</header>

<!-- INICIO -->
<div id="inicio" class="section banner">
  Explore o universo Noctra
</div>

<div class="section">
  <div class="search">
    <input id="search" placeholder="Pesquisar..." onkeyup="buscar()">
  </div>
</div>

<!-- MANHWAS -->
<div id="manhwas" class="section">
  <h2>Manhwas</h2>

  <div class="grid">

    <div class="card">
      <img src="https://i.imgur.com/8Km9tLL.jpg">
      <a class="btn" href="manga.html">Ver obra</a>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/qIufhof.png">
      <a class="btn" href="manga.html">Ver obra</a>
    </div>

  </div>
</div>

<script>
function buscar(){
  let val=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display=c.innerText.toLowerCase().includes(val)?"block":"none";
  });
}
</script>

</body>
</html>
