<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>

<style>
body {
  margin:0;
  font-family:Segoe UI;
  background:#0a0a0f;
  color:white;
}

/* CONTAINER PADRÃO (CENTRALIZA TUDO) */
.container {
  max-width:1100px;
  margin:auto;
  padding:0 20px;
}

/* HEADER */
header {
  position:fixed;
  width:100%;
  top:0;
  left:0;
  display:flex;
  justify-content:center;
  background:rgba(10,10,15,0.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #1f1f2e;
  z-index:1000;
}

.header-content {
  width:100%;
  max-width:1100px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
}

.logo {
  color:#a855f7;
  font-weight:600;
}

nav a {
  margin-left:20px;
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

nav a:hover {
  color:#a855f7;
}

/* HERO */
.hero {
  margin-top:80px;
  height:260px;
  display:flex;
  align-items:center;
  font-size:32px;
  font-weight:600;
  background:linear-gradient(120deg,#0f0f1a,#1a1030);
}

.hero .container {
  width:100%;
}

/* SEARCH */
.search {
  padding:30px 0;
}

.search input {
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:#12121a;
  color:white;
  font-size:14px;
}

/* SECTION */
.section {
  padding:30px 0;
}

.section h2 {
  margin-bottom:20px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}

/* CARD */
.card {
  background:#12121a;
  border-radius:12px;
  overflow:hidden;
  transition:.3s;
  border:1px solid #1f1f2e;
}

.card:hover {
  transform:translateY(-6px);
  border-color:#a855f7;
}

.card img {
  width:100%;
  height:240px;
  object-fit:cover;
}

.card .info {
  padding:10px;
}

.card h3 {
  font-size:14px;
}

.btn {
  display:block;
  text-align:center;
  padding:8px;
  background:#a855f7;
  border-radius:6px;
  text-decoration:none;
  color:white;
  margin-top:8px;
  font-size:13px;
}

.btn:hover {
  background:#9333ea;
}

/* FOOTER */
footer {
  text-align:center;
  padding:30px;
  color:#666;
  border-top:1px solid #1f1f2e;
  margin-top:40px;
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">Noctra Core</div>

    <nav>
      <a href="#inicio">Início</a>
      <a href="#manhwas">Manhwas</a>
      <a href="https://discord.gg/JJ3xncPnm" target="_blank">Discord</a>
    </nav>
  </div>
</header>

<!-- INÍCIO -->
<div id="inicio" class="hero">
  <div class="container">
    Explore o universo Noctra
  </div>
</div>

<!-- PESQUISA -->
<div class="container search">
  <input id="search" placeholder="Pesquisar manhwa..." onkeyup="buscar()">
</div>

<!-- MANHWAS -->
<div id="manhwas" class="container section">
  <h2>Manhwas</h2>

  <div class="grid">

    <div class="card">
      <img src="https://i.imgur.com/8Km9tLL.jpg">
      <div class="info">
        <h3>Solo Leveling</h3>
        <a class="btn" href="manhwas.html">Ver obra</a>
      </div>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/qIufhof.png">
      <div class="info">
        <h3>Nano Machine</h3>
        <a class="btn" href="manhwas.html">Ver obra</a>
      </div>
    </div>

  </div>
</div>

<footer>
© Noctra Core • Todos os direitos reservados
</footer>

<script>
function buscar(){
  let val = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display = c.innerText.toLowerCase().includes(val) ? "block" : "none";
  });
}
</script>

</body>
</html>
