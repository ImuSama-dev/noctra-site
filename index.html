<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{background:#0b0b12;color:white;}

.container{max-width:1100px;margin:auto;padding:0 20px;}

header{
position:fixed;width:100%;top:0;
background:rgba(10,10,20,0.85);
backdrop-filter:blur(12px);
border-bottom:1px solid #1f1f2e;
z-index:1000;
}

.header-content{
display:flex;justify-content:space-between;align-items:center;
padding:15px 0;
}

.logo{display:flex;align-items:center;gap:10px;color:#c084fc;}

.logo-img{width:28px;height:28px;border-radius:50%;}

nav a{margin-left:20px;color:#aaa;text-decoration:none;}
nav a:hover{color:#c084fc;}

.user-box{display:flex;align-items:center;gap:10px;}

.hero{
margin-top:80px;height:300px;display:flex;align-items:center;
background:url('https://media.giphy.com/media/4TmLKfeYOuO2c/giphy.gif') center/cover;
}

.hero-text{z-index:2;}

.btn{
margin-top:20px;padding:10px 20px;background:#a855f7;
border-radius:10px;color:white;text-decoration:none;
}

.grid{
margin-top:40px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
}

.card{
background:#14141c;border-radius:14px;overflow:hidden;
cursor:pointer;position:relative;
}

.card img{width:100%;height:240px;object-fit:cover;}

.card h3{padding:10px;}

.fav{
position:absolute;top:10px;right:10px;
background:#000a;padding:6px;border-radius:50%;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<div class="container header-content">

<div class="logo">
<img src="noctra-logo.png" class="logo-img">
<span>Noctra Core</span>
</div>

<nav>
<a href="index.html">Início</a>
<a href="manhwas.html">Manhwas</a>
</nav>

<div class="user-box" id="userBox"></div>

</div>
</header>

<div class="hero">
<div class="container hero-text">
<h1>Explore o universo Noctra</h1>
<p>Leia manhwas com estilo</p>
</div>
</div>

<div class="container">
<div class="grid" id="grid"></div>
</div>

<script type="module">

// 🔥 FIREBASE (VERSÃO ESTÁVEL)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 SUA CONFIG (JÁ PRONTA)
const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjfFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:6cd65bc3a0267878e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const userBox = document.getElementById("userBox");
const grid = document.getElementById("grid");

let currentUser = null;
let favoritos = {};

// LOGIN
window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

// USUÁRIO
onAuthStateChanged(auth, async (user)=>{
  currentUser = user;

  if(user){
    userBox.innerHTML = `
      <img src="${user.photoURL}" width="30" style="border-radius:50%">
      <span>${user.displayName}</span>
      <button onclick="logout()">Sair</button>
    `;

    const snap = await getDoc(doc(db,"users",user.uid));
    if(snap.exists()){
      favoritos = snap.data();
    }

  } else {
    userBox.innerHTML = `<button onclick="login()">Entrar</button>`;
  }

  render();
});

// OBRAS
const obras = [
  {id:"solo",titulo:"Solo Leveling",capa:"https://i.imgur.com/8Km9tLL.jpg"},
  {id:"nano",titulo:"Nano Machine",capa:"https://i.imgur.com/qIufhof.png"}
];

// RENDER
function render(){
  grid.innerHTML = "";

  obras.forEach(o=>{
    const favAtivo = favoritos[o.id];

    let card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      <div class="fav" onclick="fav(event,'${o.id}')">
        ${favAtivo ? "💜" : "🤍"}
      </div>
      <img src="${o.capa}">
      <h3>${o.titulo}</h3>
    `;

    div.onclick = ()=> window.location.href = "manhwas.html?id="+o.id;

    grid.appendChild(card);
  });
}

// FAVORITO
window.fav = async (e,id)=>{
  e.stopPropagation();

  if(!currentUser){
    alert("Faça login primeiro");
    return;
  }

  favoritos[id] = !favoritos[id];

  await setDoc(doc(db,"users",currentUser.uid), favoritos);

  render();
};

</script>

</body>
</html>
