<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0b0b12;color:white;overflow-x:hidden;}

/* HEADER */
header{
  position:fixed;width:100%;top:0;background:rgba(15,15,25,0.95);backdrop-filter:blur(12px);border-bottom:1px solid #1f1f2e;z-index:1000;
}
.header-content{
  max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#c084fc;}
.logo-img{width:32px;height:32px;border-radius:50%;}
nav a{margin-left:20px;text-decoration:none;color:#aaa;transition:.3s;font-weight:500;}
nav a:hover{color:#a855f7;}
.user-box{display:flex;align-items:center;gap:10px;}
.user-box button{background:#a855f7;border:none;padding:6px 12px;border-radius:8px;color:white;cursor:pointer;transition:.3s;}
.user-box button:hover{background:#9333ea;}

/* HERO */
.hero{
  margin-top:80px;height:420px;display:flex;align-items:center;justify-content:center;
  background:url('https://i.imgur.com/OKgM4nY.jpg') center/cover no-repeat; /* anime-style background */
  position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;inset:0;background:rgba(10,10,20,0.6);}
.hero::before{content:"";position:absolute;width:600px;height:600px;background:rgba(168,85,247,0.2);filter:blur(140px);top:-150px;left:-150px;}
.hero-text{position:relative;z-index:2;text-align:center;max-width:700px;}
.hero h1{font-size:48px;text-shadow:0 0 15px #a855f7;font-weight:700;}
.hero p{color:#ddd;font-size:18px;margin-top:8px;text-shadow:0 0 8px #000;}
.btn{display:inline-block;margin-top:20px;padding:12px 28px;background:#a855f7;border-radius:12px;color:white;text-decoration:none;font-weight:600;transition:.3s;}
.btn:hover{background:#9333ea;transform:scale(1.05);}

/* SEARCH */
.search{margin:30px 0;}
.search input{width:100%;padding:14px;border-radius:12px;border:none;background:#14141c;color:white;box-shadow:0 0 10px rgba(168,85,247,0.2);}

/* GRID CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:25px;}
.card{background:#14141c;border-radius:14px;overflow:hidden;cursor:pointer;position:relative;transition:.3s;box-shadow:0 0 15px rgba(168,85,247,0.2);}
.card:hover{transform:translateY(-8px) scale(1.03);}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,#a855f7,transparent);opacity:0;}
.card:hover::after{opacity:0.2;}
.card img{width:100%;height:240px;object-fit:cover;border-bottom:1px solid #1f1f2e;}
.card h3{padding:12px;color:white;text-align:center;font-weight:600;letter-spacing:0.5px;}

/* FAVORITO */
.fav{position:absolute;top:10px;right:10px;background:#000a;padding:8px;border-radius:50%;cursor:pointer;transition:.2s;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:10;}
.fav:hover{transform:scale(1.3);}

/* FOOTER */
footer{text-align:center;padding:30px;color:#666;font-size:14px;}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img">
      <span>Noctra Core</span>
    </div>
    <nav>
      <a href="index.html">Início</a>
      <a href="manhwas.html">Manhwas</a>
      <a href="https://discord.gg/JJ3xncPnm" target="_blank">Discord</a>
    </nav>
    <div class="user-box" id="userBox"></div>
  </div>
</header>

<div class="hero">
  <div class="hero-text">
    <h1>Explore o universo Noctra</h1>
    <p>Leia manhwas com estilo e interatividade</p>
    <a href="manhwas.html" class="btn">Explorar</a>
  </div>
</div>

<div class="container search">
  <input id="search" placeholder="Pesquisar..." onkeyup="buscar()">
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<footer>© Noctra Core</footer>

<script type="module">
// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
    authDomain: "noctra-core.firebaseapp.com",
    projectId: "noctra-core",
    storageBucket: "noctra-core.firebasestorage.app",
    messagingSenderId: "506534658543",
    appId: "1:506534658543:web:14bd38c377336619e2f61a"
  };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const userBox = document.getElementById("userBox");
let currentUser = null;
let favoritos = {};

// LOGIN
function login(){signInWithPopup(auth,provider);}
function logout(){signOut(auth);}

// ESTADO
onAuthStateChanged(auth, async user=>{
  currentUser=user;
  if(user){
    userBox.innerHTML=`<img src="${user.photoURL}" width="30" style="border-radius:50%"><span>${user.displayName}</span><button onclick="logout()">Sair</button>`;
    const snap=await getDoc(doc(db,"users",user.uid));
    if(snap.exists()) favoritos=snap.data();
  } else userBox.innerHTML=`<button onclick="login()">Entrar</button>`;
  render(obras);
});
window.login=login; window.logout=logout;

// MANHWAS
const obras=[
  {id:"solo",titulo:"Solo Leveling",capa:"https://i.imgur.com/8Km9tLL.jpg"},
  {id:"nano",titulo:"Nano Machine",capa:"https://i.imgur.com/qIufhof.png"}
];

const grid=document.getElementById("grid");

function render(lista){
  grid.innerHTML="";
  lista.forEach(o=>{
    let isFav=favoritos[o.id];
    let div=document.createElement("div");
    div.className="card";
    div.innerHTML=`<div class="fav" onclick="fav(event,'${o.id}')">${isFav?"💜":"🤍"}</div><img src="${o.capa}"><h3>${o.titulo}</h3>`;
    div.onclick=()=>window.location.href="manhwas.html?id="+o.id;
    grid.appendChild(div);
  });
}

// FAVORITOS
window.fav=async function(e,id){
  e.stopPropagation();
  if(!currentUser){alert("Faça login primeiro");return;}
  favoritos[id]=!favoritos[id];
  await setDoc(doc(db,"users",currentUser.uid),favoritos);
  render(obras);
}

// BUSCA
window.buscar=function(){
  let val=document.getElementById("search").value.toLowerCase();
  render(obras.filter(o=>o.titulo.toLowerCase().includes(val)));
}
render(obras);
</script>

</body>
</html>
