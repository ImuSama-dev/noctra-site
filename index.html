<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0b0b10;
  color:white;
}

/* HEADER */
header{
  position:fixed;
  width:100%;
  top:0;
  background:#0f0f17;
  border-bottom:1px solid #1f1f2e;
  z-index:1000;
}

.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.logo{
  color:#a855f7;
  font-weight:bold;
}

nav a{
  margin-left:20px;
  color:#aaa;
  text-decoration:none;
}

nav a:hover{
  color:#a855f7;
}

/* HERO */
.hero{
  margin-top:70px;
  height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  background:linear-gradient(120deg,#0f0f1a,#1a1030);
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:#14141c;
  border-radius:12px;
  overflow:hidden;
  transition:.3s;
  cursor:pointer;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card h3{
  padding:10px;
  font-size:14px;
}

/* SEARCH */
.search{
  margin-bottom:20px;
}

.search input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#14141c;
  color:white;
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">Noctra Core</div>

    <nav>
      <a href="#">Início</a>
      <a href="manhwas.html">Manhwas</a>
      <a href="https://discord.gg/JJ3xncPnm" target="_blank">Discord</a>
    </nav>
  </div>
</header>

<div class="hero">
Explore o universo Noctra
</div>

<div class="container">

<div class="search">
<input placeholder="Pesquisar..." onkeyup="buscar(this.value)">
</div>

<div class="grid" id="grid">

<div class="card" onclick="abrir('solo.html')">
<img src="https://i.imgur.com/8Km9tLL.jpg">
<h3>Solo Leveling</h3>
</div>

<div class="card" onclick="abrir('nano.html')">
<img src="https://i.imgur.com/qIufhof.png">
<h3>Nano Machine</h3>
</div>

</div>

</div>

<script>
function abrir(pagina){
  window.location.href = pagina;
}

function buscar(val){
  val = val.toLowerCase();
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display = c.innerText.toLowerCase().includes(val) ? "block" : "none";
  });
}
</script>

</body>
</html>
