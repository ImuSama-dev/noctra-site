<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>
<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif;}
body{background:#0b0b12;color:white;overflow-x:hidden;}

/* CONTAINER AJUSTADO */
.container{max-width:900px;margin:auto;padding:20px;}

/* HEADER */
header{position:fixed;width:100%;top:0;background:#111a2e;border-bottom:1px solid #1f1f2e;backdrop-filter:blur(10px);z-index:1000;}
.header-content{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;color:#c084fc;}
.logo-img{width:28px;height:28px;border-radius:50%;}
nav a{margin-left:20px;text-decoration:none;color:#aaa;transition:.3s;}
nav a:hover{color:#c084fc;}
.user-box{display:flex;align-items:center;gap:10px;}

/* HERO */
.hero{margin-top:80px;height:280px;display:flex;align-items:center;position:relative;background:url('https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmZ3a2k0Yjk2OTIwMWhhNjE1Mjh1ZWVvYTk0bHVyNTM1YWZnYWJuZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/4TmLKfeYOuO2c/giphy.gif') center/cover no-repeat;}
.hero::after{content:"";position:absolute;inset:0;background:rgba(10,10,20,0.65);}
.hero::before{content:"";position:absolute;width:400px;height:400px;background:rgba(168,85,247,0.15);filter:blur(100px);top:-80px;left:-80px;}
.hero-text{position:relative;z-index:2;}
.hero h1{font-size:36px;}
.hero p{color:#bbb;}
.btn{display:inline-block;margin-top:15px;padding:10px 20px;background:#a855f7;border-radius:10px;text-decoration:none;color:white;transition:.3s;}
.btn:hover{background:#9333ea;transform:scale(1.05);}

/* SEARCH */
.search{margin-top:-30px;}
.search input{width:100%;padding:12px;border-radius:12px;border:none;background:#14141c;color:white;}

/* GRID */
.grid{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;}

/* CARD */
.card{background:#14141c;border-radius:14px;overflow:hidden;cursor:pointer;transition:.3s;position:relative;}
.card:hover{transform:translateY(-5px) scale(1.02);}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,#a855f7,transparent);opacity:0;}
.card:hover::after{opacity:0.2;}
.fav{position:absolute;top:10px;right:10px;background:#000a;padding:6px;border-radius:50%;cursor:pointer;transition:.2s;}
.fav:hover{transform:scale(1.2);}
.card img{width:100%;height:240px;object-fit:cover;}
.card h3{padding:12px;}

/* FOOTER */
footer{text-align:center;padding:30px;color:#666;}
</style>
</head>

<body>

<header>
  <div class="container header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img">
      <span>Noctra Core</span>
    </div>
    <nav>
      <a href="index.html">Início</a>
      <a href="manhwas.html">Manhwas</a>
      <a href="https://discord.gg/JJ3xncPnm" target="_blank">Discord</a>
    </nav>
    <div class="user-box" id="userBox"></div>
  </div>
</header>
  
<div class="hero">
  <div class="container hero-text">
    <h1>Explore o universo Noctra</h1>
    <p>Leia manhwas com estilo e interatividade</p>
    <a href="manhwas.html" class="btn">Explorar</a>
  </div>
</div>

<div class="container search">
  <input id="search" placeholder="Pesquisar..." onkeyup="buscar()">
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<footer>© Noctra Core</footer>

<script type="module">
// 🔥 FIREBASE CONFIG (MANTER)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const userBox = document.getElementById("userBox");
let currentUser = null;
let favoritos = {};

// LOGIN / LOGOUT
function login(){ signInWithPopup(auth, provider); }
function logout(){ signOut(auth); }

onAuthStateChanged(auth, async user=>{
  currentUser = user;
  if(user){
    userBox.innerHTML = `<img src="${user.photoURL}" width="30" style="border-radius:50%"><span>${user.displayName}</span><button onclick="logout()">Sair</button>`;
    const snap = await getDoc(doc(db,"users",user.uid));
    if(snap.exists()) favoritos = snap.data();
  } else {
    userBox.innerHTML = `<button onclick="login()">Entrar</button>`;
  }
  render(obras);
});

window.login = login;
window.logout = logout;

// OBRAS
const obras = [
  {id:"solo",titulo:"Solo Leveling",capa:"https://i.imgur.com/8Km9tLL.jpg"},
  {id:"nano",titulo:"Nano Machine",capa:"https://i.imgur.com/qIufhof.png"}
];

const grid = document.getElementById("grid");

function render(lista){
  grid.innerHTML="";
  lista.forEach(o=>{
    let isFav = favoritos[o.id];
    let div=document.createElement("div");
    div.className="card";
    div.innerHTML = `
      <div class="fav" onclick="fav(event,'${o.id}')">${isFav ? "💜" : "🤍"}</div>
      <img src="${o.capa}">
      <h3>${o.titulo}</h3>
    `;

    // clique do card
    div.addEventListener("click", () => {
      window.location.href = "manhwas.html?id=" + o.id;
    });

    grid.appendChild(div);
  });
}

// função favoritar (fora do render)
window.fav = async function(e, id) {
  e.stopPropagation(); // evita que o clique no coração abra o manhwa
  if(!currentUser){
    alert("Faça login primeiro");
    return;
  }

  favoritos[id] = !favoritos[id];
  await setDoc(doc(db,"users",currentUser.uid), favoritos, { merge:true });
  render(obras); // atualiza os corações
}
  // Salvar no Firestore
  await setDoc(doc(db,"users",currentUser.uid), favoritos, { merge:true });

  // Atualizar a grid para mostrar o estado atual
  render(obras);
};

// BUSCA
window.buscar = function(){
  let val=document.getElementById("search").value.toLowerCase();
  render(obras.filter(o=>o.titulo.toLowerCase().includes(val)));
}

render(obras);

</script>
</body>
</html>
