<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctra Core</title>
<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0b0b12;color:white;overflow-x:hidden;}

/* HEADER */
header{position:fixed;width:100%;top:0;background:rgba(10,10,20,0.85);backdrop-filter:blur(12px);border-bottom:1px solid #1f1f2e;z-index:1000;}
.header-content{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;color:#c084fc;}
.logo-img{width:28px;height:28px;border-radius:50%;}
nav a{margin-left:15px;text-decoration:none;color:#aaa;transition:.3s;}
nav a:hover{color:#c084fc;}
.user-box{display:flex;align-items:center;gap:10px;}

/* HERO */
.hero{margin-top:80px;height:280px;display:flex;align-items:center;justify-content:center;position:relative;background:#1a1030;border-radius:15px;margin-bottom:20px;}
.hero-text{text-align:center;}
.hero h1{font-size:36px;}
.hero p{color:#bbb;}
.btn{display:inline-block;margin-top:15px;padding:10px 20px;background:#a855f7;border-radius:10px;text-decoration:none;color:white;transition:.3s;cursor:pointer;}
.btn:hover{background:#9333ea;transform:scale(1.05);}

/* SEARCH */
.search{margin:0 20px 20px 20px;}
.search input{width:100%;padding:12px;border-radius:12px;border:none;background:#14141c;color:white;}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;margin:0 20px 40px 20px;}
.card{background:#14141c;border-radius:14px;overflow:hidden;cursor:pointer;transition:.3s;position:relative;}
.card:hover{transform:translateY(-5px) scale(1.02);}
.card img{width:100%;height:240px;object-fit:cover;}
.card h3{padding:12px;text-align:center;}
.fav{position:absolute;top:10px;right:10px;background:#000a;padding:6px;border-radius:50%;cursor:pointer;transition:.2s;z-index:2;}
.fav:hover{transform:scale(1.2);}

/* FOOTER */
footer{text-align:center;padding:30px;color:#666;}
</style>
</head>

<body>

<header>
  <div class="container header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img">
      <span>Noctra Core</span>
    </div>
    <nav>
      <a href="index.html">Início</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="manhwas.html">Manhwas</a>
    </nav>
    <div class="user-box" id="userBox">
      <!-- Botão Entrar será renderizado pelo JS -->
    </div>
  </div>
</header>

<div class="hero">
  <div class="hero-text">
    <h1>Explore o universo Noctra</h1>
    <p>Leia manhwas com estilo e interatividade</p>
    <div class="btn" onclick="location.href='manhwas.html'">Explorar</div>
  </div>
</div>

<div class="search">
  <input id="search" placeholder="Pesquisar manhwa..." onkeyup="buscar()">
</div>

<div class="grid" id="grid"></div>

<footer>© Noctra Core</footer>

<script type="module">
// 🔥 FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const grid = document.getElementById("grid");
const userBox = document.getElementById("userBox");
let currentUser = null;
let favoritos = {};

// LOGIN
function login(){ signInWithPopup(auth, provider); }
function logout(){ signOut(auth); }

onAuthStateChanged(auth, async user=>{
  currentUser = user;
  if(user){
    userBox.innerHTML = `<img src="${user.photoURL}" width="30" style="border-radius:50%"><span>${user.displayName}</span> <button onclick="logout()">Sair</button>`;
    const snap = await getDoc(doc(db,"users",user.uid));
    if(snap.exists()) favoritos = snap.data();
  } else {
    userBox.innerHTML = `<button onclick="login()">Entrar</button>`;
  }
  render(obras);
});

window.login = login;
window.logout = logout;

// MANHWAS DE EXEMPLO
const obras = [
  {id:"solo",titulo:"Solo Leveling",capa:"https://i.imgur.com/8Km9tLL.jpg"},
  {id:"nano",titulo:"Nano Machine",capa:"https://i.imgur.com/qIufhof.png"},
  {id:"tower",titulo:"Tower of God",capa:"https://i.imgur.com/4AiXzf8.jpeg"},
  {id:"bleach",titulo:"Bleach",capa:"https://i.imgur.com/Yv2Jt0I.jpeg"},
  {id:"naruto",titulo:"Naruto",capa:"https://i.imgur.com/9iQhx0P.jpeg"}
];

// RENDER CARDS COM FAVORITOS FUNCIONANDO
function render(lista){
  grid.innerHTML="";
  lista.forEach(o=>{
    let isFav = favoritos[o.id];
    let div=document.createElement("div");
    div.className="card";
    div.innerHTML = `
      <div class="fav" onclick="fav(event,'${o.id}')">${isFav?"💜":"🤍"}</div>
      <img src="${o.capa}">
      <h3>${o.titulo}</h3>
    `;
    div.addEventListener("click",()=>window.location.href="manhwas.html?id="+o.id);
    grid.appendChild(div);
  });
}

// FAVORITAR
window.fav = async function(e,id){
  e.stopPropagation();
  if(!currentUser){ alert("Faça login primeiro"); return; }
  favoritos[id] = !favoritos[id];
  await setDoc(doc(db,"users",currentUser.uid), favoritos, {merge:true});
  render(obras);
}

// BUSCA
window.buscar = function(){
  let val = document.getElementById("search").value.toLowerCase();
  render(obras.filter(o=>o.titulo.toLowerCase().includes(val)));
}

render(obras);
</script>

</body>
</html>
