<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwas • Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0b0b12;color:white;overflow-x:hidden;}
header{position:fixed;width:100%;top:0;background:rgba(10,10,20,0.95);backdrop-filter:blur(12px);border-bottom:1px solid #1f1f2e;z-index:1000;}
.header-content{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;color:#c084fc;}
nav a{margin-left:20px;text-decoration:none;color:#aaa;transition:.3s;}
nav a:hover{color:#c084fc;}
.user-box{display:flex;align-items:center;gap:10px;}
.back{color:#aaa;text-decoration:none;}
.back:hover{color:#c084fc;}
.container{max-width:1100px;margin:auto;padding:100px 20px 40px;}
.banner{display:flex;gap:25px;margin-bottom:30px;align-items:flex-start;}
.banner img{width:200px;border-radius:12px;box-shadow:0 0 20px #000;}
.info h1{font-size:28px;margin-bottom:10px;}
.info p{color:#aaa;margin-bottom:10px;}
.actions{margin-top:10px;display:flex;gap:10px;}
.btn{padding:8px 14px;background:#a855f7;border-radius:8px;cursor:pointer;color:white;text-align:center;}
.btn:hover{background:#9333ea;}
.cap-list{margin-top:20px;display:flex;flex-direction:column;gap:10px;}
.cap{background:#14141c;padding:14px;border-radius:10px;display:flex;justify-content:space-between;cursor:pointer;transition:.2s;}
.cap:hover{background:#1c1c2a;transform:translateX(5px);}
.search input{width:100%;padding:12px;border-radius:10px;border:none;background:#14141c;color:white;}
.chat{margin-top:30px;}
.chat h3{margin-bottom:10px;}
.chat-box{background:#14141c;padding:12px;border-radius:10px;max-height:200px;overflow-y:auto;margin-bottom:10px;}
.chat-input{display:flex;gap:10px;}
.chat-input input{flex:1;padding:10px;border-radius:8px;border:none;background:#1c1c2a;color:white;}
.chat-input button{padding:10px 20px;border-radius:8px;background:#a855f7;color:white;cursor:pointer;border:none;}
.chat-input button:hover{background:#9333ea;}
.vote{display:flex;gap:10px;margin-top:10px;}
.vote button{padding:6px 12px;border-radius:6px;background:#a855f7;color:white;border:none;cursor:pointer;}
.vote button:hover{background:#9333ea;}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">Noctra Core</div>
    <a href="index.html" class="back">← Voltar</a>
    <div class="user-box" id="userBox"></div>
  </div>
</header>

<div class="container">
  <div class="banner">
    <img id="capa">
    <div class="info">
      <h1 id="titulo"></h1>
      <p id="desc">Descrição em breve...</p>

      <div class="actions">
        <div class="btn" id="lerInicioBtn">Ler do início</div>
      </div>

      <div id="continue"></div>
    </div>
  </div>

  <div class="search">
    <input id="search" placeholder="Buscar capítulo..." onkeyup="buscarCap()">
  </div>

  <div class="cap-list" id="caps"></div>

  <div class="chat">
    <h3>Comentários</h3>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Digite seu comentário...">
      <button onclick="enviarComentario()">Enviar</button>
    </div>
  </div>

  <div class="vote">
    <button onclick="votar('like')">👍 Gostei <span id="likesCount">0</span></button>
    <button onclick="votar('dislike')">👎 Não gostei <span id="dislikesCount">0</span></button>
  </div>
</div>

<script type="module">
// 🔥 FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const id = params.get("id");
if(!id){ alert("Manhwa não encontrado"); location.href="index.html"; }

// Manhwas de exemplo
const obras = {
  solo:{ nome:"Solo Leveling", capa:"https://i.imgur.com/8Km9tLL.jpg", caps:10 },
  nano:{ nome:"Nano Machine", capa:"https://i.imgur.com/qIufhof.png", caps:8 },
  tower:{ nome:"Tower of God", capa:"https://i.imgur.com/4AiXzf8.jpeg", caps:12 },
  bleach:{ nome:"Bleach", capa:"https://i.imgur.com/Yv2Jt0I.jpeg", caps:15 },
  naruto:{ nome:"Naruto", capa:"https://i.imgur.com/9iQhx0P.jpeg", caps:20 }
};

const dados = obras[id];
if(!dados){ alert("Obra não existe"); location.href="index.html"; }

// RENDER INFO
document.getElementById("titulo").innerText = dados.nome;
document.getElementById("capa").src = dados.capa;

// RENDER CAPS
const capsDiv = document.getElementById("caps");
let listaCaps = [];
for(let i=1;i<=dados.caps;i++) listaCaps.push(i); // corrigido ordem crescente

function renderCaps(lista){
  capsDiv.innerHTML="";
  lista.forEach(i=>{
    let div=document.createElement("div");
    div.className="cap";
    div.innerHTML = `<div>Capítulo ${i}</div><span>→ Ler</span>`;
    div.onclick=()=> window.location.href=`reader.html?id=${id}&cap=${i}`;
    capsDiv.appendChild(div);
  });
}
renderCaps(listaCaps);

// BUSCA
window.buscarCap = function(){
  let val = document.getElementById("search").value.toLowerCase();
  renderCaps(listaCaps.filter(c => ("capítulo "+c).toLowerCase().includes(val)));
}

// CONTINUAR
onAuthStateChanged(auth, async user=>{
  if(!user) return;
  const snap = await getDoc(doc(db,"progress",user.uid));
  if(!snap.exists()) return;
  const prog = snap.data()[id];
  if(prog) document.getElementById("continue").innerHTML=`<div class="btn" onclick="window.location.href='reader.html?id=${id}&cap=${prog.cap}'">Continuar Capítulo ${prog.cap}</div>`;
});

// BOTÃO LER INICIO
document.getElementById("lerInicioBtn").onclick = () => { window.location.href=`reader.html?id=${id}&cap=1`; }

// CHAT
const chatBox = document.getElementById("chatBox");
const chatCollection = collection(db,"chat",id,"mensagens");
const q = query(chatCollection, orderBy("createdAt","asc"));
onSnapshot(q,snap=>{
  chatBox.innerHTML="";
  snap.forEach(doc=> chatBox.innerHTML += `<div><strong>${doc.data().user}:</strong> ${doc.data().msg}</div>`);
});
window.enviarComentario = async ()=>{
  const msgInput = document.getElementById("chatInput");
  if(!auth.currentUser){ alert("Faça login para comentar"); return; }
  if(msgInput.value.trim()==="") return;
  await addDoc(chatCollection,{ user: auth.currentUser.displayName, msg: msgInput.value, createdAt: new Date() });
  msgInput.value="";
}

// LIKES/DISLIKES
const likesCount = document.getElementById("likesCount");
const dislikesCount = document.getElementById("dislikesCount");
async function carregarVotes(){
  const snap = await getDoc(doc(db,"votes",id));
  if(snap.exists()){
    likesCount.innerText = snap.data().likes||0;
    dislikesCount.innerText = snap.data().dislikes||0;
  }
}
carregarVotes();
window.votar = async function(tipo){
  if(!auth.currentUser){ alert("Faça login para votar"); return; }
  const ref = doc(db,"votes",id);
  const snap = await getDoc(ref);
  let likes=0,dislikes=0;
  if(snap.exists()){ likes=snap.data().likes||0; dislikes=snap.data().dislikes||0; }
  if(tipo==="like") likes++; else dislikes++;
  await setDoc(ref,{likes,dislikes});
  likesCount.innerText = likes;
  dislikesCount.innerText = dislikes;
}

</script>
</body>
</html>
