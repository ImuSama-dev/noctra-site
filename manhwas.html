<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwa • Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,rgba(168,85,247,.16),transparent 35%),#08080f;
  color:white;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  background:#111;
  border-bottom:1px solid #222;
  z-index:1000;
}

.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#c084fc;
  font-weight:700;
}

.logo img{
  width:28px;
  height:28px;
  border-radius:50%;
}

nav a{
  margin-left:15px;
  text-decoration:none;
  color:#aaa;
}

nav a:hover{color:#c084fc;}

.user-box{display:flex;gap:10px;align-items:center;}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}

.card{
  background:#14141c;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.3s;
}

.card:hover{transform:scale(1.03);}

.card img{
  width:100%;
  height:240px;
  object-fit:cover;
}

.card h3{
  padding:10px;
  text-align:center;
}

.banner{
  display:flex;
  gap:20px;
  margin-bottom:20px;
}

.banner img{
  width:200px;
  border-radius:12px;
}

.info h1{margin-bottom:10px;}

.cap{
  background:#14141c;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
}

.cap:hover{background:#1f1f2e;}

.chat{
  margin-top:20px;
  background:#14141c;
  padding:15px;
  border-radius:12px;
}

.chat-box{
  max-height:250px;
  overflow:auto;
  margin-bottom:10px;
}

.chat-message{
  margin-bottom:8px;
}

</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      <img src="noctra-logo.png">
      Noctra Core
    </div>

    <nav>
      <a href="index.html">Início</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="manhwas.html">Manhwas</a>
      <a href="admin.html" id="adminBtn" style="display:none;">Admin</a>
    </nav>

    <div class="user-box" id="userBox"></div>
  </div>
</header>

<div class="container" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  getDoc,
  addDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core"
};

const ADMIN_UIDS = ["yeckgLVGVIMrMiByikAj8FpbjTm2"];

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);
const provider = new GoogleAuthProvider();

const app = document.getElementById("app");
const userBox = document.getElementById("userBox");
const adminBtn = document.getElementById("adminBtn");

let currentUser = null;
let obras = [];

/* LOGIN */
function renderUser(user){
  if(user){
    userBox.innerHTML = `
      <img src="${user.photoURL}" width="30" style="border-radius:50%">
      <span>${user.displayName}</span>
      <button onclick="logout()">Sair</button>
    `;
  }else{
    userBox.innerHTML = `<button onclick="login()">Entrar</button>`;
  }
}

window.login = ()=>signInWithPopup(auth,provider);
window.logout = ()=>signOut(auth);

/* CARREGAR MANHWAS */
async function carregarObras(){
  obras = [];

  try{
    const snap = await getDocs(collection(db,"manhwas"));
    snap.forEach(doc=>{
      obras.push({id:doc.id,...doc.data()});
    });
  }catch(e){
    console.log("Usando exemplo");
  }

  if(obras.length === 0){
    obras = [
      {id:"solo",nome:"Solo Leveling",capa:"https://i.imgur.com/8Km9tLL.jpg",caps:10},
      {id:"nano",nome:"Nano Machine",capa:"https://i.imgur.com/qIufhof.png",caps:8}
    ];
  }
}

/* LISTA */
function renderLista(){
  app.innerHTML = `<div class="grid"></div>`;
  const grid = app.querySelector(".grid");

  obras.forEach(o=>{
    const div=document.createElement("div");
    div.className="card";

    div.innerHTML = `
      <img src="${o.capa}">
      <h3>${o.nome}</h3>
    `;

    div.onclick=()=>location.href=`manhwas.html?id=${o.id}`;

    grid.appendChild(div);
  });
}

/* DETALHE */
async function renderDetalhe(id){
  const obra = obras.find(o=>o.id===id);

  app.innerHTML=`
    <div class="banner">
      <img src="${obra.capa}">
      <div class="info">
        <h1>${obra.nome}</h1>
        <button onclick="location.href='reader.html?id=${id}&cap=1'">Ler</button>
      </div>
    </div>

    <div id="caps"></div>
  `;

  const capsDiv=document.getElementById("caps");

  for(let i=1;i<=obra.caps;i++){
    const c=document.createElement("div");
    c.className="cap";
    c.innerText="Capítulo "+i;
    c.onclick=()=>location.href=`reader.html?id=${id}&cap=${i}`;
    capsDiv.appendChild(c);
  }
}

/* INIT */
onAuthStateChanged(auth,async(user)=>{
  currentUser=user;
  renderUser(user);

  if(user && ADMIN_UIDS.includes(user.uid)){
    adminBtn.style.display="inline";
  }

  await carregarObras();

  const params=new URLSearchParams(location.search);
  const id=params.get("id");

  if(id) renderDetalhe(id);
  else renderLista();
});
</script>

</body>
</html>
