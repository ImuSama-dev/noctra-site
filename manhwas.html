<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwa • Noctra</title>
  
<link rel="icon" href="./noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif;}
body{background:#0b0b12;color:white;}

header{
position:fixed;width:100%;top:0;
background:rgba(10,10,20,0.9);
backdrop-filter:blur(10px);
border-bottom:1px solid #1f1f2e;
z-index:1000;
}

.header-content{
max-width:1100px;margin:auto;
display:flex;justify-content:space-between;align-items:center;
padding:15px 20px;
}

.logo{color:#c084fc;font-weight:600;}
.back{color:#aaa;text-decoration:none;}
.back:hover{color:#c084fc;}

.container{
max-width:1100px;margin:auto;
padding:100px 20px 40px;
}

.banner{display:flex;gap:25px;margin-bottom:30px;}
.banner img{width:200px;border-radius:12px;}

.info h1{font-size:28px;margin-bottom:10px;}
.info p{color:#aaa;}

.actions{margin-top:10px;display:flex;gap:10px;}

.btn{
padding:8px 14px;background:#a855f7;
border-radius:8px;cursor:pointer;
}

.cap-list{margin-top:20px;display:flex;flex-direction:column;gap:10px;}

.cap{
background:#14141c;padding:14px;border-radius:10px;
display:flex;justify-content:space-between;
cursor:pointer;
}

.cap:hover{background:#1c1c2a;}

.search input{
width:100%;padding:12px;border-radius:10px;
border:none;background:#14141c;color:white;
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">Noctra Core</div>
    <a href="index.html" class="back">← Voltar</a>
  </div>
</header>

<div class="container">

<div class="banner">
  <img id="capa">
  <div class="info">
    <h1 id="titulo"></h1>
    <p>Descrição em breve...</p>

    <div class="actions">
      <div class="btn" onclick="lerInicio()">Ler do início</div>
    </div>

    <div id="continue"></div>
  </div>
</div>

<div class="search">
  <input id="search" placeholder="Buscar capítulo..." onkeyup="buscarCap()">
</div>

<div class="cap-list" id="caps"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

 const firebaseConfig = {
    apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
    authDomain: "noctra-core.firebaseapp.com",
    projectId: "noctra-core",
    storageBucket: "noctra-core.firebasestorage.app",
    messagingSenderId: "506534658543",
    appId: "1:506534658543:web:14bd38c377336619e2f61a"
  };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// OBRAS
const obras = {
  solo:{ nome:"Solo Leveling", capa:"https://i.imgur.com/8Km9tLL.jpg", caps:10 },
  nano:{ nome:"Nano Machine", capa:"https://i.imgur.com/qIufhof.png", caps:8 }
};

// PEGAR ID
const params = new URLSearchParams(location.search);
let id = params.get("id");

// Se entrou em manhwas.html sem id, abre o primeiro manhwa automaticamente
if(!id){
  id = "solo";
}

const dados = obras[id];

if(!dados){
  alert("Manhwa não encontrado");
  location.href = "index.html";
}

// SETAR INFO
document.getElementById("titulo").innerText = dados.nome;
document.getElementById("capa").src = dados.capa;

// INICIO
window.lerInicio = () => {
  window.location.href = `reader.html?id=${id}&cap=1`;
};

// CAPS
const capsDiv = document.getElementById("caps");
let listaCaps = [];

for(let i=dados.caps;i>=1;i--) listaCaps.push(i);

function renderCaps(lista){
  capsDiv.innerHTML="";
  lista.forEach(i=>{
    let div=document.createElement("div");
    div.className="cap";
    div.innerHTML=`<div>Capítulo ${i}</div><span>→ Ler</span>`;
    div.onclick=()=> window.location.href = `reader.html?id=${id}&cap=${i}`;
    capsDiv.appendChild(div);
  });
}

renderCaps(listaCaps);

// BUSCA
window.buscarCap = function(){
  let val = document.getElementById("search").value.toLowerCase();
  let filtrado = listaCaps.filter(c => ("capítulo "+c).includes(val));
  renderCaps(filtrado);
};

// CONTINUAR
onAuthStateChanged(auth, async user=>{
  if(!user) return;

  const snap = await getDoc(doc(db,"progress",user.uid));
  if(!snap.exists()) return;

  const prog = snap.data()[id];

  if(prog){
    document.getElementById("continue").innerHTML=`
      <div class="btn" onclick="location.href='reader.html?id=${id}&cap=${prog.cap}'">
        Continuar Capítulo ${prog.cap}
      </div>
    `;
  }
});

</script>

</body>
</html>
