<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwas • Noctra</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0b0b10;
  color:white;
}

/* HEADER */
header{
  position:fixed;
  width:100%;
  top:0;
  background:#0f0f17;
  border-bottom:1px solid #1f1f2e;
  z-index:1000;
}

.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.logo{
  color:#a855f7;
  font-weight:bold;
}

nav a{
  margin-left:20px;
  color:#aaa;
  text-decoration:none;
}

nav a:hover{
  color:#a855f7;
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  padding:90px 20px 20px;
}

/* SEARCH */
.search{
  margin-bottom:20px;
}

.search input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#14141c;
  color:white;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:#14141c;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card h3{
  padding:10px;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">Noctra Core</div>

    <nav>
      <a href="index.html">Início</a>
      <a href="manhwas.html">Manhwas</a>
    </nav>
  </div>
</header>

<div class="container">

  <!-- 🔍 PESQUISA -->
  <div class="search">
    <input id="search" placeholder="Pesquisar manhwa..." onkeyup="buscar()">
  </div>

  <!-- 📚 LISTA -->
  <div class="grid" id="grid"></div>

</div>

<script>

// 🔥 BANCO DE DADOS
const obras = [
  {
    id: "solo",
    titulo: "Solo Leveling",
    capa: "https://i.imgur.com/8Km9tLL.jpg"
  },
  {
    id: "nano",
    titulo: "Nano Machine",
    capa: "https://i.imgur.com/qIufhof.png"
  }
];

// CARREGAR CARDS
const grid = document.getElementById("grid");

function render(lista){
  grid.innerHTML = "";

  lista.forEach(o => {
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${o.capa}">
      <h3>${o.titulo}</h3>
    `;

    div.onclick = () => {
      window.location.href = "manga.html?id=" + o.id;
    };

    grid.appendChild(div);
  });
}

render(obras);

// 🔍 BUSCA
function buscar(){
  let val = document.getElementById("search").value.toLowerCase();

  let filtrados = obras.filter(o =>
    o.titulo.toLowerCase().includes(val)
  );

  render(filtrados);
}

</script>

</body>
</html>
