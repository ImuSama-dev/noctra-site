<style>
*{margin:0;padding:0;box-sizing:border-box}

nav{display:flex;align-items:center;gap:18px}nav a{text-decoration:none;color:#aaa;font-size:14px}nav a:hover,nav a.active{color:#f9a8d4}.user-box{display:flex;gap:10px;align-items:center;min-width:max-content}.user-name{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ddd;font-size:13px}
.btn,.user-box button{border:none;background:linear-gradient(135deg,#ff2f68,#a855f7);color:white;padding:10px 14px;border-radius:9px;font-family:Poppins,sans-serif;font-weight:800;cursor:pointer;transition:.2s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(236,72,153,.18)}.btn:hover,.user-box button:hover{transform:translateY(-1px);filter:brightness(1.08)}
.container{max-width:1160px;margin:auto;padding:28px 18px 55px}.page-title{font-size:30px;margin-bottom:6px;color:#fff}.subtitle{color:#aaa;margin-bottom:24px;font-size:14px}.search-box{margin-bottom:18px}.search-box input{width:100%;padding:14px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(14,14,24,.88);color:white;font-family:Poppins,sans-serif;outline:none;box-shadow:0 10px 26px rgba(0,0,0,.25)}.search-box input:focus{border-color:#f472b6;box-shadow:0 0 0 4px rgba(236,72,153,.12)}
.category-filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}.category-btn{border:1px solid rgba(255,255,255,.10);background:rgba(20,20,32,.82);color:#ddd;padding:8px 13px;border-radius:999px;cursor:pointer;font-family:Poppins,sans-serif;font-size:13px}.category-btn:hover,.category-btn.active{border-color:#f472b6;color:white;background:rgba(236,72,153,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px}.card{background:rgba(18,18,28,.92);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;cursor:pointer;transition:.25s;box-shadow:0 12px 28px rgba(0,0,0,.38)}.card:hover{transform:translateY(-6px);border-color:rgba(236,72,153,.65);box-shadow:0 18px 38px rgba(0,0,0,.5)}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#1b1b2b}.card h3{padding:12px;text-align:center;font-size:14px;line-height:1.35}
.detail-hero{min-height:430px;display:grid;grid-template-columns:250px minmax(0,1fr) 230px;gap:36px;align-items:center;padding:38px 18px 48px;margin-bottom:8px;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 60px rgba(0,0,0,.38);position:relative;overflow:hidden}.detail-hero:before{content:"";position:absolute;inset:-1px;background:radial-gradient(circle at 18% 22%,rgba(236,72,153,.14),transparent 28%),radial-gradient(circle at 78% 68%,rgba(168,85,247,.12),transparent 30%);pointer-events:none}.detail-hero>*{position:relative}

.rating-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}.stars{display:flex;gap:2px}.star{border:none;background:transparent;color:#56525f;font-size:32px;line-height:1;cursor:pointer;padding:0;text-shadow:0 8px 22px rgba(0,0,0,.35)}.star.on{color:#ffd84d}.star:hover{color:#fff07a}.rating-number{font-size:24px;font-weight:800}.rating-help{color:#b8b3c4;font-size:12px;margin-bottom:18px}

.side-info{display:grid;gap:26px;align-self:center}.side-line{display:grid;grid-template-columns:92px 1fr;gap:14px;font-size:14px}.side-line strong{font-weight:800}.social-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;text-align:center}.stat-card{background:rgba(14,14,24,.68);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 10px}.stat-icon{color:#ff3154;font-size:28px;display:block;margin-bottom:8px}.stat-text{color:#f1f1f1;font-size:13px;line-height:1.25}
.synopsis-box{max-width:920px;margin:0 auto 26px;padding:24px 4px 6px;color:#d2ceda;line-height:1.75;font-size:15px}.section-title{margin:24px 0 12px;font-size:20px;color:#f5f0ff}.cap-list{background:rgba(20,20,28,.78);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden}.cap{min-height:50px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.2s;color:#f4f4f4}.cap:hover{background:rgba(236,72,153,.10);padding-left:24px}.cap strong{font-size:14px}.cap span{color:#aaa;font-size:12px;font-style:italic}.show-more{display:block;margin:22px auto 48px;background:transparent;border:none;color:#f4f4f4;font-family:Poppins,sans-serif;font-size:16px;font-weight:800;cursor:pointer}
.comments-shell{max-width:780px;margin:0 auto;padding-top:12px}.login-comment{border-top:1px solid rgba(255,255,255,.22);padding:22px 0;text-align:center;color:#999}.comment-box{display:flex;gap:10px;margin:14px 0 22px}.comment-box textarea{width:100%;min-height:84px;resize:vertical;border:1px solid rgba(255,255,255,.10);background:rgba(14,14,24,.88);color:white;border-radius:10px;padding:12px;font-family:Poppins,sans-serif;outline:none}.comment-box textarea:focus{border-color:#00d1aa}.comment-title-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.22);margin-bottom:30px}.comment-title{padding:0 18px 8px 6px;border-bottom:2px solid #00d1aa;color:#e7e7e7;font-size:14px;font-weight:800;letter-spacing:1px}.sorts{display:flex;gap:16px;color:#aaa;font-size:13px}
.comment{display:grid;grid-template-columns:54px 1fr;gap:18px;margin-bottom:26px}.reply-comment{margin-left:72px;grid-template-columns:42px 1fr}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#333;border:3px solid #111}.reply-comment .avatar{width:42px;height:42px}.comment-name{color:#00d1aa;font-size:14px;margin-bottom:4px}.comment-date{color:#aaa;font-size:11px;border-bottom:1px dashed #008f78;padding-bottom:8px;margin-bottom:12px}.comment-text{color:#d7d3de;line-height:1.6;font-size:15px;padding-right:10px;white-space:pre-wrap}.reply-btn{margin-top:10px;background:none;border:none;color:#00d1aa;cursor:pointer;font-family:Poppins,sans-serif}.replying{background:#171722;border-left:3px solid #00d1aa;border-radius:8px;padding:10px;margin-bottom:10px;color:#ccc;font-size:13px}.cancel-reply{color:#fca5a5;cursor:pointer;display:inline-block;margin-top:6px}.empty{background:rgba(20,20,28,.84);border:1px solid rgba(255,255,255,.08);padding:24px;border-radius:10px;text-align:center;color:#bbb}
@media(max-width:930px){.detail-hero{grid-template-columns:210px 1fr}.side-info{grid-column:1/-1;grid-template-columns:1fr 1fr}}@media(max-width:760px){.header-content{flex-wrap:wrap;justify-content:center}nav{order:3;width:100%;justify-content:center;gap:16px;flex-wrap:wrap}.container{padding:24px 12px 40px}.grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}.detail-hero{grid-template-columns:1fr;text-align:center;gap:20px;padding:24px 14px}.cover{margin:auto;max-width:220px}.top-badges,.rating-row,.actions{justify-content:center}.info-table{grid-template-columns:1fr;text-align:left;max-width:380px;margin:auto}.side-info{grid-template-columns:1fr;max-width:380px;margin:auto}.side-line{grid-template-columns:1fr 1fr;text-align:left}.comment{grid-template-columns:44px 1fr;gap:12px}.reply-comment{margin-left:28px}.avatar{width:44px;height:44px}.comment-box{flex-direction:column}.user-name{display:none}}
</style>

<header><div class="header-content"><div class="logo"><img src="noctra-logo.png" alt="Noctra"><span>Noctra Core</span></div><nav><a href="index.html">Inicio</a><a href="favoritos.html">Favoritos</a><a href="manhwas.html" class="active">Manhwas</a><a href="admin.html" id="adminBtn" style="display:none;">Admin</a></nav><div class="user-box" id="userBox"></div></div></header>
<main class="container" id="app"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const firebaseConfig={apiKey:"AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",authDomain:"noctra-core.firebaseapp.com",projectId:"noctra-core"};
const ADMIN_UIDS=["yeckgLVGVIMrMiByikAj8FpbjTm2"],fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider(),app=document.getElementById("app"),userBox=document.getElementById("userBox"),adminBtn=document.getElementById("adminBtn");
let currentUser=null,obras=[],favoritos={},visibleCaps=10,replyingTo=null;
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function info(v){return String(v||"").trim()||"Nao informado"}
function dataCurta(v){if(!v)return"";const d=v.toDate?v.toDate():new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleDateString("pt-BR")}
function isAdmin(){return currentUser&&ADMIN_UIDS.includes(currentUser.uid)}
function renderUser(user){if(user){const adm=isAdmin();userBox.innerHTML=`<img src="${user.photoURL||"noctra-logo.png"}" width="30" height="30" style="border-radius:50%;object-fit:cover"><span class="user-name">${esc(user.displayName||"Usuario")}${adm?" - ADM":""}</span><button onclick="logout()">Sair</button>`;adminBtn.style.display=adm?"inline":"none"}else{userBox.innerHTML=`<button onclick="login()">Entrar</button>`;adminBtn.style.display="none"}}
window.login=()=>signInWithPopup(auth,provider);window.logout=()=>signOut(auth);
async function carregarFavoritos(){favoritos={};if(!currentUser)return;const snap=await getDoc(doc(db,"users",currentUser.uid));if(snap.exists())favoritos=snap.data()||{}}
async function carregarObras(){obras=[];try{const snap=await getDocs(collection(db,"manhwas"));snap.forEach(i=>obras.push({id:i.id,...i.data()}));obras.sort((a,b)=>String(a.nome||a.titulo||"").localeCompare(String(b.nome||b.titulo||"")))}catch(e){console.warn(e)}}
function obraVisivel(o){return isAdmin()||o.publicado!==false&&o.published!==false}
function renderLista(catSel="Todos",texto=""){const cats=["Todos","Yuri","Yaoi","GL","BL","Romance","Drama","Acao","Fantasia","Escolar","Vida adulta","Psicologico","Comedia","Terror","Misterio","Sobrenatural","Historico","+18"];app.innerHTML=`<h1 class="page-title">Manhwas</h1><p class="subtitle">Escolha uma obra para ver detalhes, sinopse, capitulos e comentarios.</p><div class="search-box"><input id="searchManhwa" placeholder="Pesquisar manhwa..." value="${esc(texto)}"></div><div class="category-filters">${cats.map(c=>`<button class="category-btn ${catSel===c?"active":""}" data-category="${c}">${c}</button>`).join("")}</div><div class="grid" id="grid"></div>`;const grid=document.getElementById("grid"),q=texto.toLowerCase().trim();const filtradas=obras.filter(o=>obraVisivel(o)&&(catSel==="Todos"||(Array.isArray(o.categorias)&&o.categorias.includes(catSel)))&&String(o.nome||o.titulo||"").toLowerCase().includes(q));if(!filtradas.length)grid.innerHTML=`<div class="empty">Nenhuma obra encontrada.</div>`;filtradas.forEach(o=>{const div=document.createElement("div");div.className="card";div.innerHTML=`<img src="${o.capa||"noctra-logo.png"}" alt="${esc(o.nome||o.titulo||"Obra")}"><h3>${esc(o.nome||o.titulo||"Sem titulo")}${obraVisivel(o)&&o.publicado===false?"<br><small>Rascunho</small>":""}</h3>`;div.onclick=()=>location.href=`manhwas.html?id=${encodeURIComponent(o.id)}`;grid.appendChild(div)});document.querySelectorAll(".category-btn").forEach(b=>b.onclick=()=>renderLista(b.dataset.category,document.getElementById("searchManhwa")?.value||""));const s=document.getElementById("searchManhwa");s.oninput=()=>renderLista(catSel,s.value);s.focus();s.setSelectionRange(s.value.length,s.value.length)}
async function ratingData(id){try{const snap=await getDocs(collection(db,"manhwas",id,"ratings"));let sum=0,user=0;snap.forEach(d=>{const v=Number(d.data().value||0);sum+=v;if(currentUser&&d.id===currentUser.uid)user=v});const count=snap.size,avg=count?sum/count:0;return{avg,count,user}}catch{return{avg:0,count:0,user:0}}}
async function contarComentarios(id){try{return(await getDocs(collection(db,"manhwas",id,"comments"))).size}catch{return 0}}
function starsHtml(userRating){let out="";for(let i=1;i<=5;i++)out+=`<button class="star ${i<=userRating?"on":""}" data-rate="${i}" title="Votar ${i} estrela(s)">&#9733;</button>`;return out}
async function renderDetalhe(id){const obra=obras.find(o=>o.id===id);if(!obra||!obraVisivel(obra)){app.innerHTML=`<div class="empty">Obra nao encontrada.<br><br><button class="btn" onclick="location.href='manhwas.html'">Voltar para manhwas</button></div>`;return}
const nome=obra.nome||obra.titulo||"Sem titulo",capa=obra.capa||"noctra-logo.png",desc=info(obra.desc||obra.descricao),totalCaps=Math.max(1,Number(obra.caps||obra.totalCaps||1)),cats=Array.isArray(obra.categorias)?obra.categorias:[],rt=await ratingData(id),comentarios=await contarComentarios(id),favTexto=favoritos[id]?"Favoritado":"Favoritar";
app.innerHTML=`<section class="detail-hero"><div><div class="top-badges">${cats.includes("+18")?`<span class="age-badge">18+</span>`:""}${obra.novo||obra.new?`<span class="new-badge">Novo</span>`:""}<span class="title-line">${esc(nome)}</span></div><img class="cover" src="${capa}" alt="${esc(nome)}"></div><div class="info"><div class="rating-row"><div class="stars" id="stars">${starsHtml(rt.user||0)}</div><div class="rating-number" id="ratingNumber">${rt.avg.toFixed(1)}</div></div><div class="rating-help" id="ratingHelp">Media ${rt.avg.toFixed(1)} / 5 com ${rt.count} voto(s). ${currentUser?"Clique nas estrelas para votar.":"Faca login para votar."}</div><div class="info-table"><strong>Nota</strong><span id="ratingText">Media ${rt.avg.toFixed(1)} / 5 entre ${rt.count} voto(s)</span><strong>Posicao</strong><span>${esc(info(obra.rank))}</span><strong>Alternativo</strong><span>${esc(info(obra.alternativo||obra.alternative))}</span><strong>Autor(es)</strong><span>${esc(info(obra.autor||obra.author))}</span><strong>Artista(s)</strong><span>${esc(info(obra.artista||obra.artist))}</span><strong>Genero(s)</strong><span class="genre-list">${cats.length?cats.map(c=>`<span>${esc(c)}</span>`).join(""):"Nao informado"}</span><strong>Tipo</strong><span>${esc(info(obra.tipo||obra.type))}</span><strong>Capitulos</strong><span>${totalCaps}</span></div><div class="actions"><a class="btn" href="reader.html?id=${encodeURIComponent(id)}&cap=1">Ler primeiro</a><a class="btn" href="reader.html?id=${encodeURIComponent(id)}&cap=${totalCaps}">Ler ultimo</a><button class="btn" id="favBtn">${favTexto}</button></div></div><aside class="side-info"><div><div class="side-line"><strong>Lancamento</strong><span>${esc(info(obra.ano||obra.release))}</span></div><div class="side-line" style="margin-top:14px"><strong>Situacao</strong><span>${esc(info(obra.status))}</span></div></div><div class="social-stats"><div class="stat-card"><span class="stat-icon">◆</span><div class="stat-text">${comentarios} comentario(s)</div></div><div class="stat-card"><span class="stat-icon">★</span><div class="stat-text">${esc(info(obra.bookmarks))}<br>favoritaram</div></div></div></aside></section><div class="synopsis-box">${esc(desc)}</div><h2 class="section-title">Capitulos</h2><div class="cap-list" id="caps"></div><button class="show-more" id="showMoreBtn" style="display:none">Mostrar mais</button><section class="comments-shell"><div id="replyingBox"></div>${currentUser?`<div class="comment-box"><textarea id="commentText" placeholder="Escreva seu comentario..."></textarea><button class="btn" id="sendComment">Enviar</button></div>`:`<div class="login-comment">Faca login para comentar</div>`}<div class="comment-title-row"><div class="comment-title" id="commentCount">${comentarios} COMENTARIOS</div><div class="sorts"><span>Mais recentes</span></div></div><div id="commentsList"></div></section>`;
document.getElementById("favBtn").onclick=()=>favoritar(id);document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>votar(id,Number(b.dataset.rate)));const capsDiv=document.getElementById("caps"),show=document.getElementById("showMoreBtn");function capsDraw(){capsDiv.innerHTML="";for(let i=totalCaps;i>=1&&i>totalCaps-visibleCaps;i--){const c=document.createElement("div");c.className="cap";c.innerHTML=`<strong>Capitulo ${i}</strong><span>${dataCurta(obra.createdAt)||"Ler"}</span>`;c.onclick=()=>location.href=`reader.html?id=${encodeURIComponent(id)}&cap=${i}`;capsDiv.appendChild(c)}show.style.display=visibleCaps<totalCaps?"block":"none"}show.onclick=()=>{visibleCaps+=10;capsDraw()};capsDraw();const send=document.getElementById("sendComment");if(send)send.onclick=()=>enviarComentario(id);await carregarComentarios(id)}
async function votar(id,value){if(!currentUser){alert("Faca login para votar.");await signInWithPopup(auth,provider);return}try{await setDoc(doc(db,"manhwas",id,"ratings",currentUser.uid),{value,uid:currentUser.uid,name:currentUser.displayName||"Usuario",updatedAt:serverTimestamp()},{merge:true});visibleCaps=10;await renderDetalhe(id)}catch(e){console.error(e);alert("Nao foi possivel registrar seu voto. Verifique as regras do Firestore para ratings.")}}
function atualizarReply(){const box=document.getElementById("replyingBox");if(!box)return;if(!replyingTo){box.innerHTML="";return}box.innerHTML=`<div class="replying">Respondendo ${esc(replyingTo.name)}:<br>"${esc(replyingTo.text)}"<br><span class="cancel-reply" id="cancelReply">Cancelar resposta</span></div>`;document.getElementById("cancelReply").onclick=()=>{replyingTo=null;atualizarReply()}}
async function enviarComentario(id){if(!currentUser)return;const textarea=document.getElementById("commentText"),text=textarea.value.trim();if(!text)return;try{await addDoc(collection(db,"manhwas",id,"comments"),{text,uid:currentUser.uid,name:currentUser.displayName||"Usuario",photo:currentUser.photoURL||"noctra-logo.png",parentId:replyingTo?.id||null,createdAt:serverTimestamp()});textarea.value="";replyingTo=null;atualizarReply();await carregarComentarios(id)}catch(e){console.error(e);alert("Nao foi possivel enviar o comentario. Verifique as regras do Firestore para comments.")}}
async function carregarComentarios(id){const list=document.getElementById("commentsList"),count=document.getElementById("commentCount");if(!list)return;list.innerHTML=`<div class="empty">Carregando comentarios...</div>`;try{const snap=await getDocs(query(collection(db,"manhwas",id,"comments"),orderBy("createdAt","desc")));const all=[];snap.forEach(i=>all.push({id:i.id,...i.data()}));if(count)count.textContent=`${all.length} COMENTARIOS`;if(!all.length){list.innerHTML=`<div class="empty">Nenhum comentario ainda.</div>`;return}const parents=all.filter(c=>!c.parentId),replies=all.filter(c=>c.parentId);function item(c,rep=false){return`<article class="comment ${rep?"reply-comment":""}" data-id="${c.id}"><img class="avatar" src="${c.photo||"noctra-logo.png"}"><div><div class="comment-name">${esc(c.name||"Usuario")}</div><div class="comment-date">${dataCurta(c.createdAt)||"Agora"}</div><div class="comment-text">${esc(c.text)}</div>${currentUser?`<button class="reply-btn" data-reply="${c.id}">Responder</button>`:""}</div></article>`}list.innerHTML=parents.map(p=>item(p)+replies.filter(r=>r.parentId===p.id).reverse().map(r=>item(r,true)).join("")).join("");document.querySelectorAll("[data-reply]").forEach(b=>b.onclick=()=>{const c=all.find(x=>x.id===b.dataset.reply);replyingTo={id:c.id,name:c.name||"Usuario",text:c.text||""};atualizarReply();document.getElementById("commentText")?.focus()})}catch(e){list.innerHTML=`<div class="empty">Nao foi possivel carregar comentarios. Verifique as regras do Firestore.</div>`}}
async function favoritar(id){if(!currentUser){alert("Faca login para favoritar.");return}favoritos[id]=!favoritos[id];await setDoc(doc(db,"users",currentUser.uid),favoritos,{merge:true});await renderDetalhe(id)}
async function iniciar(){await carregarFavoritos();await carregarObras();const id=new URLSearchParams(location.search).get("id");if(id){visibleCaps=10;await renderDetalhe(id)}else renderLista()}
onAuthStateChanged(auth,async user=>{currentUser=user;renderUser(user);await iniciar()});
</script>
