<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwa • Noctra</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#0b0b12;
  color:white;
}

/* HEADER */
header{
  position:fixed;
  width:100%;
  top:0;
  background:rgba(10,10,20,0.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #1f1f2e;
  z-index:1000;
}

.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
}

.logo{
  color:#c084fc;
  font-weight:600;
}

.back{
  color:#aaa;
  text-decoration:none;
}

.back:hover{
  color:#c084fc;
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  padding:100px 20px 40px;
}

/* BANNER */
.banner{
  display:flex;
  gap:25px;
  align-items:flex-start;
  margin-bottom:30px;
}

.banner img{
  width:200px;
  border-radius:12px;
  box-shadow:0 0 20px #000;
}

.info h1{
  font-size:28px;
  margin-bottom:10px;
}

.info p{
  color:#aaa;
  margin-bottom:10px;
}

/* BOTÕES */
.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.btn{
  padding:8px 14px;
  background:#a855f7;
  border-radius:8px;
  cursor:pointer;
  text-decoration:none;
  color:white;
  font-size:13px;
  transition:.2s;
}

.btn:hover{
  background:#9333ea;
}

/* CONTINUAR */
#continue{
  margin-top:10px;
}

/* BADGE */
.badge{
  display:inline-block;
  padding:4px 10px;
  background:#a855f7;
  border-radius:6px;
  font-size:12px;
}

/* CAPÍTULOS */
.cap-section{
  margin-top:30px;
}

.cap-title{
  font-size:20px;
  margin-bottom:15px;
}

.cap-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* CARD CAP */
.cap{
  background:#14141c;
  padding:14px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:.2s;
}

.cap:hover{
  background:#1c1c2a;
  transform:translateX(5px);
}

.cap span{
  color:#aaa;
  font-size:13px;
}

/* SEARCH */
.search{
  margin-top:20px;
}

.search input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#14141c;
  color:white;
}

/* FOOTER */
footer{
  text-align:center;
  padding:30px;
  color:#666;
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">Noctra Core</div>
    <a href="index.html" class="back">← Voltar</a>
  </div>
</header>

<div class="container">

  <!-- BANNER -->
  <div class="banner">
    <img id="capa">

    <div class="info">
      <h1 id="titulo"></h1>
      <p id="desc">Descrição do manhwa aparecerá aqui futuramente.</p>
      <span class="badge">Atualizando</span>

      <!-- BOTÕES -->
      <div class="actions">
        <div class="btn" onclick="lerInicio()">Ler do início</div>
      </div>

      <!-- CONTINUAR -->
      <div id="continue"></div>

    </div>
  </div>

  <!-- SEARCH -->
  <div class="search">
    <input id="search" placeholder="Buscar capítulo..." onkeyup="buscarCap()">
  </div>

  <!-- CAPÍTULOS -->
  <div class="cap-section">
    <div class="cap-title">Capítulos</div>
    <div class="cap-list" id="caps"></div>
  </div>

</div>

<footer>
© Noctra Core
</footer>

<script type="module">

// FIREBASE (USANDO O MESMO PADRÃO DO SEU INDEX)
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC...",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

// PEGAR ID
const params = new URLSearchParams(location.search);
const id = params.get("id");

if(!id){
  alert("Manhwa não encontrado");
  location.href="index.html";
}

// DADOS
const obras = {
  solo:{
    nome:"Solo Leveling",
    capa:"https://i.imgur.com/8Km9tLL.jpg",
    caps: 10
  },
  nano:{
    nome:"Nano Machine",
    capa:"https://i.imgur.com/qIufhof.png",
    caps: 8
  }
};

const dados = obras[id];

// SETAR INFO
document.getElementById("titulo").innerText = dados.nome;
document.getElementById("capa").src = dados.capa;

// BOTÃO INICIO
window.lerInicio = function(){
  window.location.href = `reader.html?id=${id}&cap=1`;
}

// GERAR CAPS
const capsDiv = document.getElementById("caps");
let listaCaps = [];

for(let i = dados.caps; i >= 1; i--){
  listaCaps.push(i);
}

function renderCaps(lista){
  capsDiv.innerHTML = "";

  lista.forEach(i=>{
    let div = document.createElement("div");
    div.className = "cap";

    div.innerHTML = `
      <div>Capítulo ${i}</div>
      <span>→ Ler</span>
    `;

    div.onclick = ()=>{
      window.location.href = `reader.html?id=${id}&cap=${i}`;
    };

    capsDiv.appendChild(div);
  });
}

renderCaps(listaCaps);

// BUSCA
window.buscarCap = function(){
  let val = document.getElementById("search").value;

  let filtrado = listaCaps.filter(c =>
    ("Capítulo "+c).toLowerCase().includes(val.toLowerCase())
  );

  renderCaps(filtrado);
}

// 🔥 CONTINUAR LEITURA
onAuthStateChanged(auth, async user=>{
  if(!user) return;

  const snap = await getDoc(doc(db,"progress",user.uid));

  if(!snap.exists()) return;

  const prog = snap.data()[id];

  if(prog){
    document.getElementById("continue").innerHTML = `
      <div class="btn" onclick="location.href='reader.html?id=${id}&cap=${prog}'">
        Continuar Capítulo ${prog}
      </div>
    `;
  }
});

</script>

</body>
</html>
