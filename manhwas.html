<script type="module">

function escaparHTML(texto){
  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function dataCurta(valor){
  if(!valor) return "";
  const data = valor.toDate ? valor.toDate() : new Date(valor);
  if(Number.isNaN(data.getTime())) return "";
  return data.toLocaleDateString("pt-BR");
}

function renderUser(user){
  if(user){
    const isAdmin = ADMIN_UIDS.includes(user.uid);
    const adminTag = isAdmin ? " • ADM" : "";

    userBox.innerHTML = `
      <img src="${user.photoURL || "noctra-logo.png"}" width="30" height="30" style="border-radius:50%;object-fit:cover;">

      <button onclick="logout()">Sair</button>

  }else{

}

window.login = ()=>signInWithPopup(auth,provider);
window.logout = ()=>signOut(auth);

async function carregarFavoritos(){
  favoritos = {};
  if(!currentUser) return;

  const snap = await getDoc(doc(db,"users",currentUser.uid));
  if(snap.exists()) favoritos = snap.data() || {};
}

async function carregarObras(){
  obras = [];

  try{
    const snap = await getDocs(collection(db,"manhwas"));
    const mapa = new Map();

    snap.forEach(item=>{
      mapa.set(item.id,{
        id:item.id,
        ...item.data()
      });
    });

    obras = [...mapa.values()].sort((a,b)=>{
      const nomeA = String(a.nome || a.titulo || "");
      const nomeB = String(b.nome || b.titulo || "");
      return nomeA.localeCompare(nomeB);
    });

  }catch(e){
    console.warn("Erro ao carregar manhwas:", e);
  }
}

function renderLista(categoriaSelecionada = "Todos", textoPesquisa = ""){
  const categorias = [
    "Todos","Yuri","Yaoi","GL","BL","Romance","Drama","Ação","Fantasia",
    "Escolar","Vida adulta","Psicológico","Comédia","Terror","Mistério",
    "Sobrenatural","Histórico","+18"
  ];

  app.innerHTML = `
    <h1 class="page-title">Manhwas</h1>
    <p class="subtitle">Escolha uma obra para ver detalhes, sinopse, capítulos e comentários.</p>

    <div class="search-box">
      <input id="searchManhwa" placeholder="Pesquisar manhwa..." value="${escaparHTML(textoPesquisa)}">
    </div>

    <div class="category-filters" id="categoryFilters">
      ${categorias.map(cat=>`
        <button class="category-btn ${categoriaSelecionada === cat ? "active" : ""}" data-category="${cat}">
          ${cat}
        </button>
      `).join("")}
    </div>

    <div class="grid" id="grid"></div>
  `;

  const grid = document.getElementById("grid");
  const pesquisa = textoPesquisa.toLowerCase().trim();

  const obrasFiltradas = obras.filter(o=>{
    const categoriasOk =
      categoriaSelecionada === "Todos"
      || (Array.isArray(o.categorias) && o.categorias.includes(categoriaSelecionada));

    const nome = String(o.nome || o.titulo || "").toLowerCase();
    return categoriasOk && nome.includes(pesquisa);
  });

  if(obrasFiltradas.length === 0){
    grid.innerHTML = `<div class="empty">Nenhuma obra encontrada.</div>`;
  }

  obrasFiltradas.forEach(o=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${o.capa || "noctra-logo.png"}" alt="${escaparHTML(o.nome || o.titulo || "Obra")}">
      <h3>${escaparHTML(o.nome || o.titulo || "Sem título")}</h3>
    `;

    div.onclick = ()=>location.href = `manhwas.html?id=${encodeURIComponent(o.id)}`;
    grid.appendChild(div);
  });

  document.querySelectorAll(".category-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const search = document.getElementById("searchManhwa");
      renderLista(btn.dataset.category, search ? search.value : "");
    };
  });

  const search = document.getElementById("searchManhwa");

  if(search){
    search.addEventListener("input",()=>renderLista(categoriaSelecionada, search.value));
    search.focus();
    search.setSelectionRange(search.value.length, search.value.length);
  }
}

async function contarComentarios(id){
  try{
    const snap = await getDocs(collection(db,"manhwas",id,"comments"));
    return snap.size;
  }catch(e){
    return 0;
  }
}

  const nome = obra.nome || obra.titulo || "Sem título";

          <span>${escaparHTML(alternativo)}</span>

          <button class="btn" onclick="location.href='reader.html?id=${encodeURIComponent(id)}&cap=1'">Read First</button>
          <button class="btn" onclick="location.href='reader.html?id=${encodeURIComponent(id)}&cap=${totalCaps}'">Read Last</button>
          <button class="btn" id="favBtn">${favTexto}</button>
        </div>
      </div>

      <aside class="side-info">
        <div>
          <div class="side-line">
            <strong>Release</strong>
            <span>${escaparHTML(ano)}</span>
          </div>
          <div class="side-line" style="margin-top:14px;">
            <strong>Status</strong>
            <span>${escaparHTML(status)}</span>
          </div>
        </div>

        <div class="social-stats">
          <div>
            <span class="stat-icon">▰</span>
            <div class="stat-text">${comentarios} comments</div>
          </div>

          <div>
            <span class="stat-icon">▮</span>
            <div class="stat-text">${escaparHTML(bookmarks)} Users<br>bookmarked This</div>
          </div>
        </div>
      </aside>
    </section>

    <div class="synopsis-box">
      ${escaparHTML(desc)}
    </div>

    <h2 class="section-title">Capítulos</h2>
    <div class="cap-list" id="caps"></div>
    <button class="show-more" id="showMoreBtn" style="display:none;">Show more⌄</button>

    <section class="comments-shell">
      <div class="subscribe-row">✉ Subscribe⌄</div>

      ${currentUser ? `
        <div class="comment-box">
          <textarea id="commentText" placeholder="Escreva seu comentário..."></textarea>
          <button class="btn" id="sendComment">Enviar</button>
        </div>
      ` : `
        <div class="login-comment">Please login to comment</div>
      `}

      <div class="comment-title-row">
        <div class="comment-title" id="commentCount">${comentarios} COMMENTS</div>
        <div class="sorts">
          <span>⚡</span>
          <span>🔥</span>
          <span>Newest⌄</span>
        </div>
      </div>

      <div id="commentsList"></div>
    </section>
  `;

  document.getElementById("favBtn").onclick = ()=>favoritar(id);

  const capsDiv = document.getElementById("caps");
  const showMoreBtn = document.getElementById("showMoreBtn");

  function desenharCaps(){
    capsDiv.innerHTML = "";

    for(let i = totalCaps; i >= 1 && i > totalCaps - visibleCaps; i--){
      const c = document.createElement("div");
      c.className = "cap";
      c.innerHTML = `
        <strong>Episode ${i}</strong>
        <span>${dataCurta(obra.createdAt) || ""}</span>
      `;

      c.onclick = ()=>location.href = `reader.html?id=${encodeURIComponent(id)}&cap=${i}`;
      capsDiv.appendChild(c);
    }

    showMoreBtn.style.display = visibleCaps < totalCaps ? "block" : "none";
  }

  showMoreBtn.onclick = ()=>{
    visibleCaps += 10;
    desenharCaps();
  };

  desenharCaps();

  const sendComment = document.getElementById("sendComment");

  if(sendComment){
    sendComment.onclick = async()=>{
      const textarea = document.getElementById("commentText");
      const texto = textarea.value.trim();

      if(!texto) return;

      await addDoc(collection(db,"manhwas",id,"comments"),{
        text:texto,
        uid:currentUser.uid,
        name:currentUser.displayName || "Usuário",
        photo:currentUser.photoURL || "noctra-logo.png",
        createdAt:serverTimestamp()
      });

      textarea.value = "";
      await carregarComentarios(id);
    };
  }

  await carregarComentarios(id);
}

async function carregarComentarios(id){
  const list = document.getElementById("commentsList");
  const count = document.getElementById("commentCount");
  if(!list) return;

  list.innerHTML = `<div class="empty">Carregando comentários...</div>`;

  try{
    const q = query(collection(db,"manhwas",id,"comments"), orderBy("createdAt","desc"));
    const snap = await getDocs(q);
    const comentarios = [];

    snap.forEach(item=>comentarios.push({id:item.id,...item.data()}));

    if(count) count.textContent = `${comentarios.length} COMMENTS`;

    if(comentarios.length === 0){
      list.innerHTML = `<div class="empty">Nenhum comentário ainda.</div>`;
      return;
    }

    list.innerHTML = comentarios.map(c=>`
      <article class="comment">
        <img class="avatar" src="${c.photo || "noctra-logo.png"}" alt="${escaparHTML(c.name || "Usuário")}">

        <div class="comment-body">
          <div class="comment-name">${escaparHTML(c.name || "Usuário")}</div>
          <div class="comment-date">◷ ${dataCurta(c.createdAt)}</div>
          <div class="comment-text">${escaparHTML(c.text)}</div>

          <div class="vote-row">
            <button class="vote">+</button>
            <strong>0</strong>
            <button class="vote">−</button>
          </div>
        </div>
      </article>
    `).join("");

  }catch(e){
    list.innerHTML = `
      <div class="empty">
        Não foi possível carregar os comentários. Verifique as regras do Firestore para a coleção de comentários.
      </div>
    `;
  }
}

async function favoritar(id){
  if(!currentUser){
    alert("Faça login para favoritar.");
    return;
  }

  favoritos[id] = !favoritos[id];
  await setDoc(doc(db,"users",currentUser.uid), favoritos, {merge:true});

  const params = new URLSearchParams(location.search);
  const obraId = params.get("id");

  if(obraId){
    visibleCaps = 10;
    renderDetalhe(obraId);
  }else{
    renderLista();
  }
}

async function iniciar(){
  await carregarFavoritos();
  await carregarObras();

  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  if(id){
    visibleCaps = 10;
    await renderDetalhe(id);
  }else{
    renderLista();
  }
}

onAuthStateChanged(auth,async(user)=>{
  currentUser = user;
  renderUser(user);
  await iniciar();
});
</script>
