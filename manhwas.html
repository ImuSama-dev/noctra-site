<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwa • Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top,rgba(168,85,247,.16),transparent 35%),
    #08080f;
  color:white;
  overflow-x:hidden;
}

header{
  position:sticky;
  top:0;
  background:rgba(12,12,20,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index:1000;
}

.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:14px 18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#e9d5ff;
  font-weight:700;
  white-space:nowrap;
}

.logo img{
  width:30px;
  height:30px;
  border-radius:50%;
}

nav{
  display:flex;
  align-items:center;
  gap:18px;
}

nav a{
  text-decoration:none;
  color:#aaa;
  font-size:14px;
}

nav a:hover,
nav a.active{
  color:#c084fc;
}

.user-box{
  display:flex;
  gap:10px;
  align-items:center;
  min-width:max-content;
}

.user-box button,
.btn{
  border:none;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;
  padding:9px 14px;
  border-radius:999px;
  font-family:'Poppins',sans-serif;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 16px rgba(168,85,247,.25);
}

.user-name{
  max-width:130px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#ddd;
  font-size:13px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:34px 18px 50px;
}

.page-title{
  font-size:28px;
  margin-bottom:6px;
}

.subtitle{
  color:#aaa;
  margin-bottom:24px;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:22px;
}

.card{
  background:#14141c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}

.card:hover{
  transform:translateY(-5px);
  border-color:rgba(168,85,247,.55);
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#1b1b2b;
}

.card h3{
  padding:12px;
  text-align:center;
  font-size:14px;
  line-height:1.35;
}

.detail-hero{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:28px;
  align-items:start;
  background:rgba(20,20,32,.88);
  border:1px solid rgba(255,255,255,.08);
  border-radius:26px;
  padding:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.42);
  margin-bottom:28px;
}

.cover{
  width:100%;
  max-width:230px;
  border-radius:18px;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#1b1b2b;
  box-shadow:0 12px 28px rgba(0,0,0,.45);
}

.info h1{
  font-size:34px;
  margin-bottom:10px;
  color:#f5f0ff;
}

.synopsis-title{
  font-size:15px;
  color:#e9d5ff;
  font-weight:700;
  margin:18px 0 8px;
}

.synopsis{
  color:#c9c9d6;
  line-height:1.7;
  max-width:760px;
  font-size:15px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:14px 0;
}

.badge{
  background:#0f0f18;
  border:1px solid rgba(255,255,255,.08);
  padding:8px 12px;
  border-radius:999px;
  color:#ddd;
  font-size:13px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.section-title{
  margin:28px 0 14px;
  font-size:22px;
  color:#f5f0ff;
}

.cap-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.cap{
  background:#14141c;
  border:1px solid rgba(255,255,255,.07);
  padding:15px 16px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:.2s;
}

.cap:hover{
  background:#1c1c2a;
  transform:translateX(4px);
  border-color:rgba(168,85,247,.45);
}

.cap span{
  color:#aaa;
  font-size:13px;
}

.empty{
  background:#14141c;
  border:1px solid rgba(255,255,255,.08);
  padding:24px;
  border-radius:18px;
  text-align:center;
  color:#bbb;
}

@media(max-width:760px){
  .header-content{
    flex-wrap:wrap;
    justify-content:center;
  }

  nav{
    order:3;
    width:100%;
    justify-content:center;
    gap:16px;
  }

  .container{
    padding:26px 12px 40px;
  }

  .grid{
    grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
    gap:14px;
  }

  .detail-hero{
    grid-template-columns:1fr;
    text-align:center;
    padding:18px;
  }

  .cover{
    margin:auto;
    max-width:190px;
  }

  .info h1{
    font-size:26px;
  }

  .synopsis{
    text-align:left;
  }

  .meta,
  .actions{
    justify-content:center;
  }

  .user-name{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      <img src="noctra-logo.png" alt="Noctra">
      <span>Noctra Core</span>
    </div>

    <nav>
      <a href="index.html">Início</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="manhwas.html" class="active">Manhwas</a>
      <a href="admin.html" id="adminBtn" style="display:none;">Admin</a>
    </nav>

    <div class="user-box" id="userBox"></div>
  </div>
</header>

<main class="container" id="app"></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core"
};

const ADMIN_UIDS = ["yeckgLVGVIMrMiByikAj8FpbjTm2"];

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);
const provider = new GoogleAuthProvider();

const app = document.getElementById("app");
const userBox = document.getElementById("userBox");
const adminBtn = document.getElementById("adminBtn");

let currentUser = null;
let obras = [];
let favoritos = {};

function renderUser(user){
  if(user){
    const isAdmin = ADMIN_UIDS.includes(user.uid);
    const adminTag = isAdmin ? " • ADM" : "";

    userBox.innerHTML = `
      <img src="${user.photoURL || "noctra-logo.png"}" width="30" height="30" style="border-radius:50%;object-fit:cover;">
      <span class="user-name">${user.displayName || "Usuário"}${adminTag}</span>
      <button onclick="logout()">Sair</button>
    `;

    adminBtn.style.display = isAdmin ? "inline" : "none";
  }else{
    userBox.innerHTML = `<button onclick="login()">Entrar</button>`;
    adminBtn.style.display = "none";
  }
}

window.login = ()=>{
  signInWithPopup(auth,provider);
};

window.logout = ()=>{
  signOut(auth);
};

async function carregarFavoritos(){
  favoritos = {};

  if(!currentUser) return;

  const snap = await getDoc(doc(db,"users",currentUser.uid));

  if(snap.exists()){
    favoritos = snap.data() || {};
  }
}

async function carregarObras(){
  obras = [];

  try{
    const snap = await getDocs(collection(db,"manhwas"));

    snap.forEach(item=>{
      obras.push({
        id:item.id,
        ...item.data()
      });
    });
  }catch(e){
    console.warn("Erro ao carregar manhwas:", e);
  }

  if(obras.length === 0){
    obras = [
      {
        id:"solo",
        nome:"Solo Leveling",
        capa:"https://i.imgur.com/8Km9tLL.jpg",
        desc:"Um caçador fraco recebe uma segunda chance para evoluir sem limites.",
        caps:10
      },
      {
        id:"nano",
        nome:"Nano Machine",
        capa:"https://i.imgur.com/qIufhof.png",
        desc:"Um jovem recebe uma nanotecnologia misteriosa e muda seu destino.",
        caps:8
      }
    ];
  }
}

function renderLista(){
  app.innerHTML = `
    <h1 class="page-title">Manhwas</h1>
    <p class="subtitle">Escolha uma obra para ver detalhes, sinopse e capítulos.</p>
    <div class="grid" id="grid"></div>
  `;

  const grid = document.getElementById("grid");

  obras.forEach(o=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${o.capa || "noctra-logo.png"}" alt="${o.nome || o.titulo || "Obra"}">
      <h3>${o.nome || o.titulo || "Sem título"}</h3>
    `;

    div.onclick = ()=>{
      location.href = `manhwas.html?id=${o.id}`;
    };

    grid.appendChild(div);
  });
}

function renderDetalhe(id){
  const obra = obras.find(o=>o.id === id);

  if(!obra){
    app.innerHTML = `
      <div class="empty">
        Obra não encontrada.
        <br><br>
        <button class="btn" onclick="location.href='manhwas.html'">Voltar para manhwas</button>
      </div>
    `;
    return;
  }

  const nome = obra.nome || obra.titulo || "Sem título";
  const capa = obra.capa || "noctra-logo.png";
  const desc = obra.desc || obra.descricao || "Sinopse ainda não adicionada. Volte em breve para conferir mais detalhes sobre esta obra.";
  const totalCaps = Number(obra.caps || obra.totalCaps || 1);
  const favTexto = favoritos[id] ? "💜 Favoritado" : "🤍 Favoritar";

  app.innerHTML = `
    <section class="detail-hero">
      <img class="cover" src="${capa}" alt="${nome}">

      <div class="info">
        <h1>${nome}</h1>

        <div class="meta">
          <div class="badge">${totalCaps} capítulo(s)</div>
          <div class="badge">Leitura vertical</div>
          <div class="badge">Noctra Core</div>
        </div>

        <div class="synopsis-title">Sinopse</div>
        <p class="synopsis">${desc}</p>

        <div class="actions">
          <button class="btn" onclick="location.href='reader.html?id=${id}&cap=1'">Ler do início</button>
          <button class="btn" id="favBtn">${favTexto}</button>
        </div>
      </div>
    </section>

    <h2 class="section-title">Capítulos</h2>
    <div class="cap-list" id="caps"></div>
  `;

  document.getElementById("favBtn").onclick = ()=>{
    favoritar(id);
  };

  const capsDiv = document.getElementById("caps");

  for(let i = 1; i <= totalCaps; i++){
    const c = document.createElement("div");
    c.className = "cap";
    c.innerHTML = `
      <strong>Capítulo ${i}</strong>
      <span>→ Ler</span>
    `;

    c.onclick = ()=>{
      location.href = `reader.html?id=${id}&cap=${i}`;
    };

    capsDiv.appendChild(c);
  }
}

async function favoritar(id){
  if(!currentUser){
    alert("Faça login para favoritar.");
    return;
  }

  favoritos[id] = !favoritos[id];

  await setDoc(doc(db,"users",currentUser.uid), favoritos, {merge:true});

  const params = new URLSearchParams(location.search);
  const obraId = params.get("id");

  if(obraId){
    renderDetalhe(obraId);
  }else{
    renderLista();
  }
}

async function iniciar(){
  await carregarFavoritos();
  await carregarObras();

  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  if(id){
    renderDetalhe(id);
  }else{
    renderLista();
  }
}

onAuthStateChanged(auth,async(user)=>{
  currentUser = user;
  renderUser(user);
  await iniciar();
});
</script>

</body>
</html>
