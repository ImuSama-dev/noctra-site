<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwas • Noctra</title>
<link rel="icon" href="./noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif;}
body{background:#0b0b12;color:white;overflow-x:hidden;}

/* HEADER */
header{position:fixed;width:100%;top:0;background:#111a2e;border-bottom:1px solid #1f1f2e;backdrop-filter:blur(10px);z-index:1000;}
.header-content{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;color:#c084fc;}
.logo-img{width:28px;height:28px;border-radius:50%;}
nav a{margin-left:15px;text-decoration:none;color:#aaa;transition:.3s;}
nav a:hover{color:#c084fc;}
.user-box{display:flex;align-items:center;gap:10px;}

/* HERO */
.banner{display:flex;flex-wrap:wrap;gap:20px;margin-top:80px;padding:20px;background:#1a1030;border-radius:10px;}
.banner img{width:200px;border-radius:12px;box-shadow:0 0 20px #000;}
.info h1{font-size:28px;margin-bottom:10px;}
.info p{color:#bbb;margin-bottom:10px;}
.actions{display:flex;gap:10px;margin-bottom:10px;}
.btn{padding:8px 14px;background:#a855f7;border-radius:8px;cursor:pointer;transition:.3s;color:white;}
.btn:hover{background:#9333ea;}

/* SEARCH */
.search{margin:20px 0;}
.search input{width:100%;padding:12px;border-radius:10px;border:none;background:#14141c;color:white;}

/* CAPÍTULOS */
.cap-list{display:flex;flex-direction:column;gap:10px;margin-top:10px;max-height:400px;overflow-y:auto;}
.cap{background:#14141c;padding:12px;border-radius:10px;display:flex;justify-content:space-between;cursor:pointer;transition:.2s;}
.cap:hover{background:#1c1c2a;transform:translateX(5px);}
.cap span{color:#bbb;}

/* CHAT */
.chat-section{margin-top:20px;padding:15px;background:#14141c;border-radius:10px;max-height:250px;overflow-y:auto;}
.chat-section h3{margin-bottom:10px;}
.chat-box{display:flex;gap:10px;margin-bottom:10px;}
.chat-box button{padding:6px 10px;border-radius:6px;border:none;cursor:pointer;transition:.2s;}
.chat-box button:hover{transform:scale(1.05);}
.chat-box button.gostei{background:#22c55e;color:white;}
.chat-box button.naogostei{background:#ef4444;color:white;}

footer{text-align:center;padding:30px;color:#666;margin-top:20px;}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img">
      <span>Noctra Core</span>
    </div>
    <nav>
      <a href="index.html">Início</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="manhwas.html">Manhwas</a>
      <a href="#" id="loginBtn">Entrar</a>
    </nav>
    <div class="user-box" id="userBox"></div>
  </div>
</header>

<div class="container">

  <!-- HERO / BANNER -->
  <div class="banner">
    <img id="capa">
    <div class="info">
      <h1 id="titulo"></h1>
      <p id="desc">Descrição do manhwa aparecerá aqui futuramente.</p>
      <div class="actions">
        <div class="btn" onclick="lerInicio()">Ler do início</div>
      </div>
      <div id="continue"></div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search">
    <input id="search" placeholder="Buscar capítulo..." onkeyup="buscarCap()">
  </div>

  <!-- CAPÍTULOS -->
  <div class="cap-list" id="caps"></div>

  <!-- CHAT -->
  <div class="chat-section">
    <h3>Deixe sua opinião</h3>
    <div class="chat-box">
      <button class="gostei" onclick="opinar('gostei')">Gostei 👍</button>
      <button class="naogostei" onclick="opinar('naogostei')">Não Gostei 👎</button>
    </div>
    <div id="chatLog"></div>
  </div>

</div>

<footer>© Noctra Core</footer>

<script type="module">
// 🔥 FIREBASE CONFIG
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const userBox = document.getElementById("userBox");
let currentUser = null;
let favoritos = {};

// LOGIN
function login(){ signInWithPopup(auth, provider); }
function logout(){ signOut(auth); }

onAuthStateChanged(auth, async user=>{
  currentUser = user;
  if(user){
    userBox.innerHTML = `<img src="${user.photoURL}" width="30" style="border-radius:50%"><span>${user.displayName}</span><button onclick="logout()">Sair</button>`;
    const snap = await getDoc(doc(db,"users",user.uid));
    if(snap.exists()) favoritos = snap.data();
  } else {
    userBox.innerHTML = `<button onclick="login()">Entrar</button>`;
  }
  renderCaps(listaCaps);
});

window.login = login;
window.logout = logout;

// OBRAS
const obras = {
  solo:{nome:"Solo Leveling",capa:"https://i.imgur.com/8Km9tLL.jpg",caps:10},
  nano:{nome:"Nano Machine",capa:"https://i.imgur.com/qIufhof.png",caps:8},
  tower:{nome:"Tower of God",capa:"https://i.imgur.com/4AiXzf8.jpeg",caps:15},
};

// PEGAR ID
const params = new URLSearchParams(location.search);
const id = params.get("id");
if(!id || !obras[id]){ alert("Manhwa não encontrado"); location.href="index.html"; }

const dados = obras[id];
document.getElementById("titulo").innerText = dados.nome;
document.getElementById("capa").src = dados.capa;

// LISTA DE CAPS
const capsDiv = document.getElementById("caps");
let listaCaps = [];
for(let i=dados.caps;i>=1;i--) listaCaps.push(i);

function renderCaps(lista){
  capsDiv.innerHTML="";
  lista.forEach(i=>{
    let div = document.createElement("div");
    div.className = "cap";
    div.innerHTML = `<div>Capítulo ${i}</div><span>→ Ler</span>`;
    div.onclick = ()=> window.location.href=`reader.html?id=${id}&cap=${i}`;
    capsDiv.appendChild(div);
  });
}

renderCaps(listaCaps);

// BUSCA
window.buscarCap = function(){
  let val = document.getElementById("search").value.toLowerCase();
  let filtrado = listaCaps.filter(c=>("capítulo "+c).toLowerCase().includes(val));
  renderCaps(filtrado);
}

// LER DO INICIO
window.lerInicio = ()=>{ window.location.href=`reader.html?id=${id}&cap=1`; }

// CHAT
function opinar(tipo){
  const chatLog = document.getElementById("chatLog");
  let text = tipo=="gostei"?"👍 Gostei":"👎 Não gostei";
  chatLog.innerHTML += `<div>${text}</div>`;
}

</script>
</body>
</html>
