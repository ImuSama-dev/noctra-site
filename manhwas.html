<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwa - Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#07070d;
  color:white;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 18% 4%,rgba(236,72,153,.20),transparent 28%),
    radial-gradient(circle at 82% 10%,rgba(124,58,237,.18),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(14,165,233,.10),transparent 36%),
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:auto,auto,auto,44px 44px,44px 44px;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,.04),transparent 18%,rgba(236,72,153,.035) 48%,transparent 70%);
  pointer-events:none;
  z-index:-1;
}

header{
  position:sticky;
  top:0;
  background:rgba(7,7,13,.82);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index:10;
}

.header-content{
  max-width:1160px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:14px 18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#f5d0fe;
  font-weight:800;
  white-space:nowrap;
}

.logo img{
  width:30px;
  height:30px;
  border-radius:50%;
  box-shadow:0 0 18px rgba(236,72,153,.45);
}

nav{
  display:flex;
  align-items:center;
  gap:18px;
}

nav a{
  text-decoration:none;
  color:#aaa;
  font-size:14px;
}

nav a:hover,
nav a.active{
  color:#f9a8d4;
}

.user-box{
  display:flex;
  gap:10px;
  align-items:center;
  min-width:max-content;
}

.user-name{
  max-width:130px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#ddd;
  font-size:13px;
}

.btn,
.user-box button{
  border:none;
  background:linear-gradient(135deg,#ff2f68,#a855f7);
  color:white;
  padding:10px 14px;
  border-radius:9px;
  font-family:'Poppins',sans-serif;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 12px 28px rgba(236,72,153,.18);
}

.btn:hover,
.user-box button:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.container{
  max-width:1160px;
  margin:auto;
  padding:28px 18px 55px;
}

.page-title{
  font-size:30px;
  margin-bottom:6px;
  color:#fff;
}

.subtitle{
  color:#aaa;
  margin-bottom:24px;
  font-size:14px;
}

.search-box{
  margin-bottom:18px;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(14,14,24,.88);
  color:white;
  font-family:'Poppins',sans-serif;
  outline:none;
  box-shadow:0 10px 26px rgba(0,0,0,.25);
}

.search-box input:focus{
  border-color:#f472b6;
  box-shadow:0 0 0 4px rgba(236,72,153,.12);
}

.category-filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:24px;
}

.category-btn{
  border:1px solid rgba(255,255,255,.10);
  background:rgba(20,20,32,.82);
  color:#ddd;
  padding:8px 13px;
  border-radius:999px;
  cursor:pointer;
  font-family:'Poppins',sans-serif;
  font-size:13px;
}

.category-btn:hover,
.category-btn.active{
  border-color:#f472b6;
  color:white;
  background:rgba(236,72,153,.18);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:22px;
}

.card{
  background:rgba(18,18,28,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 12px 28px rgba(0,0,0,.38);
}

.card:hover{
  transform:translateY(-6px);
  border-color:rgba(236,72,153,.65);
  box-shadow:0 18px 38px rgba(0,0,0,.5);
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#1b1b2b;
}

.card h3{
  padding:12px;
  text-align:center;
  font-size:14px;
  line-height:1.35;
}

.detail-hero{
  min-height:430px;
  display:grid;
  grid-template-columns:250px minmax(0,1fr) 230px;
  gap:36px;
  align-items:center;
  padding:38px 18px 48px;
  margin-bottom:8px;
  border-radius:22px;
  background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 24px 60px rgba(0,0,0,.38);
  position:relative;
  overflow:hidden;
}

.detail-hero::before{
  content:"";
  position:absolute;
  inset:-1px;
  background:
    radial-gradient(circle at 18% 22%,rgba(236,72,153,.14),transparent 28%),
    radial-gradient(circle at 78% 68%,rgba(168,85,247,.12),transparent 30%);
  pointer-events:none;
}

.detail-hero > *{
  position:relative;
}

.cover{
  width:100%;
  max-width:250px;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#111;
  border-radius:8px;
  box-shadow:0 20px 42px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);
}

.top-badges{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:14px;
}

.age-badge,
.new-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:24px;
  padding:0 9px;
  border-radius:6px;
  font-size:12px;
  font-weight:800;
}

.age-badge{
  background:#ff3154;
}

.new-badge{
  background:#25b7e8;
  border-radius:999px;
  font-size:11px;
}

.title-line{
  font-size:24px;
  line-height:1.12;
  font-weight:800;
  text-shadow:0 10px 28px rgba(0,0,0,.45);
}

.rating-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}

.stars{
  display:flex;
  gap:2px;
}

.star{
  border:none;
  background:transparent;
  color:#56525f;
  font-size:32px;
  line-height:1;
  cursor:pointer;
  padding:0;
  text-shadow:0 8px 22px rgba(0,0,0,.35);
}

.star.on{
  color:#ffd84d;
}

.star:hover{
  color:#fff07a;
}

.rating-number{
  font-size:24px;
  font-weight:800;
}

.rating-help{
  color:#b8b3c4;
  font-size:12px;
  margin-bottom:18px;
}

.info-table{
  display:grid;
  grid-template-columns:112px 1fr;
  gap:11px 12px;
  font-size:14px;
}

.info-table strong{
  color:#fff;
  font-weight:800;
}

.info-table span{
  color:#eee;
}

.genre-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.genre-list span{
  background:rgba(236,72,153,.12);
  border:1px solid rgba(236,72,153,.22);
  color:#ffd7ec;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:18px;
}
.side-info{
  display:grid;
  gap:26px;
  align-self:center;
}

.side-line{
  display:grid;
  grid-template-columns:92px 1fr;
  gap:14px;
  font-size:14px;
}

.side-line strong{
  font-weight:800;
}

.social-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:8px;
  text-align:center;
}

.stat-card{
  background:rgba(14,14,24,.68);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:14px 10px;
}

.stat-icon{
  color:#ff3154;
  font-size:28px;
  display:block;
  margin-bottom:8px;
}

.stat-text{
  color:#f1f1f1;
  font-size:13px;
  line-height:1.25;
}

.synopsis-box{
  max-width:920px;
  margin:0 auto 26px;
  padding:24px 4px 6px;
  color:#d2ceda;
  line-height:1.75;
  font-size:15px;
}

.section-title{
  margin:24px 0 12px;
  font-size:20px;
  color:#f5f0ff;
}

.cap-list{
  background:rgba(20,20,28,.78);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  overflow:hidden;
}

.cap{
  min-height:50px;
  padding:14px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:.2s;
  color:#f4f4f4;
}

.cap:hover{
  background:rgba(236,72,153,.10);
  padding-left:24px;
}

.cap strong{
  font-size:14px;
}

.cap span{
  color:#aaa;
  font-size:12px;
  font-style:italic;
}

.show-more{
  display:block;
  margin:22px auto 48px;
  background:transparent;
  border:none;
  color:#f4f4f4;
  font-family:'Poppins',sans-serif;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.comments-shell{
  max-width:780px;
  margin:0 auto;
  padding-top:12px;
}

.login-comment{
  border-top:1px solid rgba(255,255,255,.22);
  padding:22px 0;
  text-align:center;
  color:#999;
}

.comment-box{
  display:flex;
  gap:10px;
  margin:14px 0 22px;
}

.comment-box textarea{
  width:100%;
  min-height:84px;
  resize:vertical;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(14,14,24,.88);
  color:white;
  border-radius:10px;
  padding:12px;
  font-family:'Poppins',sans-serif;
  outline:none;
}

.comment-box textarea:focus{
  border-color:#00d1aa;
}

.comment-title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.22);
  margin-bottom:30px;
}

.comment-title{
  padding:0 18px 8px 6px;
  border-bottom:2px solid #00d1aa;
  color:#e7e7e7;
  font-size:14px;
  font-weight:800;
  letter-spacing:1px;
}

.sorts{
  display:flex;
  gap:16px;
  color:#aaa;
  font-size:13px;
}

.comment{
  display:grid;
  grid-template-columns:54px 1fr;
  gap:18px;
  margin-bottom:26px;
}

.reply-comment{
  margin-left:72px;
  grid-template-columns:42px 1fr;
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  object-fit:cover;
  background:#333;
  border:3px solid #111;
}

.reply-comment .avatar{
  width:42px;
  height:42px;
}

.comment-name{
  color:#00d1aa;
  font-size:14px;
  margin-bottom:4px;
}

.comment-date{
  color:#aaa;
  font-size:11px;
  border-bottom:1px dashed #008f78;
  padding-bottom:8px;
  margin-bottom:12px;
}

.comment-text{
  color:#d7d3de;
  line-height:1.6;
  font-size:15px;
  padding-right:10px;
  white-space:pre-wrap;
}

.reply-btn{
  margin-top:10px;
  background:none;
  border:none;
  color:#00d1aa;
  cursor:pointer;
  font-family:'Poppins',sans-serif;
}

.replying{
  background:#171722;
  border-left:3px solid #00d1aa;
  border-radius:8px;
  padding:10px;
  margin-bottom:10px;
  color:#ccc;
  font-size:13px;
}

.cancel-reply{
  color:#fca5a5;
  cursor:pointer;
  display:inline-block;
  margin-top:6px;
}

.empty{
  background:rgba(20,20,28,.84);
  border:1px solid rgba(255,255,255,.08);
  padding:24px;
  border-radius:10px;
  text-align:center;
  color:#bbb;
}

@media(max-width:930px){
  .detail-hero{
    grid-template-columns:210px 1fr;
  }

  .side-info{
    grid-column:1 / -1;
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:760px){
  .header-content{
    flex-wrap:wrap;
    justify-content:center;
  }

  nav{
    order:3;
    width:100%;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .container{
    padding:24px 12px 40px;
  }

  .grid{
    grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
    gap:14px;
  }

  .detail-hero{
    grid-template-columns:1fr;
    text-align:center;
    gap:20px;
    padding:24px 14px;
  }

  .cover{
    margin:auto;
    max-width:220px;
  }

  .top-badges,
  .rating-row,
  .actions{
    justify-content:center;
  }

  .info-table{
    grid-template-columns:1fr;
    text-align:left;
    max-width:380px;
    margin:auto;
  }

  .side-info{
    grid-template-columns:1fr;
    max-width:380px;
    margin:auto;
  }

  .side-line{
    grid-template-columns:1fr 1fr;
    text-align:left;
  }

  .comment{
    grid-template-columns:44px 1fr;
    gap:12px;
  }

  .reply-comment{
    margin-left:28px;
  }

  .avatar{
    width:44px;
    height:44px;
  }

  .comment-box{
    flex-direction:column;
  }

  .user-name{
    display:none;
  }
}
</style>
</head>

async function carregarFavoritos(){
  favoritos = {};

  if(!currentUser) return;

    favoritos = snap.data() || {};

async function carregarObras(){
  obras = [];

  try{
    const snap = await getDocs(collection(db,"manhwas"));

    snap.forEach(item=>{
      obras.push({
        id:item.id,
        ...item.data()
      });
    });

    obras.sort((a,b)=>{
      const nomeA = String(a.nome || a.titulo || "");
      const nomeB = String(b.nome || b.titulo || "");
      return nomeA.localeCompare(nomeB);
    });

  }catch(error){
    console.warn("Erro ao carregar manhwas:", error);
  }
}

    });

    search.focus();
    search.setSelectionRange(search.value.length, search.value.length);
  }
}

async function ratingData(id){
  try{
    const snap = await getDocs(collection(db,"manhwas",id,"ratings"));

    let soma = 0;
    let votoUsuario = 0;

    snap.forEach(item=>{
      const valor = Number(item.data().value || 0);
      soma += valor;

      if(currentUser && item.id === currentUser.uid){
        votoUsuario = valor;
      }
    });

    const total = snap.size;
    const media = total ? soma / total : 0;

    return {
      media,
      total,
      votoUsuario
    };

  }catch(error){
    return {
      media:0,
      total:0,
      votoUsuario:0
    };
  }
}

async function contarComentarios(id){
  try{
    const snap = await getDocs(collection(db,"manhwas",id,"comments"));
    return snap.size;
  }catch(error){
    return 0;
  }
}

function starsHtml(votoUsuario){
  let html = "";

  for(let i = 1; i <= 5; i++){
    html += `
      <button
        class="star ${i <= votoUsuario ? "on" : ""}"
        data-rate="${i}"
        title="Votar ${i} estrela(s)">
        &#9733;
      </button>
    `;
  }

  return html;
}

async function renderDetalhe(id){
  const obra = obras.find(item=>item.id === id);

  if(!obra || !obraVisivel(obra)){
    app.innerHTML = `
      <div class="empty">
        Obra nao encontrada.
        <br><br>
        <button class="btn" onclick="location.href='manhwas.html'">Voltar para manhwas</button>
      </div>
    `;
    return;
  }

  const nome = obra.nome || obra.titulo || "Sem titulo";
  const capa = obra.capa || "noctra-logo.png";
  const desc = info(obra.desc || obra.descricao);
  const totalCaps = Math.max(1, Number(obra.caps || obra.totalCaps || 1));
  const categorias = Array.isArray(obra.categorias) ? obra.categorias : [];
  const rating = await ratingData(id);
  const comentarios = await contarComentarios(id);
  const favTexto = favoritos[id] ? "Favoritado" : "Favoritar";

  app.innerHTML = `
    <section class="detail-hero">
      <div>
        <div class="top-badges">
          ${categorias.includes("+18") ? `<span class="age-badge">18+</span>` : ""}
          ${obra.novo || obra.new ? `<span class="new-badge">Novo</span>` : ""}
          <span class="title-line">${escaparHTML(nome)}</span>
        </div>

        <img class="cover" src="${capa}" alt="${escaparHTML(nome)}">
      </div>

      <div class="info">
        <div class="rating-row">
          <div class="stars" id="stars">${starsHtml(rating.votoUsuario || 0)}</div>
          <div class="rating-number">${rating.media.toFixed(1)}</div>
        </div>

        <div class="rating-help">
          Media ${rating.media.toFixed(1)} / 5 com ${rating.total} voto(s).
          ${currentUser ? "Clique nas estrelas para votar." : "Faca login para votar."}
        </div>

        <div class="info-table">
          <strong>Nota</strong>
          <span>Media ${rating.media.toFixed(1)} / 5 entre ${rating.total} voto(s)</span>

          <strong>Posicao</strong>
          <span>${escaparHTML(info(obra.rank))}</span>

          <strong>Alternativo</strong>
          <span>${escaparHTML(info(obra.alternativo || obra.alternative))}</span>

          <strong>Autor(es)</strong>
          <span>${escaparHTML(info(obra.autor || obra.author))}</span>

          <strong>Artista(s)</strong>
          <span>${escaparHTML(info(obra.artista || obra.artist))}</span>

          <strong>Genero(s)</strong>
          <span class="genre-list">
            ${categorias.length ? categorias.map(cat=>`<span>${escaparHTML(cat)}</span>`).join("") : "Nao informado"}
          </span>

          <strong>Tipo</strong>
          <span>${escaparHTML(info(obra.tipo || obra.type))}</span>

          <strong>Capitulos</strong>
          <span>${totalCaps}</span>
        </div>

        <div class="actions">
          <a class="btn" href="reader.html?id=${encodeURIComponent(id)}&cap=1">Ler primeiro</a>
          <a class="btn" href="reader.html?id=${encodeURIComponent(id)}&cap=${totalCaps}">Ler ultimo</a>
          <button class="btn" id="favBtn">${favTexto}</button>
        </div>
      </div>

      <aside class="side-info">
        <div>
          <div class="side-line">
            <strong>Lancamento</strong>
            <span>${escaparHTML(info(obra.ano || obra.release))}</span>
          </div>

          <div class="side-line" style="margin-top:14px;">
            <strong>Situacao</strong>
            <span>${escaparHTML(info(obra.status))}</span>
          </div>
        </div>

        <div class="social-stats">
          <div class="stat-card">
            <span class="stat-icon">◆</span>
            <div class="stat-text">${comentarios} comentario(s)</div>
          </div>

          <div class="stat-card">
            <span class="stat-icon">★</span>
            <div class="stat-text">${escaparHTML(info(obra.bookmarks))}<br>favoritaram</div>
          </div>
        </div>
      </aside>
    </section>

    <div class="synopsis-box">
      ${escaparHTML(desc)}
    </div>

    <h2 class="section-title">Capitulos</h2>
    <div class="cap-list" id="caps"></div>
    <button class="show-more" id="showMoreBtn" style="display:none;">Mostrar mais</button>

    <section class="comments-shell">
      <div id="replyingBox"></div>

      ${currentUser ? `
        <div class="comment-box">
          <textarea id="commentText" placeholder="Escreva seu comentario..."></textarea>
          <button class="btn" id="sendComment">Enviar</button>
        </div>
      ` : `
        <div class="login-comment">Faca login para comentar</div>
      `}

      <div class="comment-title-row">
        <div class="comment-title" id="commentCount">${comentarios} COMENTARIOS</div>
        <div class="sorts">
          <span>Mais recentes</span>
        </div>
      </div>

      <div id="commentsList"></div>
    </section>
  `;

  document.getElementById("favBtn").onclick = ()=>{
    favoritar(id);
  };

  document.querySelectorAll("[data-rate]").forEach(btn=>{
    btn.onclick = ()=>{
      votar(id,Number(btn.dataset.rate));
    };
  });

  const capsDiv = document.getElementById("caps");
  const showMoreBtn = document.getElementById("showMoreBtn");

  function desenharCaps(){
    capsDiv.innerHTML = "";

    for(let i = totalCaps; i >= 1 && i > totalCaps - visibleCaps; i--){
      const div = document.createElement("div");
      div.className = "cap";

      div.innerHTML = `
        <strong>Capitulo ${i}</strong>
        <span>${dataCurta(obra.createdAt) || "Ler"}</span>
      `;

      div.onclick = ()=>{
        location.href = `reader.html?id=${encodeURIComponent(id)}&cap=${i}`;
      };

      capsDiv.appendChild(div);
    }

    showMoreBtn.style.display = visibleCaps < totalCaps ? "block" : "none";
  }

  showMoreBtn.onclick = ()=>{
    visibleCaps += 10;
    desenharCaps();
  };

  desenharCaps();

  const sendComment = document.getElementById("sendComment");

  if(sendComment){
    sendComment.onclick = ()=>{
      enviarComentario(id);
    };
  }

  await carregarComentarios(id);
}

async function votar(id,value){
  if(!currentUser){
    alert("Faca login para votar.");
    await signInWithPopup(auth,provider);
    return;
  }

  try{
    await setDoc(doc(db,"manhwas",id,"ratings",currentUser.uid),{
      value:value,
      uid:currentUser.uid,
      name:currentUser.displayName || "Usuario",
      updatedAt:serverTimestamp()
    },{merge:true});

    visibleCaps = 10;
    await renderDetalhe(id);

  }catch(error){
    console.error(error);
    alert("Nao foi possivel registrar seu voto. Verifique as regras do Firestore para ratings.");
  }
}

function atualizarReply(){
  const box = document.getElementById("replyingBox");

  if(!box) return;

  if(!replyingTo){
    box.innerHTML = "";
    return;
  }

  box.innerHTML = `
    <div class="replying">
      Respondendo ${escaparHTML(replyingTo.name)}:
      <br>
      "${escaparHTML(replyingTo.text)}"
      <br>
      <span class="cancel-reply" id="cancelReply">Cancelar resposta</span>
    </div>
  `;

  document.getElementById("cancelReply").onclick = ()=>{
    replyingTo = null;
    atualizarReply();
  };
}

async function enviarComentario(id){
  if(!currentUser) return;

  const textarea = document.getElementById("commentText");
  const text = textarea.value.trim();

  if(!text) return;

  try{
    await addDoc(collection(db,"manhwas",id,"comments"),{
      text:text,
      uid:currentUser.uid,
      name:currentUser.displayName || "Usuario",
      photo:currentUser.photoURL || "noctra-logo.png",
      parentId:replyingTo ? replyingTo.id : null,
      createdAt:serverTimestamp()
    });

    textarea.value = "";
    replyingTo = null;
    atualizarReply();

    await carregarComentarios(id);

  }catch(error){
    console.error(error);
    alert("Nao foi possivel enviar o comentario. Verifique as regras do Firestore para comments.");
  }
}

async function carregarComentarios(id){
  const list = document.getElementById("commentsList");
  const count = document.getElementById("commentCount");

  if(!list) return;

  list.innerHTML = `<div class="empty">Carregando comentarios...</div>`;

  try{
    const snap = await getDocs(query(collection(db,"manhwas",id,"comments"),orderBy("createdAt","desc")));
    const todos = [];

    snap.forEach(item=>{
      todos.push({
        id:item.id,
        ...item.data()
      });
    });

    if(count){
      count.textContent = `${todos.length} COMENTARIOS`;
    }

    if(todos.length === 0){
      list.innerHTML = `<div class="empty">Nenhum comentario ainda.</div>`;
      return;
    }

    const principais = todos.filter(item=>!item.parentId);
    const respostas = todos.filter(item=>item.parentId);

    function itemComentario(comentario,resposta=false){
      return `
        <article class="comment ${resposta ? "reply-comment" : ""}" data-id="${comentario.id}">
          <img class="avatar" src="${comentario.photo || "noctra-logo.png"}">

          <div>
            <div class="comment-name">${escaparHTML(comentario.name || "Usuario")}</div>
            <div class="comment-date">${dataCurta(comentario.createdAt) || "Agora"}</div>
            <div class="comment-text">${escaparHTML(comentario.text)}</div>

            ${currentUser ? `
              <button class="reply-btn" data-reply="${comentario.id}">Responder</button>
            ` : ""}
          </div>
        </article>
      `;
    }

    list.innerHTML = principais.map(comentario=>{
      const filhos = respostas
        .filter(resposta=>resposta.parentId === comentario.id)
        .reverse()
        .map(resposta=>itemComentario(resposta,true))
        .join("");

      return itemComentario(comentario,false) + filhos;
    }).join("");

    document.querySelectorAll("[data-reply]").forEach(btn=>{
      btn.onclick = ()=>{
        const comentario = todos.find(item=>item.id === btn.dataset.reply);

        replyingTo = {
          id:comentario.id,
          name:comentario.name || "Usuario",
          text:comentario.text || ""
        };

        atualizarReply();

        const textarea = document.getElementById("commentText");

        if(textarea){
          textarea.focus();
        }
      };
    });

  }catch(error){
    console.error(error);

    list.innerHTML = `
      <div class="empty">
        Nao foi possivel carregar comentarios. Verifique as regras do Firestore.
      </div>
    `;
  }
}

async function favoritar(id){
  if(!currentUser){
    alert("Faca login para favoritar.");
    return;
  }

  favoritos[id] = !favoritos[id];

  await setDoc(doc(db,"users",currentUser.uid),favoritos,{merge:true});

  await renderDetalhe(id);
}

async function iniciar(){
  await carregarFavoritos();
  await carregarObras();

  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  if(id){
    visibleCaps = 10;
    await renderDetalhe(id);
  }else{
    renderLista();
  }
}

onAuthStateChanged(auth,async(user)=>{
  currentUser = user;
  renderUser(user);
  await iniciar();
});
</script>
