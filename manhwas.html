<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwas • Noctra</title>
<link rel="icon" href="./noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0b0b12;color:white;overflow-x:hidden;}
header{position:fixed;width:100%;top:0;background:rgba(15,15,25,0.95);backdrop-filter:blur(12px);border-bottom:1px solid #1f1f2e;z-index:1000;}
.header-content{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#c084fc;}
.logo-img{width:32px;height:32px;border-radius:50%;}
nav a{margin-left:20px;text-decoration:none;color:#aaa;transition:.3s;font-weight:500;}
nav a:hover{color:#a855f7;}
.user-box{display:flex;align-items:center;gap:10px;}
.user-box button{background:#a855f7;border:none;padding:6px 12px;border-radius:8px;color:white;cursor:pointer;transition:.3s;}
.user-box button:hover{background:#9333ea;}
.container{max-width:1100px;margin:auto;padding:100px 20px 40px;}
.banner{display:flex;gap:25px;align-items:flex-start;margin-bottom:30px;}
.banner img{width:200px;border-radius:12px;box-shadow:0 0 15px #000;}
.info h1{font-size:28px;margin-bottom:10px;}
.info p{color:#aaa;margin-bottom:10px;}
.actions{margin-top:10px;display:flex;gap:10px;}
.btn{padding:8px 14px;background:#a855f7;border-radius:8px;cursor:pointer;color:white;font-weight:600;transition:.3s;}
.btn:hover{background:#9333ea;transform:scale(1.05);}
.cap-list{margin-top:20px;display:flex;flex-direction:column;gap:10px;}
.cap{background:#14141c;padding:14px;border-radius:10px;display:flex;justify-content:space-between;cursor:pointer;transition:.2s;}
.cap:hover{background:#1c1c2a;transform:translateX(5px);}
.search input{width:100%;padding:12px;border-radius:10px;border:none;background:#14141c;color:white;box-shadow:0 0 10px rgba(168,85,247,0.2);}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      <img src="noctra-logo.png" class="logo-img">
      <span>Noctra Core</span>
    </div>
    <nav>
      <a href="index.html">Início</a>
      <a href="manhwas.html">Manhwas</a>
      <a href="https://discord.gg/JJ3xncPnm" target="_blank">Discord</a>
    </nav>
    <div class="user-box" id="userBox"></div>
  </div>
</header>

<div class="container">

  <!-- BANNER -->
  <div class="banner">
    <img id="capa">
    <div class="info">
      <h1 id="titulo"></h1>
      <p id="desc">Descrição do manhwa aparecerá aqui futuramente.</p>
      <div class="actions">
        <div class="btn" onclick="lerInicio()">Ler do início</div>
      </div>
      <div id="continue"></div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search">
    <input id="search" placeholder="Buscar capítulo..." onkeyup="buscarCap()">
  </div>

  <!-- CAPÍTULOS -->
  <div class="cap-list" id="caps"></div>

</div>

<footer>© Noctra Core</footer>

<script type="module">
// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// PEGAR ID
const params = new URLSearchParams(location.search);
const id = params.get("id");
if(!id){alert("Manhwa não encontrado"); location.href="index.html";}

// OBRAS
const obras = {
  solo:{ nome:"Solo Leveling", capa:"https://i.imgur.com/8Km9tLL.jpg", caps:10 },
  nano:{ nome:"Nano Machine", capa:"https://i.imgur.com/qIufhof.png", caps:8 }
};
const dados = obras[id];
if(!dados){alert("Obra não existe"); location.href="index.html";}

// SETAR INFO
document.getElementById("titulo").innerText = dados.nome;
document.getElementById("capa").src = dados.capa;

// INICIO
window.lerInicio = () => { location.href=`reader.html?id=${id}&cap=1`; };

// CAPS
const capsDiv = document.getElementById("caps");
let listaCaps = [];
for(let i=dados.caps;i>=1;i--) listaCaps.push(i);

function renderCaps(lista){
  capsDiv.innerHTML="";
  lista.forEach(i=>{
    let div = document.createElement("div");
    div.className="cap";
    div.innerHTML=`<div>Capítulo ${i}</div><span>→ Ler</span>`;
    div.onclick=()=> location.href=`reader.html?id=${id}&cap=${i}`;
    capsDiv.appendChild(div);
  });
}
renderCaps(listaCaps);

// BUSCA
window.buscarCap = function(){
  let val = document.getElementById("search").value.toLowerCase();
  let filtrado = listaCaps.filter(c => ("capítulo "+c).toLowerCase().includes(val));
  renderCaps(filtrado);
}

// CONTINUAR
onAuthStateChanged(auth, async user=>{
  if(!user) return;
  const snap = await getDoc(doc(db,"progress",user.uid));
  if(!snap.exists()) return;
  const prog = snap.data()[id];
  if(prog){
    document.getElementById("continue").innerHTML=`<div class="btn" onclick="location.href='reader.html?id=${id}&cap=${prog.cap}'">Continuar Capítulo ${prog.cap}</div>`;
  }
});
</script>

</body>
</html>
