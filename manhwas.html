<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Manhwa • Noctra</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body{
  background:#0b0b12;
  color:white;
  font-family:Poppins;
  margin:0;
}

/* HEADER */
header{
  padding:15px 30px;
  border-bottom:1px solid #1f1f2e;
}

a{color:#a855f7;text-decoration:none}

/* CONTAINER */
.container{
  max-width:1000px;
  margin:auto;
  padding:30px;
}

/* CAPA */
.banner{
  display:flex;
  gap:20px;
}

.banner img{
  width:180px;
  border-radius:10px;
}

.info h1{
  margin:0;
}

/* CAPÍTULOS */
.cap-list{
  margin-top:30px;
}

.cap{
  background:#14141c;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  cursor:pointer;
}

.cap:hover{
  background:#1c1c2a;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Voltar</a>
</header>

<div class="container">

<div class="banner">
  <img id="capa">
  <div class="info">
    <h1 id="titulo"></h1>
    <p>Lista de capítulos disponíveis</p>
  </div>
</div>

<div class="cap-list" id="caps"></div>

</div>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id");

const obras={
  solo:{
    nome:"Solo Leveling",
    capa:"https://i.imgur.com/8Km9tLL.jpg"
  },
  nano:{
    nome:"Nano Machine",
    capa:"https://i.imgur.com/qIufhof.png"
  }
};

const dados=obras[id];

document.getElementById("titulo").innerText=dados.nome;
document.getElementById("capa").src=dados.capa;

const capsDiv=document.getElementById("caps");

// EXEMPLO DE CAPÍTULOS
for(let i=1;i<=5;i++){
  let div=document.createElement("div");
  div.className="cap";
  div.innerText="Capítulo "+i;

  div.onclick=()=>{
    window.location.href=`reader.html?id=${id}&cap=${i}`;
  }

  capsDiv.appendChild(div);
}
</script>

</body>
</html>
