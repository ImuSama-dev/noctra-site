<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwa • Noctra</title>
<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Poppins,sans-serif;background:#202020;color:white;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 0%,rgba(168,85,247,.12),transparent 32%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,46px 46px,46px 46px;z-index:-2}
header{position:sticky;top:0;background:rgba(12,12,18,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);z-index:10}.header-content{max-width:1120px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px}.logo{display:flex;align-items:center;gap:10px;color:#e9d5ff;font-weight:800;white-space:nowrap}.logo img{width:30px;height:30px;border-radius:50%}nav{display:flex;align-items:center;gap:18px}nav a{text-decoration:none;color:#aaa;font-size:14px}nav a:hover,nav a.active{color:#f0abfc}.user-box{display:flex;gap:10px;align-items:center;min-width:max-content}.user-name{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ddd;font-size:13px}
.btn,.user-box button{border:none;background:#ff3154;color:white;padding:10px 14px;border-radius:6px;font-family:Poppins,sans-serif;font-weight:800;cursor:pointer;transition:.2s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn:hover,.user-box button:hover{transform:translateY(-1px);filter:brightness(1.08)}
.container{max-width:1120px;margin:auto;padding:28px 18px 55px}.page-title{font-size:28px;margin-bottom:6px}.subtitle{color:#aaa;margin-bottom:24px;font-size:14px}.search-box{margin-bottom:18px}.search-box input{width:100%;padding:13px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:#111;color:white;font-family:Poppins,sans-serif;outline:none}.search-box input:focus{border-color:#ff3154}.category-filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}.category-btn{border:1px solid rgba(255,255,255,.08);background:#171717;color:#ddd;padding:8px 13px;border-radius:999px;cursor:pointer;font-family:Poppins,sans-serif;font-size:13px}.category-btn:hover,.category-btn.active{border-color:#ff3154;color:white;background:#242424}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px}.card{background:#151515;border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden;cursor:pointer;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.35)}.card:hover{transform:translateY(-5px);border-color:rgba(255,49,84,.65)}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#1b1b2b}.card h3{padding:12px;text-align:center;font-size:14px;line-height:1.35}
.detail-hero{min-height:430px;display:grid;grid-template-columns:240px 1fr 220px;gap:36px;align-items:center;padding:40px 16px 52px}.cover{width:100%;max-width:240px;aspect-ratio:2/3;object-fit:cover;background:#111;box-shadow:0 18px 35px rgba(0,0,0,.45)}.top-badges{display:flex;gap:8px;align-items:center;margin-bottom:14px}.age-badge,.new-badge{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 9px;border-radius:3px;font-size:12px;font-weight:800}.age-badge{background:#ff3154}.new-badge{background:#1aa7d9;border-radius:999px;font-size:11px}.title-line{font-size:22px;line-height:1.2;font-weight:700}
.rating-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}.stars{display:flex;gap:2px}.star{border:none;background:transparent;color:#555;font-size:31px;line-height:1;cursor:pointer;padding:0}.star.on{color:#ffd400}.star:hover,.star:hover~.star{filter:brightness(1.15)}.rating-number{font-size:22px;font-weight:800}.rating-help{color:#aaa;font-size:12px;margin-bottom:18px}
.info-table{display:grid;grid-template-columns:96px 1fr;gap:11px 10px;font-size:14px}.info-table strong{color:#fff;font-weight:800}.info-table span{color:#f1f1f1}.genre-list{display:flex;flex-wrap:wrap;gap:7px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.side-info{display:grid;gap:26px;align-self:center}.side-line{display:grid;grid-template-columns:90px 1fr;gap:16px;font-size:14px}.side-line strong{font-weight:800}.social-stats{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px;text-align:center}.stat-icon{color:#ff3154;font-size:34px;display:block;margin-bottom:8px}.stat-text{color:#f1f1f1;font-size:14px;line-height:1.25}
.synopsis-box{max-width:880px;margin:0 auto 26px;padding:20px 0 4px;color:#cfcfcf;line-height:1.75;font-size:15px}.section-title{margin:22px 0 12px;font-size:20px;color:#f5f0ff}.cap-list{background:#242424;overflow:hidden}.cap{min-height:48px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.2s;color:#f4f4f4}.cap:hover{background:#111;padding-left:12px}.cap strong{font-size:14px}.cap span{color:#aaa;font-size:12px;font-style:italic}.show-more{display:block;margin:22px auto 48px;background:transparent;border:none;color:#f4f4f4;font-family:Poppins,sans-serif;font-size:16px;font-weight:800;cursor:pointer}
.comments-shell{max-width:760px;margin:0 auto;padding-top:12px}.login-comment{border-top:1px solid rgba(255,255,255,.28);padding:22px 0;text-align:center;color:#999}.comment-box{display:flex;gap:10px;margin:14px 0 22px}.comment-box textarea{width:100%;min-height:84px;resize:vertical;border:1px solid rgba(255,255,255,.10);background:#181818;color:white;border-radius:8px;padding:12px;font-family:Poppins,sans-serif;outline:none}.comment-box textarea:focus{border-color:#00a88a}.comment-title-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.28);margin-bottom:30px}.comment-title{padding:0 18px 8px 6px;border-bottom:2px solid #00a88a;color:#d8d8d8;font-size:14px;font-weight:800;letter-spacing:1px}.sorts{display:flex;gap:16px;color:#aaa;font-size:13px}
.comment{display:grid;grid-template-columns:54px 1fr;gap:18px;margin-bottom:26px}.reply-comment{margin-left:72px;grid-template-columns:42px 1fr}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#333;border:3px solid #111}.reply-comment .avatar{width:42px;height:42px}.comment-name{color:#00a88a;font-size:14px;margin-bottom:4px}.comment-date{color:#aaa;font-size:11px;border-bottom:1px dashed #008f78;padding-bottom:8px;margin-bottom:12px}.comment-text{color:#cfcfcf;line-height:1.6;font-size:15px;padding-right:10px;white-space:pre-wrap}.reply-btn{margin-top:10px;background:none;border:none;color:#00a88a;cursor:pointer;font-family:Poppins,sans-serif}.replying{background:#171717;border-left:3px solid #00a88a;border-radius:8px;padding:10px;margin-bottom:10px;color:#ccc;font-size:13px}.cancel-reply{color:#fca5a5;cursor:pointer;display:inline-block;margin-top:6px}.empty{background:#141414;border:1px solid rgba(255,255,255,.08);padding:24px;border-radius:10px;text-align:center;color:#bbb}
@media(max-width:900px){.detail-hero{grid-template-columns:200px 1fr}.side-info{grid-column:1/-1;grid-template-columns:1fr 1fr}}@media(max-width:760px){.header-content{flex-wrap:wrap;justify-content:center}nav{order:3;width:100%;justify-content:center;gap:16px;flex-wrap:wrap}.container{padding:24px 12px 40px}.grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}.detail-hero{grid-template-columns:1fr;text-align:center;gap:20px;padding-top:24px}.cover{margin:auto;max-width:210px}.top-badges,.rating-row,.actions{justify-content:center}.info-table{grid-template-columns:1fr;text-align:left;max-width:360px;margin:auto}.side-info{grid-template-columns:1fr;max-width:360px;margin:auto}.side-line{grid-template-columns:1fr 1fr;text-align:left}.comment{grid-template-columns:44px 1fr;gap:12px}.reply-comment{margin-left:28px}.avatar{width:44px;height:44px}.comment-box{flex-direction:column}.user-name{display:none}}
</style>
</head>
<body>
<header><div class="header-content"><div class="logo"><img src="noctra-logo.png" alt="Noctra"><span>Noctra Core</span></div><nav><a href="index.html">Início</a><a href="favoritos.html">Favoritos</a><a href="manhwas.html" class="active">Manhwas</a><a href="admin.html" id="adminBtn" style="display:none;">Admin</a></nav><div class="user-box" id="userBox"></div></div></header>
<main class="container" id="app"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,setDoc,getDoc,addDoc,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",authDomain:"noctra-core.firebaseapp.com",projectId:"noctra-core"};
const ADMIN_UIDS=["yeckgLVGVIMrMiByikAj8FpbjTm2"],fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider(),app=document.getElementById("app"),userBox=document.getElementById("userBox"),adminBtn=document.getElementById("adminBtn");
let currentUser=null,obras=[],favoritos={},visibleCaps=10,replyingTo=null;
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function info(v){return String(v||"").trim()||"Não informado"}function dataCurta(v){if(!v)return"";const d=v.toDate?v.toDate():new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleDateString("pt-BR")}function isAdmin(){return currentUser&&ADMIN_UIDS.includes(currentUser.uid)}
function renderUser(user){if(user){const adm=isAdmin();userBox.innerHTML=`<img src="${user.photoURL||"noctra-logo.png"}" width="30" height="30" style="border-radius:50%;object-fit:cover"><span class="user-name">${esc(user.displayName||"Usuário")}${adm?" • ADM":""}</span><button onclick="logout()">Sair</button>`;adminBtn.style.display=adm?"inline":"none"}else{userBox.innerHTML=`<button onclick="login()">Entrar</button>`;adminBtn.style.display="none"}}window.login=()=>signInWithPopup(auth,provider);window.logout=()=>signOut(auth);
async function carregarFavoritos(){favoritos={};if(!currentUser)return;const snap=await getDoc(doc(db,"users",currentUser.uid));if(snap.exists())favoritos=snap.data()||{}}
async function carregarObras(){obras=[];try{const snap=await getDocs(collection(db,"manhwas"));snap.forEach(i=>obras.push({id:i.id,...i.data()}));obras.sort((a,b)=>String(a.nome||a.titulo||"").localeCompare(String(b.nome||b.titulo||"")))}catch(e){console.warn(e)}}
function obraVisivel(o){return isAdmin()||o.publicado!==false&&o.published!==false}
function renderLista(catSel="Todos",texto=""){const cats=["Todos","Yuri","Yaoi","GL","BL","Romance","Drama","Ação","Fantasia","Escolar","Vida adulta","Psicológico","Comédia","Terror","Mistério","Sobrenatural","Histórico","+18"];app.innerHTML=`<h1 class="page-title">Manhwas</h1><p class="subtitle">Escolha uma obra para ver detalhes, sinopse, capítulos e comentários.</p><div class="search-box"><input id="searchManhwa" placeholder="Pesquisar manhwa..." value="${esc(texto)}"></div><div class="category-filters">${cats.map(c=>`<button class="category-btn ${catSel===c?"active":""}" data-category="${c}">${c}</button>`).join("")}</div><div class="grid" id="grid"></div>`;const grid=document.getElementById("grid"),q=texto.toLowerCase().trim();const filtradas=obras.filter(o=>obraVisivel(o)&&(catSel==="Todos"||(Array.isArray(o.categorias)&&o.categorias.includes(catSel)))&&String(o.nome||o.titulo||"").toLowerCase().includes(q));if(!filtradas.length)grid.innerHTML=`<div class="empty">Nenhuma obra encontrada.</div>`;filtradas.forEach(o=>{const div=document.createElement("div");div.className="card";div.innerHTML=`<img src="${o.capa||"noctra-logo.png"}" alt="${esc(o.nome||o.titulo||"Obra")}"><h3>${esc(o.nome||o.titulo||"Sem título")}${obraVisivel(o)&&o.publicado===false?"<br><small>Rascunho</small>":""}</h3>`;div.onclick=()=>location.href=`manhwas.html?id=${encodeURIComponent(o.id)}`;grid.appendChild(div)});document.querySelectorAll(".category-btn").forEach(b=>b.onclick=()=>renderLista(b.dataset.category,document.getElementById("searchManhwa")?.value||""));const s=document.getElementById("searchManhwa");s.oninput=()=>renderLista(catSel,s.value);s.focus();s.setSelectionRange(s.value.length,s.value.length)}
async function ratingData(id){try{const snap=await getDocs(collection(db,"manhwas",id,"ratings"));let sum=0,user=0;snap.forEach(d=>{const v=Number(d.data().value||0);sum+=v;if(currentUser&&d.id===currentUser.uid)user=v});const count=snap.size,avg=count?sum/count:0;return{avg,count,user}}catch{return{avg:0,count:0,user:0}}}
async function contarComentarios(id){try{return(await getDocs(collection(db,"manhwas",id,"comments"))).size}catch{return 0}}
function starsHtml(userRating){let out="";for(let i=1;i<=5;i++)out+=`<button class="star ${i<=userRating?"on":""}" data-rate="${i}" title="Votar ${i} estrela(s)">★</button>`;return out}
async function renderDetalhe(id){const obra=obras.find(o=>o.id===id);if(!obra||!obraVisivel(obra)){app.innerHTML=`<div class="empty">Obra não encontrada.<br><br><button class="btn" onclick="location.href='manhwas.html'">Voltar para manhwas</button></div>`;return}const nome=obra.nome||obra.titulo||"Sem título",capa=obra.capa||"noctra-logo.png",desc=info(obra.desc||obra.descricao),totalCaps=Math.max(1,Number(obra.caps||obra.totalCaps||1)),cats=Array.isArray(obra.categorias)?obra.categorias:[],rt=await ratingData(id),comentarios=await contarComentarios(id),favTexto=favoritos[id]?"💜 Favoritado":"🤍 Favoritar";app.innerHTML=`<section class="detail-hero"><div><div class="top-badges">${cats.includes("+18")?`<span class="age-badge">18+</span>`:""}${obra.novo||obra.new?`<span class="new-badge">New</span>`:""}<span class="title-line">${esc(nome)}</span></div><img class="cover" src="${capa}" alt="${esc(nome)}"></div><div class="info"><div class="rating-row"><div class="stars" id="stars">${starsHtml(rt.user||0)}</div><div class="rating-number" id="ratingNumber">${rt.avg.toFixed(1)}</div></div><div class="rating-help" id="ratingHelp">Média ${rt.avg.toFixed(1)} / 5 com ${rt.count} voto(s). ${currentUser?"Clique nas estrelas para votar.":"Faça login para votar."}</div><div class="info-table"><strong>Rating</strong><span id="ratingText">Average ${rt.avg.toFixed(1)} / 5 out of ${rt.count}</span><strong>Rank</strong><span>${esc(info(obra.rank))}</span><strong>Alternative</strong><span>${esc(info(obra.alternativo||obra.alternative))}</span><strong>Author(s)</strong><span>${esc(info(obra.autor||obra.author))}</span><strong>Artist(s)</strong><span>${esc(info(obra.artista||obra.artist))}</span><strong>Genre(s)</strong><span class="genre-list">${cats.length?cats.map(c=>`<span>${esc(c)}</span>`).join(""):"Não informado"}</span><strong>Type</strong><span>${esc(info(obra.tipo||obra.type))}</span><strong>Chapters</strong><span>${totalCaps}</span></div><div class="actions"><a class="btn" href="reader.html?id=${encodeURIComponent(id)}&cap=1">Read First</a><a class="btn" href="reader.html?id=${encodeURIComponent(id)}&cap=${totalCaps}">Read Last</a><button class="btn" id="favBtn">${favTexto}</button></div></div><aside class="side-info"><div><div class="side-line"><strong>Release</strong><span>${esc(info(obra.ano||obra.release))}</span></div><div class="side-line" style="margin-top:14px"><strong>Status</strong><span>${esc(info(obra.status))}</span></div></div><div class="social-stats"><div><span class="stat-icon">▰</span><div class="stat-text">${comentarios} comments</div></div><div><span class="stat-icon">▮</span><div class="stat-text">${esc(info(obra.bookmarks))} Users<br>bookmarked This</div></div></div></aside></section><div class="synopsis-box">${esc(desc)}</div><h2 class="section-title">Capítulos</h2><div class="cap-list" id="caps"></div><button class="show-more" id="showMoreBtn" style="display:none">Show more⌄</button><section class="comments-shell"><div id="replyingBox"></div>${currentUser?`<div class="comment-box"><textarea id="commentText" placeholder="Escreva seu comentário..."></textarea><button class="btn" id="sendComment">Enviar</button></div>`:`<div class="login-comment">Faça login para comentar</div>`}<div class="comment-title-row"><div class="comment-title" id="commentCount">${comentarios} COMMENTS</div><div class="sorts"><span>Newest⌄</span></div></div><div id="commentsList"></div></section>`;
document.getElementById("favBtn").onclick=()=>favoritar(id);document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>votar(id,Number(b.dataset.rate)));const capsDiv=document.getElementById("caps"),show=document.getElementById("showMoreBtn");function capsDraw(){capsDiv.innerHTML="";for(let i=totalCaps;i>=1&&i>totalCaps-visibleCaps;i--){const c=document.createElement("div");c.className="cap";c.innerHTML=`<strong>Episode ${i}</strong><span>${dataCurta(obra.createdAt)||"Ler"}</span>`;c.onclick=()=>location.href=`reader.html?id=${encodeURIComponent(id)}&cap=${i}`;capsDiv.appendChild(c)}show.style.display=visibleCaps<totalCaps?"block":"none"}show.onclick=()=>{visibleCaps+=10;capsDraw()};capsDraw();const send=document.getElementById("sendComment");if(send)send.onclick=()=>enviarComentario(id);await carregarComentarios(id)}
async function votar(id,value){if(!currentUser){alert("Faça login para votar.");await signInWithPopup(auth,provider);return}await setDoc(doc(db,"manhwas",id,"ratings",currentUser.uid),{value,uid:currentUser.uid,name:currentUser.displayName||"Usuário",updatedAt:serverTimestamp()},{merge:true});visibleCaps=10;await renderDetalhe(id)}
function atualizarReply(){const box=document.getElementById("replyingBox");if(!box)return;if(!replyingTo){box.innerHTML="";return}box.innerHTML=`<div class="replying">Respondendo ${esc(replyingTo.name)}:<br>"${esc(replyingTo.text)}"<br><span class="cancel-reply" id="cancelReply">Cancelar resposta</span></div>`;document.getElementById("cancelReply").onclick=()=>{replyingTo=null;atualizarReply()}}
async function enviarComentario(id){if(!currentUser)return;const textarea=document.getElementById("commentText"),text=textarea.value.trim();if(!text)return;await addDoc(collection(db,"manhwas",id,"comments"),{text,uid:currentUser.uid,name:currentUser.displayName||"Usuário",photo:currentUser.photoURL||"noctra-logo.png",parentId:replyingTo?.id||null,createdAt:serverTimestamp()});textarea.value="";replyingTo=null;atualizarReply();await carregarComentarios(id)}
async function carregarComentarios(id){const list=document.getElementById("commentsList"),count=document.getElementById("commentCount");if(!list)return;list.innerHTML=`<div class="empty">Carregando comentários...</div>`;try{const snap=await getDocs(query(collection(db,"manhwas",id,"comments"),orderBy("createdAt","desc")));const all=[];snap.forEach(i=>all.push({id:i.id,...i.data()}));if(count)count.textContent=`${all.length} COMMENTS`;if(!all.length){list.innerHTML=`<div class="empty">Nenhum comentário ainda.</div>`;return}const parents=all.filter(c=>!c.parentId),replies=all.filter(c=>c.parentId);function item(c,rep=false){return`<article class="comment ${rep?"reply-comment":""}" data-id="${c.id}"><img class="avatar" src="${c.photo||"noctra-logo.png"}"><div><div class="comment-name">${esc(c.name||"Usuário")}</div><div class="comment-date">◷ ${dataCurta(c.createdAt)||"Agora"}</div><div class="comment-text">${esc(c.text)}</div>${currentUser?`<button class="reply-btn" data-reply="${c.id}">Responder</button>`:""}</div></article>`}list.innerHTML=parents.map(p=>item(p)+replies.filter(r=>r.parentId===p.id).reverse().map(r=>item(r,true)).join("")).join("");document.querySelectorAll("[data-reply]").forEach(b=>b.onclick=()=>{const c=all.find(x=>x.id===b.dataset.reply);replyingTo={id:c.id,name:c.name||"Usuário",text:c.text||""};atualizarReply();document.getElementById("commentText")?.focus()})}catch(e){list.innerHTML=`<div class="empty">Não foi possível carregar comentários. Verifique as regras do Firestore.</div>`}}
async function favoritar(id){if(!currentUser){alert("Faça login para favoritar.");return}favoritos[id]=!favoritos[id];await setDoc(doc(db,"users",currentUser.uid),favoritos,{merge:true});await renderDetalhe(id)}
async function iniciar(){await carregarFavoritos();await carregarObras();const id=new URLSearchParams(location.search).get("id");if(id){visibleCaps=10;await renderDetalhe(id)}else renderLista()}
onAuthStateChanged(auth,async user=>{currentUser=user;renderUser(user);await iniciar()});
</script>
</body>
</html>
