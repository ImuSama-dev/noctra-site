<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwas • Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif;}
body{background:#0b0b12;color:white;}

/* HEADER */
header{
  position:fixed;top:0;width:100%;
  background:rgba(10,10,20,0.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #1f1f2e;
  z-index:1000;
}
.header-content{
  max-width:1100px;margin:auto;
  display:flex;justify-content:space-between;align-items:center;
  padding:15px 20px;
}
.logo{color:#c084fc;font-weight:600;}
.back{color:#aaa;text-decoration:none;}
.back:hover{color:#c084fc;}

/* CONTAINER */
.container{max-width:1100px;margin:auto;padding:100px 20px 40px;}

/* BANNER */
.banner{display:flex;gap:25px;margin-bottom:30px;}
.banner img{width:200px;border-radius:12px;}
.info h1{font-size:28px;margin-bottom:10px;}
.info p{color:#aaa;}
.actions{margin-top:10px;display:flex;gap:10px;}
.btn{padding:8px 14px;background:#a855f7;border-radius:8px;cursor:pointer;transition:.3s;}
.btn:hover{background:#9333ea;}

/* SEARCH */
.search input{
width:100%;padding:12px;border-radius:10px;border:none;background:#14141c;color:white;
}

/* GRID DE MANHWAS */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:25px;margin-top:30px;
}
.card{
  background:#14141c;border-radius:14px;overflow:hidden;
  cursor:pointer;transition:.3s;position:relative;
}
.card:hover{transform:translateY(-8px) scale(1.03);}
.card::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent,#a855f7,transparent);
  opacity:0;
}
.card:hover::after{opacity:0.2;}
.fav{
  position:absolute;top:10px;right:10px;background:#000a;padding:6px;
  border-radius:50%;cursor:pointer;transition:.2s;
}
.fav:hover{transform:scale(1.2);}
.card img{width:100%;height:240px;object-fit:cover;}
.card h3{padding:12px;}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">Noctra Core</div>
    <a href="index.html" class="back">← Voltar</a>
  </div>
</header>

<div class="container search">
  <input id="search" placeholder="Pesquisar manhwa..." onkeyup="buscar()">
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<footer>© Noctra Core</footer>

<script type="module">
// 🔥 FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIGURAÇÃO FIREBASE
 const firebaseConfig = {
    apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
    authDomain: "noctra-core.firebaseapp.com",
    projectId: "noctra-core",
    storageBucket: "noctra-core.firebasestorage.app",
    messagingSenderId: "506534658543",
    appId: "1:506534658543:web:14bd38c377336619e2f61a"
  };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const userBox = document.createElement("div");
document.querySelector(".header-content").appendChild(userBox);
let currentUser=null;
let favoritos={};

// LOGIN/LOGOUT
function login(){signInWithPopup(auth,provider);}
function logout(){signOut(auth);}
onAuthStateChanged(auth,user=>{
  currentUser=user;
  if(user){
    userBox.innerHTML = `<img src="${user.photoURL}" width="30" style="border-radius:50%"><span>${user.displayName}</span><button onclick="logout()">Sair</button>`;
    fetchFavoritos(user.uid);
  }else{
    userBox.innerHTML=`<button onclick="login()">Entrar</button>`;
  }
});
window.login=login;window.logout=logout;

// MANHWAS
const obras = [
  {id:"solo",titulo:"Solo Leveling",capa:"https://i.imgur.com/8Km9tLL.jpg",caps:10},
  {id:"nano",titulo:"Nano Machine",capa:"https://i.imgur.com/qIufhof.png",caps:8}
];

const grid=document.getElementById("grid");

// RENDER GRID
function render(lista){
  grid.innerHTML="";
  lista.forEach(o=>{
    let isFav=favoritos[o.id];
    let div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <div class="fav" onclick="fav(event,'${o.id}')">${isFav?"💜":"🤍"}</div>
      <img src="${o.capa}">
      <h3>${o.titulo}</h3>
    `;
    div.onclick=()=> window.location.href=`manhwas.html?id=${o.id}`;
    grid.appendChild(div);
  });
}

// FAVORITOS
async function fetchFavoritos(uid){
  const snap = await getDoc(doc(db,"users",uid));
  favoritos = snap.exists()?snap.data():{};
  render(obras);
}
window.fav=async(e,id)=>{
  e.stopPropagation();
  if(!currentUser){ alert("Faça login primeiro"); return; }
  favoritos[id]=!favoritos[id];
  await setDoc(doc(db,"users",currentUser.uid),favoritos,{merge:true});
  render(obras);
};

// BUSCA
window.buscar=function(){
  let val=document.getElementById("search").value.toLowerCase();
  render(obras.filter(o=>o.titulo.toLowerCase().includes(val)));
};

// RENDER INICIAL
render(obras);

</script>

</body>
</html>
