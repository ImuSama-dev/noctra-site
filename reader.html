<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader • Noctra</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  background:#202020;
  color:white;
  font-family:Poppins,sans-serif;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top,rgba(168,85,247,.12),transparent 30%),
    linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);
  background-size:auto,46px 46px,46px 46px;
  z-index:-2;
}

header{
  position:relative;
  z-index:10;
  background:rgba(10,10,18,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header-content{
  max-width:1100px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#e9d5ff;
  text-decoration:none;
  font-weight:800;
}

.logo img{
  width:30px;
  height:30px;
  border-radius:50%;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  background:#ff3154;
  color:white;
  padding:10px 14px;
  border-radius:6px;
  font-family:Poppins,sans-serif;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.reader{
  width:100%;
  max-width:980px;
  margin:auto;
  padding:24px 10px 70px;
}

.reader-top{
  background:#141414;
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  padding:20px;
  margin-bottom:24px;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.reader-top h1{
  font-size:28px;
  margin-bottom:8px;
}

.reader-top p{
  color:#aaa;
  font-size:14px;
}

.pages{
  --reader-zoom:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  overflow:visible;
}

.page{
  width:100%;
  display:flex;
  justify-content:center;
  overflow:visible;
}

.page img{
  width:calc(100% * var(--reader-zoom));
  max-width:none;
  height:auto;
  display:block;
  object-fit:contain;
  background:#111;
  transform-origin:top center;
}

.bottom-actions{
  margin-top:35px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}
.top-reader-actions{
  margin:0 0 24px;
}
.loading,
.error{
  background:#141414;
  border:1px solid rgba(255,255,255,.08);
  padding:30px;
  border-radius:10px;
  text-align:center;
  color:#bbb;
}

.error{
  color:#fca5a5;
}

.float-tools{
  position:fixed;
  right:18px;
  bottom:18px;
  display:grid;
  gap:10px;
  z-index:20;
}

.float-btn{
  width:54px;
  height:54px;
  border:none;
  border-radius:50%;
  background:#ff3154;
  color:white;
  font-size:22px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(255,49,84,.35);
}

.float-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.zoom-controls{
  position:fixed;
  left:18px;
  bottom:18px;
  display:flex;
  gap:8px;
  z-index:20;
  background:rgba(20,20,20,.72);
  border:1px solid rgba(255,255,255,.10);
  border-radius:999px;
  padding:8px;
  backdrop-filter:blur(10px);
}

.zoom-btn{
  min-width:46px;
  height:42px;
  border:none;
  border-radius:999px;
  background:#ff3154;
  color:white;
  font-family:Poppins,sans-serif;
  font-weight:800;
  cursor:pointer;
}

.zoom-btn:hover{
  filter:brightness(1.08);
}

.zoom-reset{
  min-width:66px;
  background:#141414;
  border:1px solid rgba(255,255,255,.12);
}

.comments-shell{
  max-width:760px;
  margin:55px auto 0;
  padding-top:12px;
}

.chat-title{
  font-size:20px;
  color:#f5f0ff;
  margin-bottom:18px;
}

.login-comment{
  border-top:1px solid rgba(255,255,255,.28);
  padding:22px 0;
  text-align:center;
  color:#999;
}

.comment-box{
  display:flex;
  gap:10px;
  margin:14px 0 22px;
}

.comment-box textarea{
  width:100%;
  min-height:84px;
  resize:vertical;
  border:1px solid rgba(255,255,255,.10);
  background:#181818;
  color:white;
  border-radius:8px;
  padding:12px;
  font-family:Poppins,sans-serif;
  outline:none;
}

.comment-box textarea:focus{
  border-color:#00a88a;
}

.comment-title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.28);
  margin-bottom:30px;
}

.comment-title{
  padding:0 18px 8px 6px;
  border-bottom:2px solid #00a88a;
  color:#d8d8d8;
  font-size:14px;
  font-weight:800;
  letter-spacing:1px;
}

.sorts{
  display:flex;
  gap:16px;
  color:#aaa;
  font-size:13px;
}

.comment{
  display:grid;
  grid-template-columns:54px 1fr;
  gap:18px;
  margin-bottom:26px;
}

.reply-comment{
  margin-left:72px;
  grid-template-columns:42px 1fr;
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  object-fit:cover;
  background:#333;
  border:3px solid #111;
}

.reply-comment .avatar{
  width:42px;
  height:42px;
}

.comment-name{
  color:#00a88a;
  font-size:14px;
  margin-bottom:4px;
}

.comment-date{
  color:#aaa;
  font-size:11px;

  padding-bottom:8px;
  margin-bottom:12px;
}

.comment-text{

  padding-right:10px;

}

.reply-btn{

  background:none;
  border:none;
  color:#00a88a;
  cursor:pointer;
  font-family:Poppins,sans-serif;

.replying{
  background:#171717;
  border-left:3px solid #00a88a;
  border-radius:8px;
  padding:10px;
  margin-bottom:10px;
  color:#ccc;
  font-size:13px;
}

.cancel-reply{
  color:#fca5a5;
  cursor:pointer;
  display:inline-block;
  margin-top:6px;
}

.empty-chat{
  background:#141414;
  border:1px solid rgba(255,255,255,.08);
  padding:20px;
  border-radius:10px;
  color:#888;
  text-align:center;

<script>
(() => {
  const toggles = document.querySelectorAll(".site-menu-toggle");
  const panels = document.querySelectorAll(".site-menu-panel");
  toggles.forEach((toggle, index) => {
    const panel = panels[index];
    if (!panel) return;
    toggle.addEventListener("click", event => {
      event.stopPropagation();
      const open = !panel.classList.contains("open");
      panels.forEach(item => item.classList.remove("open"));
      toggles.forEach(item => item.setAttribute("aria-expanded", "false"));
      panel.classList.toggle("open", open);
      toggle.setAttribute("aria-expanded", String(open));
    });
  });
  document.addEventListener("click", () => {
    panels.forEach(item => item.classList.remove("open"));
    toggles.forEach(item => item.setAttribute("aria-expanded", "false"));
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") document.dispatchEvent(new Event("click"));
  });
})();
</script>

function aplicarZoom(){
  const pages = document.getElementById("pages");

  localStorage.setItem("noctra_reader_zoom", readerZoom);
}

function alterarZoom(delta){
  readerZoom = Math.min(1.8, Math.max(0.6, readerZoom + delta));
  readerZoom = Number(readerZoom.toFixed(2));

}

document.getElementById("zoomReset").onclick = ()=>{
  readerZoom = 1;
  aplicarZoom();
};

document.addEventListener("keydown",event=>{
  if(!event.ctrlKey && !event.metaKey) return;

  if(event.key === "+" || event.key === "=" || event.code === "NumpadAdd"){
    event.preventDefault();
    alterarZoom(0.1);
  }

  if(event.key === "-" || event.key === "_" || event.code === "NumpadSubtract"){
    event.preventDefault();
    alterarZoom(-0.1);
  }

  if(event.key === "0" || event.code === "Numpad0"){
    event.preventDefault();
    readerZoom = 1;
    aplicarZoom();
  }
});

document.addEventListener("wheel",event=>{
  if(!event.ctrlKey && !event.metaKey) return;

  event.preventDefault();

  if(event.deltaY < 0){
    alterarZoom(0.1);
  }else{
    alterarZoom(-0.1);
  }
},{passive:false});

function esc(texto){
  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function date(valor){
  if(!valor) return "Agora";

  const data = valor.toDate ? valor.toDate() : new Date(valor);

  return Number.isNaN(data.getTime()) ? "Agora" : data.toLocaleString("pt-BR");
}

function erro(msg){
  reader.innerHTML = `
    <div class="error">
      ${esc(msg)}
      <br><br>
      <a href="manhwas.html" class="btn">Voltar</a>
    </div>
  `;
}

async function carregar(){
  if(!obraId){
    erro("Obra não encontrada.");
    return;
  }

  try{
    const obraSnap = await getDoc(doc(db,"manhwas",obraId));

    if(!obraSnap.exists()){
      erro("Essa obra não existe.");
      return;
    }
    salvarProgressoLeitura("lendo");

    const obra = obraSnap.data();

    const chapterSnap = await getDoc(doc(db,"manhwas",obraId,"chapters",String(cap)));

    if(!chapterSnap.exists()){
      erro("Capítulo não encontrado.");
      return;
    }

    const chapter = chapterSnap.data();
    const pages = chapter.pages || chapter.paginas || [];

    if(!Array.isArray(pages) || !pages.length){
      erro("Esse capítulo não possui páginas.");
      return;
    }

    const totalCaps = Number(obra.caps || obra.totalCaps || cap);

    reader.innerHTML = `
      <section class="reader-top">
        <h1>${esc(obra.nome || obra.titulo || "Sem título")}</h1>
        <p>${esc(chapter.titulo || chapter.title || `Capítulo ${cap}`)}</p>
      </section>
<div class="bottom-actions top-reader-actions">
  ${
    cap > 1
    ? `<a class="btn" href="reader.html?id=${encodeURIComponent(obraId)}&cap=${cap - 1}">← Capítulo anterior</a>`
    : ""
  }

  <a class="btn" href="obra.html?id=${encodeURIComponent(obraId)}">Lista de capítulos</a>

  ${
    cap < totalCaps
    ? `<a class="btn" href="reader.html?id=${encodeURIComponent(obraId)}&cap=${cap + 1}">Próximo capítulo →</a>`
    : ""
  }
</div>
      <section class="pages" id="pages"></section>

      <div class="bottom-actions">
        ${
          cap > 1
          ? `<a class="btn" href="reader.html?id=${encodeURIComponent(obraId)}&cap=${cap - 1}">← Capítulo anterior</a>`
          : ""
        }

        <a class="btn" href="obra.html?id=${encodeURIComponent(obraId)}">Lista de capítulos</a>

        ${
          cap < totalCaps
          ? `<a class="btn" href="reader.html?id=${encodeURIComponent(obraId)}&cap=${cap + 1}">Próximo capítulo →</a>`
          : ""
        }
      </div>

      <section class="comments-shell">
        <h2 class="chat-title">Comentários</h2>

        <div id="replyingBox"></div>

        ${
          currentUser
          ? `
            <div class="comment-composer">
              <div class="comment-box">
                <textarea id="chatInput" maxlength="1500" placeholder="Escreva um comentário..."></textarea>
              </div>
              <div class="upload-preview" id="uploadPreview"></div>
              <div class="comment-tools">
                <button class="comment-tool" id="emojiBtn" type="button" title="Emojis">☺</button>
                <button class="comment-tool" id="stickerBtn" type="button" title="Figurinhas">▣</button>
                <button class="comment-tool" id="uploadBtn" type="button" title="Enviar imagem">⌁</button>
                <input id="chatFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
                <button class="btn send-comment" id="sendBtn" type="button">Enviar</button>
              </div>
              <div class="picker emoji-picker" id="emojiPicker"></div>
              <div class="picker sticker-picker" id="stickerPicker"></div>
            </div>
          `
          : `<div class="login-comment">Entre com sua conta para comentar e interagir.<br><button class="btn" id="commentLogin" type="button">Entrar com Google</button></div>`
        }

        <div class="comment-title-row">
          <div class="comment-title" id="commentCount">0 COMENTÁRIOS</div>
          <div class="sorts"><span>Mais recentes</span></div>
        </div>

        <div id="chatList">
          <div class="empty-chat">Carregando comentários...</div>
        </div>
      </section>
    `;

    const cont = document.getElementById("pages");

    pages.forEach((url,i)=>{
      const div = document.createElement("div");
      div.className = "page";

      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = url;
      img.alt = `Página ${i + 1}`;

      img.onerror = ()=>{
        img.style.display = "none";

        div.innerHTML += `
          <div class="error" style="margin:10px">
            Falha ao carregar:
            <br><br>
            ${esc(url)}
          </div>
        `;
      };

      div.appendChild(img);
      cont.appendChild(div);
    });

    document.title = `${obra.nome || obra.titulo || "Reader"} • Capítulo ${cap}`;

    aplicarZoom();

    const send = document.getElementById("sendBtn");

    if(send){
      send.onclick = enviarMensagem;
      prepararCompositor();
    }

    const commentLogin = document.getElementById("commentLogin");
    if(commentLogin) commentLogin.onclick = ()=>signInWithPopup(auth,provider);

    carregarMensagens();

  }catch(error){
    console.error(error);
    erro("Erro ao carregar capítulo.");
  }
}

function atualizarReply(){
  const box = document.getElementById("replyingBox");

  if(!box) return;

  if(!replyingTo){
    box.innerHTML = "";
    return;
  }

  box.innerHTML = `
    <div class="replying">
      Respondendo ${esc(replyingTo.name)}:
      <br>
      "${esc(replyingTo.text)}"
      <br>
      <span class="cancel-reply" id="cancelReply">Cancelar resposta</span>
    </div>
  `;

  document.getElementById("cancelReply").onclick = ()=>{
    replyingTo = null;
    atualizarReply();
  };
}

function prepararCompositor(){
  const input = document.getElementById("chatInput");
  const emojiPicker = document.getElementById("emojiPicker");
  const stickerPicker = document.getElementById("stickerPicker");
  const fileInput = document.getElementById("chatFile");
  const emojis = ["😀","😂","😍","😎","🥳","😱","😭","🔥","💜","🤍","👏","✨","👀","👍","👎","❤️","😈","🤔"];
  const stickers = ["🥰","🤣","😱","😭","🔥","🎉","💜","👀","💀","✨","👏","🤯"];

  emojiPicker.innerHTML = emojis.map(item=>`<button type="button" data-emoji="${item}">${item}</button>`).join("");
  stickerPicker.innerHTML = stickers.map(item=>`<button type="button" data-sticker="${item}">${item}</button>`).join("");

  document.getElementById("emojiBtn").onclick = event=>{
    event.stopPropagation();
    stickerPicker.classList.remove("open");
    emojiPicker.classList.toggle("open");
  };
  document.getElementById("stickerBtn").onclick = event=>{
    event.stopPropagation();
    emojiPicker.classList.remove("open");
    stickerPicker.classList.toggle("open");
  };
  document.getElementById("uploadBtn").onclick = ()=>fileInput.click();

  emojiPicker.querySelectorAll("[data-emoji]").forEach(button=>{
    button.onclick = ()=>{
      const start = input.selectionStart;
      input.value = input.value.slice(0,start) + button.dataset.emoji + input.value.slice(input.selectionEnd);
      input.focus();
      input.selectionStart = input.selectionEnd = start + button.dataset.emoji.length;
      emojiPicker.classList.remove("open");
    };
  });

  stickerPicker.querySelectorAll("[data-sticker]").forEach(button=>{
    button.onclick = ()=>{
      selectedSticker = button.dataset.sticker;
      selectedImage = null;
      atualizarPreview();
      stickerPicker.classList.remove("open");
    };
  });

  fileInput.onchange = ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")) return alert("Escolha um arquivo de imagem.");
    if(file.size > 5 * 1024 * 1024){
      fileInput.value = "";
      return alert("A imagem deve ter no máximo 5 MB.");
    }
    selectedImage = file;
    selectedSticker = "";
    atualizarPreview();
  };
}

function atualizarPreview(){
  const preview = document.getElementById("uploadPreview");
  if(!preview) return;

  if(selectedImage){
    preview.className = "upload-preview show";
    preview.innerHTML = `<img src="${URL.createObjectURL(selectedImage)}" alt=""><span>${esc(selectedImage.name)}</span><button type="button" id="removeMedia">Remover</button>`;
  }else if(selectedSticker){
    preview.className = "upload-preview show";
    preview.innerHTML = `<span style="font-size:42px">${selectedSticker}</span><span>Figurinha selecionada</span><button type="button" id="removeMedia">Remover</button>`;
  }else{
    preview.className = "upload-preview";
    preview.innerHTML = "";
  }

  const remove = document.getElementById("removeMedia");
  if(remove) remove.onclick = ()=>{
    selectedImage = null;
    selectedSticker = "";
    const file = document.getElementById("chatFile");
    if(file) file.value = "";
    atualizarPreview();
  };
}

async function enviarMensagem(){
  if(!currentUser){
    await signInWithPopup(auth,provider);
    return;
  }

  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text && !selectedImage && !selectedSticker) return;

  const send = document.getElementById("sendBtn");
  try{
    send.classList.add("sending");
    send.textContent = "Enviando...";

    let imageUrl = "";
    if(selectedImage){
      const safeName = selectedImage.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const imageRef = ref(storage,`comments/${currentUser.uid}/${obraId}/${cap}/${Date.now()}-${safeName}`);
      await uploadBytes(imageRef,selectedImage,{contentType:selectedImage.type});
      imageUrl = await getDownloadURL(imageRef);
    }

    await addDoc(collection(db,"manhwas",obraId,"chapters",String(cap),"comments"),{
      user:currentUser.displayName || "Usuário",
      name:currentUser.displayName || "Usuário",
      uid:currentUser.uid,
      photo:currentUser.photoURL || "noctra-core-bat-icon-transparent.png",
      text,
      imageUrl,
      sticker:selectedSticker,
      likes:[],
      dislikes:[],
      parentId:replyingTo ? replyingTo.id : null,
      createdAt:serverTimestamp()
    });

    input.value = "";
    selectedImage = null;
    selectedSticker = "";
    document.getElementById("chatFile").value = "";
    atualizarPreview();
    replyingTo = null;
    atualizarReply();
  }catch(error){
    console.error(error);
    alert("Não foi possível enviar. Confira as regras do Firestore e do Storage.");
  }finally{
    send.classList.remove("sending");
    send.textContent = "Enviar";
  }
}

async function reagir(commentId,type){
  if(!currentUser){
    await signInWithPopup(auth,provider);
    return;
  }

  const comment = currentComments.find(item=>item.id === commentId);
  if(!comment) return;
  const likes = Array.isArray(comment.likes) ? comment.likes : [];
  const dislikes = Array.isArray(comment.dislikes) ? comment.dislikes : [];
  const target = doc(db,"manhwas",obraId,"chapters",String(cap),"comments",commentId);

  if(type === "like"){
    await updateDoc(target,{
      likes:likes.includes(currentUser.uid) ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid),
      dislikes:arrayRemove(currentUser.uid)
    });
  }else{
    await updateDoc(target,{
      dislikes:dislikes.includes(currentUser.uid) ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid),
      likes:arrayRemove(currentUser.uid)
    });
  }
}

function carregarMensagens(){
  const list = document.getElementById("chatList");
  const count = document.getElementById("commentCount");

  if(unsubscribeComments){
    unsubscribeComments();
  }

  const q = query(
    collection(db,"manhwas",obraId,"chapters",String(cap),"comments"),
    orderBy("createdAt","desc")
  );

  unsubscribeComments = onSnapshot(q,snapshot=>{
    const all = [];

    snapshot.forEach(docSnap=>{
      all.push({
        id:docSnap.id,
        ...docSnap.data()
      });
    });
    currentComments = all;

    if(count){
      count.textContent = `${all.length} COMENTÁRIOS`;
    }

    if(!all.length){
      list.innerHTML = `<div class="empty-chat">Nenhum comentário ainda.</div>`;
      return;
    }

    const parents = all.filter(item=>!item.parentId);
    const replies = all.filter(item=>item.parentId);
    
    function item(comentario,resposta=false){
      const likes = Array.isArray(comentario.likes) ? comentario.likes : [];
      const dislikes = Array.isArray(comentario.dislikes) ? comentario.dislikes : [];
      const liked = currentUser && likes.includes(currentUser.uid);
      const disliked = currentUser && dislikes.includes(currentUser.uid);
      return `
        <article class="comment ${resposta ? "reply-comment" : ""}">
          <img class="avatar" src="${comentario.photo || "noctra-core-bat-icon-transparent.png"}">

          <div>
            <div class="comment-name">${esc(comentario.name || comentario.user || "Usuário")}</div>
            <div class="comment-date">${date(comentario.createdAt)}</div>
            <div class="comment-text">${esc(comentario.text)}</div>
            ${comentario.imageUrl ? `<img class="comment-media" src="${esc(comentario.imageUrl)}" alt="Imagem enviada no comentário" loading="lazy">` : ""}
            ${comentario.sticker ? `<div class="comment-sticker">${esc(comentario.sticker)}</div>` : ""}
            <div class="comment-actions">
              <button class="comment-action ${liked ? "active" : ""}" data-like="${comentario.id}">Curtir ${likes.length}</button>
              <button class="comment-action ${disliked ? "active" : ""}" data-dislike="${comentario.id}">Não curtir ${dislikes.length}</button>
              <button class="comment-action" data-reply="${comentario.id}">Responder</button>
            </div>
          </div>
        </article>
      `;
    }

    list.innerHTML = parents.map(parent=>{
      const filhos = replies
        .filter(reply=>reply.parentId === parent.id)
        .reverse()
        .map(reply=>item(reply,true))
        .join("");

      return item(parent,false) + filhos;
    }).join("");

    document.querySelectorAll("[data-reply]").forEach(btn=>{
      btn.onclick = ()=>{
        if(!currentUser){
          signInWithPopup(auth,provider);
          return;
        }
        const comentario = all.find(item=>item.id === btn.dataset.reply);

        replyingTo = {
          id:comentario.id,
          name:comentario.name || comentario.user || "Usuário",
          text:comentario.text || ""
        };

        atualizarReply();

        document.getElementById("chatInput")?.focus();

        scrollTo({
          top:document.body.scrollHeight,
          behavior:"smooth"
        });
      };
    });

    document.querySelectorAll("[data-like]").forEach(btn=>{
      btn.onclick = ()=>reagir(btn.dataset.like,"like").catch(error=>{
        console.error(error);
        alert("Não foi possível registrar a curtida.");
      });
    });

    document.querySelectorAll("[data-dislike]").forEach(btn=>{
      btn.onclick = ()=>reagir(btn.dataset.dislike,"dislike").catch(error=>{
        console.error(error);
        alert("Não foi possível registrar a reação.");
      });
    });

  },error=>{
    console.error(error);

    list.innerHTML = `
      <div class="empty-chat">
        Não foi possível carregar comentários. Verifique as regras do Firestore.
      </div>
    `;
  });
}

onAuthStateChanged(auth,user=>{
  currentUser = user;
  const isAdmin = Boolean(user && ADMIN_UIDS.includes(user.uid));
  document.querySelectorAll(".menu-admin-link").forEach(link=>link.style.display=isAdmin?"block":"none");
  readerAuth.innerHTML = user
    ? `<span class="user-label">${esc(user.displayName || "Usuário")}</span><button class="btn" id="readerLogout">Sair</button>`
    : `<button class="btn" id="readerLogin">Entrar</button>`;
  const login = document.getElementById("readerLogin");
  const logout = document.getElementById("readerLogout");
  if(login) login.onclick = ()=>signInWithPopup(auth,provider);
  if(logout) logout.onclick = ()=>signOut(auth);
  carregar();
});
  window.addEventListener("scroll", ()=>{
  const chegouPertoDoFim =
    window.innerHeight + window.scrollY >= document.body.scrollHeight - 0.45;

  if(chegouPertoDoFim){
    salvarProgressoLeitura("lido");
  }
});
</script>
