<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<link rel="icon" href="./noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:'Poppins', sans-serif;
  background:
    radial-gradient(circle at top, rgba(168,85,247,.18), transparent 35%),
    #08080f;
  color:white;
  overflow-x:hidden;
}

.topbar{
  position:sticky;
  top:0;
  width:100%;
  min-height:58px;
  background:rgba(12,12,20,.94);
  backdrop-filter:blur(12px);
  padding:10px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  z-index:1000;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.topbar .title{
  font-weight:600;
  font-size:15px;
  color:#f5f0ff;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.btn,
button.btn{
  border:none;
  outline:none;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;
  padding:9px 14px;
  border-radius:999px;
  cursor:pointer;
  font-family:'Poppins', sans-serif;
  font-size:13px;
  font-weight:600;
  transition:.2s ease;
  box-shadow:0 0 16px rgba(168,85,247,.25);
  white-space:nowrap;
}

.btn:hover,
button.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 0 22px rgba(168,85,247,.45);
}

.admin-btn{
  border:none;
  background:#ef4444;
  color:white;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-family:'Poppins',sans-serif;
  font-weight:600;
  cursor:pointer;
  margin-top:8px;
  margin-right:6px;
}

.delete-btn{
  background:#52525b;
}

.page{
  width:100%;
  max-width:980px;
  margin:0 auto;
  padding:22px 14px 45px;
}

.reader{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}

.reader img{
  display:block;
  width:100%;
  max-width:720px;
  height:auto;
  object-fit:contain;
  border-radius:10px;
  background:#11111a;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}

.chapter-placeholder{
  width:100%;
  max-width:720px;
  background:#14141c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:28px;
  text-align:center;
  color:#ccc;
}

.chapter-placeholder strong{
  color:#e9d5ff;
}

.nav{
  width:100%;
  max-width:720px;
  margin:26px auto 18px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

#chat-container{
  width:100%;
  max-width:720px;
  margin:24px auto 0;
  background:rgba(20,20,32,.95);
  border:1px solid rgba(255,255,255,.08);
  padding:16px;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.45);
}

.chat-title{
  font-size:15px;
  font-weight:600;
  color:#e9d5ff;
}

#chat-list{
  width:100%;
  max-height:300px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-right:4px;
}

.chat-message{
  width:100%;
  background:#1b1b2b;
  padding:10px 12px;
  border-radius:14px;
  line-height:1.45;
  word-break:break-word;
  overflow-wrap:anywhere;
  border:1px solid rgba(255,255,255,.05);
  max-height:140px;
  overflow-y:auto;
}

.chat-message strong{
  color:#c084fc;
}

.comment-meta{
  font-size:11px;
  color:#777;
  margin-top:4px;
}

.chat-warning{
  color:#fca5a5;
  font-size:13px;
}

.chat-controls{
  width:100%;
  display:flex;
  gap:8px;
  align-items:center;
}

.chat-controls input[type="text"]{
  flex:1;
  min-width:0;
  padding:11px 13px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  background:#0e0e18;
  color:white;
  font-family:'Poppins', sans-serif;
  outline:none;
}

.chat-controls input[type="text"]:focus{
  border-color:#a855f7;
}

@media(max-width:600px){
  .topbar{
    padding:9px 12px;
  }

  .topbar .title{
    font-size:13px;
  }

  .page{
    padding:12px 8px 30px;
  }

  .reader{
    gap:8px;
  }

  .reader img{
    max-width:100%;
    border-radius:7px;
  }

  .nav{
    max-width:100%;
    gap:8px;
    margin:18px auto;
  }

  .btn,
  button.btn{
    padding:8px 12px;
    font-size:12px;
  }

  #chat-container{
    max-width:100%;
    border-radius:18px;
    padding:12px;
    margin-top:18px;
  }

  #chat-list{
    max-height:240px;
  }

  .chat-controls{
    flex-direction:column;
  }

  .chat-controls input[type="text"],
  .chat-controls button{
    width:100%;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="title" id="info">Capítulo</div>
  <button class="btn" onclick="voltar()">Voltar</button>
</header>

<main class="page">

  <section class="reader" id="reader"></section>

  <nav class="nav">
    <button class="btn" onclick="prevCap()">◀ Anterior</button>
    <button class="btn" onclick="nextCap()">Próximo ▶</button>
  </nav>

  <section id="chat-container">
    <div class="chat-title">Comentários</div>

    <div id="chat-list"></div>

    <div class="chat-controls">
      <input type="text" id="chat-input" maxlength="300" placeholder="Digite seu comentário...">
      <button id="send-btn" class="btn">Enviar</button>
    </div>
  </section>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const ADMIN_UIDS = ["yeckgLVGVIMrMiByikAj8FpbjTm2"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap")) || 1;

const readerDiv = document.getElementById("reader");
const chatList = document.getElementById("chat-list");
const chatInput = document.getElementById("chat-input");
const sendBtn = document.getElementById("send-btn");
const info = document.getElementById("info");

let currentUser = null;
let isAdmin = false;
let isBanned = false;
let ultimoEnvio = 0;
let ultimaMensagem = "";
let obra = null;
let paginasAtuais = [];

const LIMITE_COMENTARIO = 300;
const TEMPO_ENTRE_COMENTARIOS = 8000;

const palavrasBloqueadas = [
  "lixo",
  "merda",
  "porra",
  "caralho",
  "desgraça",
  "fdp",
  "vsf",
  "vai se fuder",
  "se mata",
  "morre",
  "odio",
  "racista",
  "nazista"
];

const obrasExemplo = {
  solo:{
    id:"solo",
    nome:"Solo Leveling",
    totalCaps:10,
    caps:{
      1:["https://i.imgur.com/8Km9tLL.jpg"],
      2:["https://i.imgur.com/qIufhof.png"],
      3:["https://i.imgur.com/4AiXzf8.jpeg"],
      4:[],
      5:[],
      6:[],
      7:[],
      8:[],
      9:[],
      10:[]
    }
  },
  nano:{
    id:"nano",
    nome:"Nano Machine",
    totalCaps:8,
    caps:{
      1:["https://i.imgur.com/qIufhof.png"],
      2:["https://i.imgur.com/4AiXzf8.jpeg"],
      3:[],
      4:[],
      5:[],
      6:[],
      7:[],
      8:[]
    }
  },
  tower:{
    id:"tower",
    nome:"Tower of God",
    totalCaps:5,
    caps:{
      1:["https://i.imgur.com/4AiXzf8.jpeg"],
      2:[],
      3:[],
      4:[],
      5:[]
    }
  },
  bleach:{
    id:"bleach",
    nome:"Bleach",
    totalCaps:5,
    caps:{
      1:["https://i.imgur.com/Yv2Jt0I.jpeg"],
      2:[],
      3:[],
      4:[],
      5:[]
    }
  },
  naruto:{
    id:"naruto",
    nome:"Naruto",
    totalCaps:5,
    caps:{
      1:["https://i.imgur.com/9iQhx0P.jpeg"],
      2:[],
      3:[],
      4:[],
      5:[]
    }
  }
};

async function carregarObra(){
  if(!id){
    alert("Obra não encontrada.");
    location.href = "manhwas.html";
    return;
  }

  try{
    const snap = await getDoc(doc(db,"manhwas",id));

    if(snap.exists()){
      const data = snap.data();

      obra = {
        id:id,
        nome:data.nome || data.titulo || "Obra sem nome",
        totalCaps:data.totalCaps || data.caps || 1,
        caps:{}
      };

      const capSnap = await getDoc(doc(db,"manhwas",id,"chapters",String(cap)));

      if(capSnap.exists()){
        const capData = capSnap.data();
        paginasAtuais = capData.pages || capData.paginas || [];
      }else{
        paginasAtuais = [];
      }

      return;
    }
  }catch(error){
    console.warn("Firestore indisponível para manhwas, usando exemplos:", error);
  }

  if(obrasExemplo[id]){
    obra = obrasExemplo[id];
    paginasAtuais = obra.caps[cap] || [];
    return;
  }

  alert("Obra não encontrada.");
  location.href = "manhwas.html";
}

function renderReader(){
  readerDiv.innerHTML = "";

  if(!obra){
    readerDiv.innerHTML = `
      <div class="chapter-placeholder">
        <strong>Obra não encontrada.</strong>
      </div>
    `;
    return;
  }

  info.innerText = `${obra.nome} • Capítulo ${cap}`;

  if(!paginasAtuais || paginasAtuais.length === 0){
    const aviso = document.createElement("div");
    aviso.className = "chapter-placeholder";
    aviso.innerHTML = `
      <strong>${obra.nome} • Capítulo ${cap}</strong><br><br>
      Este capítulo ainda não tem páginas cadastradas.<br>
      Quando você adicionar links no painel admin, eles aparecerão aqui automaticamente.
    `;
    readerDiv.appendChild(aviso);
    return;
  }

  paginasAtuais.forEach(src=>{
    if(!src) return;

    const img = document.createElement("img");
    img.src = src;
    img.loading = "lazy";
    img.alt = `${obra.nome} capítulo ${cap}`;
    readerDiv.appendChild(img);
  });
}

onAuthStateChanged(auth, async user=>{
  currentUser = user;
  isAdmin = user ? ADMIN_UIDS.includes(user.uid) : false;

  await verificarBanimento(user);

  if(user && obra){
    await setDoc(doc(db,"progress",user.uid),{
      [id]: { cap: cap }
    }, { merge:true });
  }

  loadChat();
});

window.voltar = ()=>{
  location.href = "manhwas.html?id=" + id;
};

window.nextCap = ()=>{
  const proximo = cap + 1;

  if(obra && proximo <= obra.totalCaps){
    location.href = `reader.html?id=${id}&cap=${proximo}`;
  } else {
    alert("Último capítulo atingido!");
  }
};

window.prevCap = ()=>{
  const anterior = cap - 1;

  if(anterior >= 1){
    location.href = `reader.html?id=${id}&cap=${anterior}`;
  } else {
    alert("Primeiro capítulo!");
  }
};

function limparTexto(texto){
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function temSpam(texto){
  const textoLimpo = limparTexto(texto);

  const muitosLinks = (texto.match(/https?:\/\/|www\.|\.com|\.net|\.br|discord\.gg/gi) || []).length >= 2;
  const caracteresRepetidos = /(.)\1{8,}/.test(textoLimpo);
  const palavrasRepetidas = /\b(\w+)\b(?:\s+\1\b){4,}/i.test(textoLimpo);
  const muitaMaiuscula = texto.length > 40 && texto.replace(/[^A-Z]/g,"").length > texto.length * 0.65;

  return muitosLinks || caracteresRepetidos || palavrasRepetidas || muitaMaiuscula;
}

function comentarioInvalido(texto){
  const textoLimpo = limparTexto(texto);

  if(texto.length > LIMITE_COMENTARIO){
    return "Comentário muito grande. Limite de 300 caracteres.";
  }

  if(temSpam(texto)){
    return "Comentário bloqueado por parecer spam.";
  }

  if(textoLimpo === ultimaMensagem){
    return "Você já enviou essa mensagem.";
  }

  const agora = Date.now();

  if(agora - ultimoEnvio < TEMPO_ENTRE_COMENTARIOS){
    return "Aguarde alguns segundos antes de comentar novamente.";
  }

  const bloqueada = palavrasBloqueadas.some(palavra=>{
    return textoLimpo.includes(limparTexto(palavra));
  });

  if(bloqueada){
    return "Comentário bloqueado pelas regras da comunidade.";
  }

  return null;
}

function mostrarAviso(msg){
  let aviso = document.getElementById("chatWarning");

  if(!aviso){
    aviso = document.createElement("div");
    aviso.id = "chatWarning";
    aviso.className = "chat-warning";
    chatInput.parentElement.after(aviso);
  }

  aviso.innerText = msg;

  setTimeout(()=>{
    aviso.innerText = "";
  },4000);
}

async function verificarBanimento(user){
  isBanned = false;

  if(!user) return;

  const snap = await getDoc(doc(db,"bannedUsers",user.uid));

  if(snap.exists()){
    isBanned = true;
  }
}

async function pegarMensagens(){
  const ref = doc(db,"chat",`${id}_cap_${cap}`);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    return [];
  }

  return snap.data().messages || [];
}

async function salvarMensagens(messages){
  const ref = doc(db,"chat",`${id}_cap_${cap}`);

  await setDoc(ref,{
    messages: messages
  }, { merge:true });
}

async function enviarComentario(){
  if(!currentUser){
    alert("Faça login para comentar!");
    return;
  }

  await verificarBanimento(currentUser);

  if(isBanned){
    mostrarAviso("Você foi banido do chat e não pode comentar.");
    return;
  }

  const text = chatInput.value.trim();

  if(!text) return;

  const erro = comentarioInvalido(text);

  if(erro){
    mostrarAviso(erro);
    return;
  }

  const messages = await pegarMensagens();

  const msg = {
    id: Date.now().toString(),
    uid: currentUser.uid,
    user: currentUser.displayName || "Usuário",
    text: text,
    createdAt: Date.now()
  };

  messages.push(msg);

  await salvarMensagens(messages);

  ultimoEnvio = Date.now();
  ultimaMensagem = limparTexto(text);
  chatInput.value = "";
  loadChat();
}

async function apagarComentario(commentId){
  if(!isAdmin){
    alert("Apenas administradores podem apagar comentários.");
    return;
  }

  const confirmar = confirm("Apagar este comentário?");

  if(!confirmar) return;

  const messages = await pegarMensagens();
  const filtradas = messages.filter(msg => msg.id !== commentId);

  await salvarMensagens(filtradas);
  loadChat();
}

async function banirUsuario(uid,nome){
  if(!isAdmin){
    alert("Apenas administradores podem banir.");
    return;
  }

  if(!uid){
    alert("Não foi possível identificar esse usuário.");
    return;
  }

  if(currentUser && uid === currentUser.uid){
    alert("Você não pode banir a si mesma.");
    return;
  }

  const confirmar = confirm(`Banir ${nome || "este usuário"} do chat?`);

  if(!confirmar) return;

  await setDoc(doc(db,"bannedUsers",uid),{
    uid: uid,
    name: nome || "Usuário",
    reason: "Banido por moderação",
    bannedAt: new Date(),
    bannedBy: currentUser.uid
  });

  alert("Usuário banido do chat.");
}

async function loadChat(){
  chatList.innerHTML = "";

  const messages = await pegarMensagens();

  if(messages.length === 0){
    chatList.innerHTML = `<div class="chat-message">Nenhum comentário ainda.</div>`;
    return;
  }

  messages.forEach(msg=>{
    const div = document.createElement("div");
    div.className = "chat-message";

    const nome = document.createElement("strong");
    nome.textContent = msg.user || "Usuário";

    const texto = document.createElement("span");
    texto.textContent = ": " + (msg.text || "");

    div.appendChild(nome);
    div.appendChild(texto);

    if(isAdmin){
      const meta = document.createElement("div");
      meta.className = "comment-meta";
      meta.textContent = `UID: ${msg.uid || "sem uid"}`;
      div.appendChild(meta);

      const apagarBtn = document.createElement("button");
      apagarBtn.className = "admin-btn delete-btn";
      apagarBtn.textContent = "Apagar";
      apagarBtn.onclick = ()=>{
        apagarComentario(msg.id);
      };

      const banBtn = document.createElement("button");
      banBtn.className = "admin-btn";
      banBtn.textContent = "Banir";
      banBtn.onclick = ()=>{
        banirUsuario(msg.uid,msg.user);
      };

      div.appendChild(apagarBtn);
      div.appendChild(banBtn);
    }

    chatList.appendChild(div);
  });

  chatList.scrollTop = chatList.scrollHeight;
}

sendBtn.onclick = enviarComentario;

chatInput.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    enviarComentario();
  }
});

async function iniciar(){
  await carregarObra();
  renderReader();

  if(currentUser && obra){
    await setDoc(doc(db,"progress",currentUser.uid),{
      [id]: { cap: cap }
    }, { merge:true });
  }

  loadChat();
}

iniciar();
</script>

</body>
</html>
