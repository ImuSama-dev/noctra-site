<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader • Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at top,rgba(168,85,247,.16),transparent 30%),
    #08080f;
  color:white;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(10,10,18,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header-content{
  max-width:1100px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#e9d5ff;
  font-weight:700;
  text-decoration:none;
}

.logo img{
  width:30px;
  height:30px;
  border-radius:50%;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;
  padding:9px 14px;
  border-radius:999px;
  font-family:'Poppins',sans-serif;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
  box-shadow:0 0 16px rgba(168,85,247,.25);
}

.btn:hover{
  transform:translateY(-1px);
}

.reader{
  width:100%;
  max-width:980px;
  margin:auto;
  padding:24px 10px 90px;
}

.reader-top{
  background:#14141c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:20px;
  margin-bottom:24px;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.reader-top h1{
  font-size:28px;
  margin-bottom:8px;
}

.reader-top p{
  color:#aaa;
  font-size:14px;
}

.pages{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
}

.page{
  width:100%;
  display:flex;
  justify-content:center;
}

.page img{
  width:100%;
  max-width:100%;
  height:auto;
  display:block;
  object-fit:contain;
  border-radius:0;
  background:#111;
}

.bottom-actions{
  margin-top:35px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}

.loading,
.error{
  background:#14141c;
  border:1px solid rgba(255,255,255,.08);
  padding:30px;
  border-radius:18px;
  text-align:center;
  color:#bbb;
}

.error{
  color:#fca5a5;
}

.scroll-top{
  position:fixed;
  right:18px;
  bottom:18px;
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;
  font-size:22px;
  cursor:pointer;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(168,85,247,.35);
}

.scroll-top:hover{
  transform:translateY(-3px);
}

@media(max-width:700px){

  .header-content{
    flex-direction:column;
  }

  .reader{
    padding:14px 0 90px;
  }

  .reader-top{
    margin:0 10px 18px;
    padding:16px;
  }

  .reader-top h1{
    font-size:22px;
  }

  .page img{
    width:100%;
    border-radius:0;
  }

  .bottom-actions{
    padding:0 12px;
  }

  .btn{
    width:100%;
    text-align:center;
  }

  .scroll-top{
    width:48px;
    height:48px;
    right:14px;
    bottom:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-content">

    <a href="index.html" class="logo">
      <img src="noctra-logo.png" alt="Noctra">
      <span>Noctra Core</span>
    </a>

    <div class="top-actions">
      <a href="manhwas.html" class="btn">Manhwas</a>
      <a href="favoritos.html" class="btn">Favoritos</a>
    </div>

  </div>
</header>

<main class="reader" id="reader">

  <div class="loading">
    Carregando capítulo...
  </div>

</main>

<button class="scroll-top" id="scrollTopBtn">
↑
</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core"
};

const appFirebase = initializeApp(firebaseConfig);
const db = getFirestore(appFirebase);

const reader = document.getElementById("reader");

const params = new URLSearchParams(location.search);

const obraId = params.get("id");
const cap = parseInt(params.get("cap")) || 1;

const scrollTopBtn = document.getElementById("scrollTopBtn");

scrollTopBtn.addEventListener("click",()=>{
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
});

function escaparHTML(texto){
  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderErro(msg){
  reader.innerHTML = `
    <div class="error">
      ${escaparHTML(msg)}
      <br><br>
      <a href="manhwas.html" class="btn">
        Voltar
      </a>
    </div>
  `;
}

async function carregar(){

  if(!obraId){
    renderErro("Obra não encontrada.");
    return;
  }

  try{

    const obraSnap = await getDoc(doc(db,"manhwas",obraId));

    if(!obraSnap.exists()){
      renderErro("Essa obra não existe.");
      return;
    }

    const obra = obraSnap.data();

    const chapterSnap = await getDoc(
      doc(db,"manhwas",obraId,"chapters",String(cap))
    );

    if(!chapterSnap.exists()){
      renderErro("Capítulo não encontrado.");
      return;
    }

    const chapter = chapterSnap.data();

    const pages =
      chapter.pages ||
      chapter.paginas ||
      [];

    if(!Array.isArray(pages) || pages.length === 0){
      renderErro("Esse capítulo não possui páginas.");
      return;
    }

    const totalCaps =
      obra.caps ||
      obra.totalCaps ||
      cap;

    reader.innerHTML = `
      <section class="reader-top">

        <h1>
          ${escaparHTML(obra.nome || obra.titulo || "Sem título")}
        </h1>

        <p>
          Capítulo ${cap}
        </p>

      </section>

      <section class="pages" id="pages"></section>

      <div class="bottom-actions">

        ${
          cap > 1
          ? `
            <a class="btn"
              href="reader.html?id=${encodeURIComponent(obraId)}&cap=${cap - 1}">
              ← Capítulo anterior
            </a>
          `
          : ""
        }

        <a class="btn"
          href="manhwas.html?id=${encodeURIComponent(obraId)}">
          Lista de capítulos
        </a>

        ${
          cap < totalCaps
          ? `
            <a class="btn"
              href="reader.html?id=${encodeURIComponent(obraId)}&cap=${cap + 1}">
              Próximo capítulo →
            </a>
          `
          : ""
        }

      </div>
    `;

    const pagesContainer = document.getElementById("pages");

    pages.forEach((url,index)=>{

      const div = document.createElement("div");
      div.className = "page";

      const img = document.createElement("img");

      img.loading = "lazy";

      img.src = url;

      img.alt = `Página ${index + 1}`;

      img.onerror = ()=>{
        img.style.display = "none";

        const erro = document.createElement("div");

        erro.className = "error";

        erro.style.margin = "10px";

        erro.innerHTML = `
          Falha ao carregar:
          <br><br>
          ${escaparHTML(url)}
        `;

        div.appendChild(erro);
      };

      div.appendChild(img);

      pagesContainer.appendChild(div);

    });

    document.title = `
      ${obra.nome || obra.titulo || "Reader"}
      • Capítulo ${cap}
    `;

  }catch(error){

    console.error(error);

    renderErro(
      "Erro ao carregar capítulo."
    );

  }
}

carregar();
</script>

</body>
</html>
