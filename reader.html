<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<link rel="icon" href="./noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#08080f;
  color:white;
}

.topbar{
  position:sticky;
  top:0;
  background:#111;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.btn{
  background:#7c3aed;
  border:none;
  padding:8px 12px;
  border-radius:999px;
  color:white;
  cursor:pointer;
}

.reader{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.reader img{
  width:100%;
  border-radius:8px;
  margin-bottom:10px;
}

#chat{
  max-width:900px;
  margin:20px auto;
  background:#14141c;
  padding:15px;
  border-radius:12px;
}

.msg{
  background:#1c1c2a;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  max-height:130px;
  overflow:auto;
  word-break:break-word;
}

.admin-btn{
  margin-top:5px;
  background:#ef4444;
  border:none;
  padding:4px 8px;
  border-radius:6px;
  color:white;
  font-size:11px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
  <span id="titulo">Capítulo</span>
  <button class="btn" onclick="history.back()">Voltar</button>
</div>

<div class="reader" id="reader"></div>

<div id="chat">
  <div id="chatList"></div>

  <input id="chatInput" placeholder="Comentar..." maxlength="300" style="width:100%;margin-top:10px;padding:8px;border-radius:8px;border:none;">
  <button class="btn" onclick="enviar()">Enviar</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore,doc,getDoc,setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"SUA_API_KEY",
  authDomain:"noctra-core.firebaseapp.com",
  projectId:"noctra-core"
};

const ADMIN_UIDS = ["yeckgLVGVIMrMiByikAj8FpbjTm2"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const id = params.get("id");
const cap = params.get("cap") || 1;

const obras={
  solo:{
    nome:"Solo Leveling",
    caps:{
      1:["https://i.imgur.com/8Km9tLL.jpg"]
    }
  }
};

const obra = obras[id];

if(!obra){
  alert("Erro");
}

document.getElementById("titulo").innerText = obra.nome+" cap "+cap;

const reader = document.getElementById("reader");

obra.caps[cap].forEach(src=>{
  let img=document.createElement("img");
  img.src=src;
  reader.appendChild(img);
});

let currentUser=null;
let isAdmin=false;
let isBanned=false;

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  isAdmin=user && ADMIN_UIDS.includes(user.uid);

  if(user){
    const ban=await getDoc(doc(db,"bannedUsers",user.uid));
    if(ban.exists()) isBanned=true;
  }

  load();
});

function limpar(t){
  return t.toLowerCase().trim();
}

function invalido(t){
  if(t.length>300) return "Texto muito grande";
  if(/(.)\1{8,}/.test(t)) return "Spam detectado";
  if(/https?:/.test(t)) return "Links bloqueados";
  return null;
}

async function pegar(){
  const ref=doc(db,"chat",id+"_"+cap);
  const snap=await getDoc(ref);
  if(!snap.exists()) return [];
  return snap.data().msgs||[];
}

async function salvar(msgs){
  await setDoc(doc(db,"chat",id+"_"+cap),{msgs});
}

async function enviar(){
  if(!currentUser) return alert("Login necessário");
  if(isBanned) return alert("Você foi banido");

  let t=chatInput.value.trim();
  if(!t) return;

  let erro=invalido(t);
  if(erro) return alert(erro);

  let msgs=await pegar();

  msgs.push({
    id:Date.now(),
    uid:currentUser.uid,
    user:currentUser.displayName,
    text:t
  });

  await salvar(msgs);
  chatInput.value="";
  load();
}

async function apagar(idMsg){
  if(!isAdmin) return;

  let msgs=await pegar();
  msgs=msgs.filter(m=>m.id!=idMsg);
  await salvar(msgs);
  load();
}

async function banir(uid){
  if(!isAdmin) return;

  await setDoc(doc(db,"bannedUsers",uid),{banned:true});
  alert("Usuário banido");
}

async function load(){
  chatList.innerHTML="";
  let msgs=await pegar();

  msgs.forEach(m=>{
    let div=document.createElement("div");
    div.className="msg";
    div.innerHTML="<b>"+m.user+":</b> "+m.text;

    if(isAdmin){
      div.innerHTML+=`
      <br>
      <button class="admin-btn" onclick="apagar(${m.id})">Apagar</button>
      <button class="admin-btn" onclick="banir('${m.uid}')">Banir</button>
      `;
    }

    chatList.appendChild(div);
  });
}

window.enviar=enviar;
window.apagar=apagar;
window.banir=banir;
</script>

</body>
</html>
