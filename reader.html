<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reader • Noctra</title>

<link rel="icon" href="noctra-logo.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at top,rgba(168,85,247,.15),transparent 30%),
    #08080f;
  color:white;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
}

header{
  position:relative;
  top:0;
  z-index:1000;
  background:rgba(10,10,18,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
  
.header-content{
  max-width:1100px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#e9d5ff;
  text-decoration:none;
  font-weight:700;
}

.logo img{
  width:30px;
  height:30px;
  border-radius:50%;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;
  padding:9px 14px;
  border-radius:999px;
  font-family:'Poppins',sans-serif;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
  box-shadow:0 0 16px rgba(168,85,247,.25);
}

.btn:hover{
  transform:translateY(-1px);
}

.reader{
  width:100%;
  max-width:980px;
  margin:auto;
  padding:24px 10px 70px;
}

.reader-top{
  background:#14141c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:20px;
  margin-bottom:24px;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.reader-top h1{
  font-size:28px;
  margin-bottom:8px;
}

.reader-top p{
  color:#aaa;
  font-size:14px;
}

.pages{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
}

.page{
  width:100%;
  display:flex;
  justify-content:center;
}

.page img{
  width:100%;
  max-width:100%;
  height:auto;
  display:block;
  object-fit:contain;
  background:#111;
}

.bottom-actions{
  margin-top:35px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}

.loading,
.error{
  background:#14141c;
  border:1px solid rgba(255,255,255,.08);
  padding:30px;
  border-radius:18px;
  text-align:center;
  color:#bbb;
}

.error{
  color:#fca5a5;
}

.scroll-top{
  position:fixed;
  right:18px;
  bottom:18px;
  width:54px;
  height:54px;
  border:none;
  border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;
  font-size:22px;
  cursor:pointer;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(168,85,247,.35);
}

.scroll-top:hover{
  transform:translateY(-3px);
}

/* CHAT */

.chat-section{
  margin-top:45px;
  background:#14141c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:20px;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.chat-title{
  font-size:22px;
  margin-bottom:18px;
  color:#f5f0ff;
}

.chat-form{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:22px;
}

.chat-form textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  border:none;
  outline:none;
  border-radius:18px;
  background:#0f0f18;
  color:white;
  padding:16px;
  font-family:'Poppins',sans-serif;
  border:1px solid rgba(255,255,255,.08);
}

.chat-form textarea:focus{
  border-color:#a855f7;
}

.chat-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.upload-label{
  background:#0f0f18;
  border:1px solid rgba(255,255,255,.08);
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer;
  font-size:14px;
}

.upload-label:hover{
  border-color:#a855f7;
}

.chat-actions input{
  display:none;
}

.chat-list{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.message{
  background:#0f0f18;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:16px;
}

.message-top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.message-top img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.message-user{
  font-weight:600;
  color:#f5f0ff;
}

.message-date{
  font-size:12px;
  color:#888;
}

.message-text{
  line-height:1.7;
  color:#ddd;
  word-break:break-word;
}

.message-image{
  width:100%;
  max-width:420px;
  border-radius:16px;
  margin-top:14px;
  display:block;
}

.reply-box{
  margin-top:12px;
  background:#161625;
  border-left:3px solid #a855f7;
  padding:10px 12px;
  border-radius:12px;
  font-size:13px;
  color:#ccc;
}

.reply-btn{
  margin-top:12px;
  background:none;
  border:none;
  color:#c084fc;
  cursor:pointer;
  font-size:13px;
}

.replying{
  background:#201531;
  border:1px solid rgba(168,85,247,.45);
  padding:12px;
  border-radius:14px;
  margin-bottom:12px;
  font-size:13px;
}

.cancel-reply{
  color:#fca5a5;
  cursor:pointer;
  margin-top:6px;
  display:inline-block;
}

.empty-chat{
  color:#888;
  text-align:center;
  padding:18px;
}

@media(max-width:700px){

  .header-content{
    flex-direction:column;
  }

  .reader{
    padding:14px 0 80px;
  }

  .reader-top{
    margin:0 10px 18px;
    padding:16px;
  }

  .reader-top h1{
    font-size:22px;
  }

  .page img{
    width:100%;
  }

  .bottom-actions{
    padding:0 12px;
  }

  .btn{
    width:100%;
    text-align:center;
  }

  .chat-section{
    margin:35px 10px 0;
    padding:16px;
  }

  .message-image{
    max-width:100%;
  }

  .scroll-top{
    width:48px;
    height:48px;
    right:14px;
    bottom:14px;
  }
}

</style>
</head>

<body>

<header>

  <div class="header-content">

    <a href="index.html" class="logo">
      <img src="noctra-logo.png">
      <span>Noctra Core</span>
    </a>

    <div class="top-actions">
      <a href="manhwas.html" class="btn">Manhwas</a>
      <a href="favoritos.html" class="btn">Favoritos</a>
    </div>

  </div>

</header>

<main class="reader" id="reader">

  <div class="loading">
    Carregando capítulo...
  </div>

</main>

<button class="scroll-top" id="scrollTopBtn">
↑
</button>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app"
};

const appFirebase = initializeApp(firebaseConfig);

const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

const provider = new GoogleAuthProvider();

const reader = document.getElementById("reader");

const params = new URLSearchParams(location.search);

const obraId = params.get("id");
const cap = parseInt(params.get("cap")) || 1;

const scrollTopBtn = document.getElementById("scrollTopBtn");
  
scrollTopBtn.addEventListener("click",()=>{
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
});

let currentUser = null;
let replyingTo = null;

function escaparHTML(texto){
  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderErro(msg){

  reader.innerHTML = `
    <div class="error">
      ${escaparHTML(msg)}
      <br><br>

      <a href="manhwas.html" class="btn">
        Voltar
      </a>
    </div>
  `;
}

async function carregar(){

  if(!obraId){
    renderErro("Obra não encontrada.");
    return;
  }

  try{

    const obraSnap = await getDoc(
      doc(db,"manhwas",obraId)
    );

    if(!obraSnap.exists()){
      renderErro("Essa obra não existe.");
      return;
    }

    const obra = obraSnap.data();

    const chapterSnap = await getDoc(
      doc(db,"manhwas",obraId,"chapters",String(cap))
    );

    if(!chapterSnap.exists()){
      renderErro("Capítulo não encontrado.");
      return;
    }

    const chapter = chapterSnap.data();

    const pages =
      chapter.pages ||
      chapter.paginas ||
      [];

    if(!Array.isArray(pages) || pages.length === 0){
      renderErro("Esse capítulo não possui páginas.");
      return;
    }

    const totalCaps =
      obra.caps ||
      obra.totalCaps ||
      cap;

    reader.innerHTML = `

      <section class="reader-top">

        <h1>
          ${escaparHTML(obra.nome || obra.titulo || "Sem título")}
        </h1>

        <p>
          Capítulo ${cap}
        </p>

      </section>

      <section class="pages" id="pages"></section>

      <div class="bottom-actions">

        ${
          cap > 1
          ? `
            <a class="btn"
              href="reader.html?id=${encodeURIComponent(obraId)}&cap=${cap - 1}">
              ← Capítulo anterior
            </a>
          `
          : ""
        }

        <a class="btn"
          href="manhwas.html?id=${encodeURIComponent(obraId)}">
          Lista de capítulos
        </a>

        ${
          cap < totalCaps
          ? `
            <a class="btn"
              href="reader.html?id=${encodeURIComponent(obraId)}&cap=${cap + 1}">
              Próximo capítulo →
            </a>
          `
          : ""
        }

      </div>

      <section class="chat-section">

        <h2 class="chat-title">
          Comentários
        </h2>

        <div id="chatArea"></div>

      </section>

    `;

    const pagesContainer =
      document.getElementById("pages");

    pages.forEach((url,index)=>{

      const div = document.createElement("div");

      div.className = "page";

      const img = document.createElement("img");

      img.loading = "lazy";

      img.src = url;

      img.alt = `Página ${index + 1}`;

      img.onerror = ()=>{

        img.style.display = "none";

        const erro = document.createElement("div");

        erro.className = "error";

        erro.style.margin = "10px";

        erro.innerHTML = `
          Falha ao carregar:
          <br><br>
          ${escaparHTML(url)}
        `;

        div.appendChild(erro);

      };

      div.appendChild(img);

      pagesContainer.appendChild(div);

    });

    document.title = `
      ${obra.nome || obra.titulo || "Reader"}
      • Capítulo ${cap}
    `;

    iniciarChat();

  }catch(error){

    console.error(error);

    renderErro(
      "Erro ao carregar capítulo."
    );

  }
}

function iniciarChat(){

  const chatArea =
    document.getElementById("chatArea");

  chatArea.innerHTML = `

    <div id="replyingBox"></div>

    <div class="chat-form">

      <textarea
        id="chatInput"
        placeholder="Escreva um comentário..."
      ></textarea>

      <div class="chat-actions">

        <button class="btn" id="sendBtn">
          Enviar
        </button>

      </div>

    </div>

    <div class="chat-list" id="chatList">

      <div class="empty-chat">
        Carregando comentários...
      </div>

    </div>

  `;

  const sendBtn =
    document.getElementById("sendBtn");

  sendBtn.onclick = enviarMensagem;

  carregarMensagens();
}

async function enviarMensagem(){

  if(!currentUser){

    alert("Faça login para comentar.");

    await signInWithPopup(auth,provider);

    return;
  }

  const input =
    document.getElementById("chatInput");


  const texto =
    input.value.trim();


if(!texto){
  return;
}

try{


    await addDoc(
      collection(
        db,
        "manhwas",
        obraId,
        "chapters",
        String(cap),
        "comments"
      ),
      {
        user: currentUser.displayName || "Usuário",
        uid: currentUser.uid,
        photo: currentUser.photoURL || "",
        text: texto,
        createdAt: serverTimestamp(),
        reply: replyingTo || null
      }
    );

    input.value = "";


    replyingTo = null;

    atualizarReplying();

  }catch(error){

    console.error(error);

    alert(
      "Erro ao enviar comentário."
    );

  }
}

function atualizarReplying(){

  const box =
    document.getElementById("replyingBox");

  if(!box) return;

  if(!replyingTo){

    box.innerHTML = "";

    return;
  }

  box.innerHTML = `

    <div class="replying">

      Respondendo:
      <br><br>

      ${escaparHTML(replyingTo.user)}

      <br>

      "${escaparHTML(replyingTo.text)}"

      <br>

      <span
        class="cancel-reply"
        id="cancelReply"
      >
        Cancelar resposta
      </span>

    </div>

  `;

  document
    .getElementById("cancelReply")
    .onclick = ()=>{

      replyingTo = null;

      atualizarReplying();

    };
}

function carregarMensagens(){

  const chatList =
    document.getElementById("chatList");

  const q = query(
    collection(
      db,
      "manhwas",
      obraId,
      "chapters",
      String(cap),
      "comments"
    ),
    orderBy("createdAt","asc")
  );

  onSnapshot(q,(snapshot)=>{

    chatList.innerHTML = "";

    if(snapshot.empty){

      chatList.innerHTML = `
        <div class="empty-chat">
          Nenhum comentário ainda.
        </div>
      `;

      return;
    }

    snapshot.forEach(docSnap=>{

      const data = docSnap.data();

      const div =
        document.createElement("div");

      div.className = "message";

      const date =
        data.createdAt?.toDate
        ? data.createdAt
            .toDate()
            .toLocaleString("pt-BR")
        : "Agora";

      div.innerHTML = `

        <div class="message-top">

          <img src="${
            data.photo ||
            "noctra-logo.png"
          }">

          <div>

            <div class="message-user">
              ${escaparHTML(data.user)}
            </div>

            <div class="message-date">
              ${date}
            </div>

          </div>

        </div>

        ${
          data.reply
          ? `
            <div class="reply-box">

              Respondendo a
              <strong>
                ${escaparHTML(data.reply.user)}
              </strong>

              <br><br>

              "${escaparHTML(data.reply.text)}"

            </div>
          `
          : ""
        }

        ${
          data.text
          ? `
            <div class="message-text">
              ${escaparHTML(data.text)}
            </div>
          `
          : ""
        }

        ${
          data.image
          ? `
            <img
              class="message-image"
              src="${data.image}"
            >
          `
          : ""
        }

        <button class="reply-btn">
          Responder
        </button>

      `;

      div.querySelector(".reply-btn")
      .onclick = ()=>{

        replyingTo = {
          user:data.user,
          text:data.text || "Imagem"
        };

        atualizarReplying();

        window.scrollTo({
          top:document.body.scrollHeight,
          behavior:"smooth"
        });

      };

      chatList.appendChild(div);

    });

  });

}

onAuthStateChanged(auth,(user)=>{

  currentUser = user;

});

carregar();

</script>

</body>
</html>
