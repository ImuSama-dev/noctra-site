<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<link rel="icon" href="./noctra-logo.png">

<style>
body {
  margin:0;
  background:#0b0b12;
  color:white;
  font-family:'Poppins', sans-serif;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* Top bar */
.topbar {
  position:fixed;
  top:0;
  width:100%;
  background:#111;
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
  border-bottom:1px solid #1f1f2e;
}

/* Reader container */
.reader-container {
  margin-top:60px; /* abaixo do topbar */
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

/* Reader images */
.reader img {
  width:100%;
  max-width:800px;
  border-radius:8px;
}

/* Navigation buttons */
.nav {
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
}

/* Like/Dislike */
.vote {
  display:flex;
  justify-content:center;
  gap:15px;
  margin:10px 0;
  flex-wrap:wrap;
}

.vote button {
  background:#a855f7;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  color:white;
  cursor:pointer;
  transition:.2s;
}
.vote button:hover { background:#9333ea; }

#chat {
  max-width:800px;
  width:95%;
  background:#14141c;
  border-radius:8px;
  padding:15px;
  margin:15px 0;
}

#chat h3 {
  margin-bottom:10px;
}

#chat-messages {
  max-height:150px;
  overflow-y:auto;
  margin-bottom:10px;
}

#chat-messages div {
  padding:5px 0;
  border-bottom:1px solid #1f1f2e;
}

#chat input {
  width:calc(100% - 60px);
  padding:6px;
  border-radius:6px;
  border:none;
  background:#0f0f1a;
  color:white;
}
#chat button {
  padding:6px 10px;
  border:none;
  border-radius:6px;
  background:#a855f7;
  color:white;
  cursor:pointer;
  margin-left:5px;
}

/* Responsive */
@media(max-width:600px){
  .reader img { max-width:95%; }
  .topbar { flex-direction:column; align-items:flex-start; }
  .nav { flex-direction:column; }
}
</style>
</head>

<body>

<div class="topbar">
  <div id="info"></div>
  <div><button onclick="voltar()">Voltar</button></div>
</div>

<div class="reader-container" id="reader"></div>

<div class="vote">
  <button id="likeBtn">👍 Gostei <span id="likesCount">0</span></button>
  <button id="dislikeBtn">👎 Não gostei <span id="dislikesCount">0</span></button>
</div>

<div id="chat">
  <h3>Comentários</h3>
  <div id="chat-messages"></div>
  <input id="chat-input" placeholder="Escreva algo...">
  <button onclick="enviarChat()">Enviar</button>
</div>

<div class="nav">
  <button onclick="prevCap()">◀ Anterior</button>
  <button onclick="nextCap()">Próximo ▶</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// PEGAR PARAMS
const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap"));
if(!id || !cap){ alert("Erro ao abrir capítulo"); location.href="manhwas.html"; }

// DADOS EXEMPLO
const obras = {
  solo:{ nome:"Solo Leveling", caps:{1:["https://i.imgur.com/8Km9tLL.jpg","https://i.imgur.com/qIufhof.png"],2:["https://i.imgur.com/8Km9tLL.jpg"] }},
  nano:{ nome:"Nano Machine", caps:{1:["https://i.imgur.com/qIufhof.png"] }}
};

const obra = obras[id];
if(!obra || !obra.caps[cap]){ alert("Capítulo não encontrado"); location.href=`manhwas.html?id=${id}`; }

// INFO
document.getElementById("info").innerText = obra.nome + " • Capítulo " + cap;

// RENDER IMAGENS
const reader = document.getElementById("reader");
obra.caps[cap].forEach(src=>{
  let img = document.createElement("img");
  img.src = src;
  reader.appendChild(img);
});

// SALVAR PROGRESSO
onAuthStateChanged(auth, async user=>{
  if(!user) return;
  await setDoc(doc(db,"progress",user.uid), {[id]:{cap:cap}}, {merge:true});
});

// CONTROLES CAPÍTULO
window.voltar = () => { location.href = `manhwas.html?id=${id}`; }
window.nextCap = () => {
  const next = cap+1;
  if(obra.caps[next]) location.href = `reader.html?id=${id}&cap=${next}`;
  else alert("Último capítulo alcançado!");
}
window.prevCap = () => {
  const prev = cap-1;
  if(prev>0) location.href = `reader.html?id=${id}&cap=${prev}`;
}

// 👍👎 Votes únicos por usuário
const likesCount = document.getElementById("likesCount");
const dislikesCount = document.getElementById("dislikesCount");
let userVote = null;

async function atualizarVotes(){
  const user = auth.currentUser;
  const ref = doc(db,"votes",`${id}-${cap}`);
  const snap = await getDoc(ref);
  let likes=0, dislikes=0;
  let votesUsers={};
  if(snap.exists()){
    likes = snap.data().likes||0;
    dislikes = snap.data().dislikes||0;
    votesUsers = snap.data().users||{};
  }
  userVote = user ? votesUsers[user.uid] : null;
  likesCount.innerText = likes;
  dislikesCount.innerText = dislikes;
}

async function votar(tipo){
  const user = auth.currentUser;
  if(!user){ alert("Faça login para votar"); return; }
  const ref = doc(db,"votes",`${id}-${cap}`);
  const snap = await getDoc(ref);
  let likes=0, dislikes=0;
  let votesUsers={};
  if(snap.exists()){
    likes = snap.data().likes||0;
    dislikes = snap.data().dislikes||0;
    votesUsers = snap.data().users||{};
  }

  const uid = user.uid;

  // Se já votou o mesmo tipo -> remover
  if(votesUsers[uid]===tipo){
    if(tipo==="like") likes--; else dislikes--;
    delete votesUsers[uid];
  } else {
    // mudar ou novo voto
    if(votesUsers[uid]==="like") likes--;
    if(votesUsers[uid]==="dislike") dislikes--;
    if(tipo==="like") likes++; else dislikes++;
    votesUsers[uid]=tipo;
  }

  await setDoc(ref,{likes,dislikes,users:votesUsers});
  await atualizarVotes();
}

onAuthStateChanged(auth,()=>atualizarVotes());
document.getElementById("likeBtn").onclick = ()=>votar("like");
document.getElementById("dislikeBtn").onclick = ()=>votar("dislike");

// CHAT SIMPLES
const chatInput = document.getElementById("chat-input");
const chatMessages = document.getElementById("chat-messages");

async function enviarChat(){
  const user = auth.currentUser;
  if(!user){ alert("Faça login para comentar"); return; }
  const text = chatInput.value.trim();
  if(!text) return;
  const ref = doc(db,"chat",`${id}-${cap}`);
  await setDoc(ref, {messages: arrayUnion({uid:user.uid,name:user.displayName,text})},{merge:true});
  chatInput.value="";
  carregarChat();
}

async function carregarChat(){
  const ref = doc(db,"chat",`${id}-${cap}`);
  const snap = await getDoc(ref);
  chatMessages.innerHTML="";
  if(!snap.exists()) return;
  const msgs = snap.data().messages||[];
  msgs.forEach(m=>{
    const div = document.createElement("div");
    div.textContent = `${m.name}: ${m.text}`;
    chatMessages.appendChild(div);
  });
}

onAuthStateChanged(auth,()=>carregarChat());

</script>
</body>
</html>
