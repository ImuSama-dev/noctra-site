<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<link rel="icon" href="./noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#0b0b12;
  color:white;
  font-family:'Poppins', sans-serif;
}

.topbar{
  position:fixed;
  top:0;
  width:100%;
  background:#111;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
  border-bottom:1px solid #333;
}

.topbar span{
  font-weight:600;
}

.btn{
  background:#a855f7;
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
  transition:.2s;
  color:white;
}

.btn:hover{
  background:#9333ea;
  transform:scale(1.05);
}

.reader{
  margin-top:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.reader img{
  width:100%;
  max-width:800px;
  margin-bottom:10px;
  border-radius:8px;
  transition:.3s;
}

.reader img:hover{
  transform:scale(1.02);
}

.nav{
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:1000;
}

.comments{
  max-width:800px;
  margin:40px auto 20px;
  background:#14141c;
  padding:20px;
  border-radius:12px;
}

.comments h3{
  margin-bottom:15px;
}

.comment{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  align-items:flex-start;
}

.comment img{
  width:32px;
  height:32px;
  border-radius:50%;
}

.comment-text{
  background:#1c1c2a;
  padding:8px 12px;
  border-radius:10px;
  flex:1;
}

#new-comment{
  display:flex;
  margin-top:15px;
  gap:10px;
}

#new-comment input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#14141c;
  color:white;
}
</style>
</head>

<body>

<div class="topbar">
  <span id="info">Carregando...</span>
  <div><span class="btn" onclick="voltar()">Voltar</span></div>
</div>

<div class="reader" id="reader"></div>

<div class="nav">
  <div class="btn" onclick="prevCap()">◀ Anterior</div>
  <div class="btn" onclick="nextCap()">Próximo ▶</div>
</div>

<div class="comments">
  <h3>Comentários</h3>
  <div id="comment-list"></div>
  <div id="new-comment">
    <input type="text" id="comment-input" placeholder="Digite seu comentário...">
    <span class="btn" onclick="addComment()">Enviar</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
    authDomain: "noctra-core.firebaseapp.com",
    projectId: "noctra-core",
    storageBucket: "noctra-core.firebasestorage.app",
    messagingSenderId: "506534658543",
    appId: "1:506534658543:web:14bd38c377336619e2f61a"
  };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap")) || 1;

if(!id){
  alert("Erro ao abrir capítulo");
  location.href="index.html";
}

// OBRAS SIMULADAS
const obras = {
  solo:{
    nome:"Solo Leveling",
    caps:{
      1:["https://i.imgur.com/8Km9tLL.jpg","https://i.imgur.com/8Km9tLL.jpg"],
      2:["https://i.imgur.com/8Km9tLL.jpg"]
    }
  },
  nano:{
    nome:"Nano Machine",
    caps:{
      1:["https://i.imgur.com/qIufhof.png","https://i.imgur.com/qIufhof.png"]
    }
  }
};

const obra = obras[id];
if(!obra || !obra.caps[cap]){
  alert("Capítulo não encontrado");
  location.href="manhwas.html?id="+id;
}

document.getElementById("info").innerText = `${obra.nome} • Capítulo ${cap}`;

const reader = document.getElementById("reader");
function renderImages(){
  reader.innerHTML="";
  obra.caps[cap].forEach(src=>{
    const img = document.createElement("img");
    img.src = src;
    reader.appendChild(img);
  });
}
renderImages();

// SALVAR PROGRESSO
onAuthStateChanged(auth, async user=>{
  if(!user) return;
  await setDoc(doc(db,"progress",user.uid), {
    [id]: { cap: cap }
  }, { merge:true });

  renderComments();
});

// NAVEGAÇÃO
window.voltar = () => location.href = `manhwas.html?id=${id}`;
window.nextCap = () => {
  const nextCap = cap + 1;
  if(obra.caps[nextCap]){
    cap = nextCap;
    location.href = `reader.html?id=${id}&cap=${cap}`;
  } else {
    alert("Último capítulo");
  }
};
window.prevCap = () => {
  const prevCap = cap - 1;
  if(prevCap >= 1 && obra.caps[prevCap]){
    cap = prevCap;
    location.href = `reader.html?id=${id}&cap=${cap}`;
  } else {
    alert("Primeiro capítulo");
  }
};

// ✨ CHAT / COMENTÁRIOS
const commentList = document.getElementById("comment-list");
const commentInput = document.getElementById("comment-input");

async function renderComments(){
  commentList.innerHTML="";
  onAuthStateChanged(auth, async user=>{
    const snap = await getDoc(doc(db,"comments",id+"-"+cap));
    const data = snap.exists() ? snap.data().list || [] : [];
    data.forEach(c=>{
      const div = document.createElement("div");
      div.className="comment";
      div.innerHTML=`<img src="${c.photo||'https://i.imgur.com/8Km9tLL.jpg'}"><div class="comment-text"><strong>${c.user||'Anon'}:</strong> ${c.text}</div>`;
      commentList.appendChild(div);
    });
  });
}

window.addComment = async () => {
  const text = commentInput.value.trim();
  if(!text) return;
  onAuthStateChanged(auth, async user=>{
    const cUser = user ? {user:user.displayName, photo:user.photoURL} : {user:'Anon', photo:''};
    const docRef = doc(db,"comments",id+"-"+cap);
    await setDoc(docRef,{list: arrayUnion({text,...cUser})},{merge:true});
    commentInput.value="";
    renderComments();
  });
};
</script>

</body>
</html>
