<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<link rel="icon" href="noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:#0b0b12;
  color:white;
  font-family:'Poppins', sans-serif;
  scroll-behavior: smooth;
}

/* TOP BAR */
.topbar {
  position:fixed;
  top:0;
  width:100%;
  background:rgba(10,10,20,0.95);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  z-index:1000;
  border-bottom:1px solid #1f1f2e;
}

.topbar div, .topbar span {
  color:#ccc;
  font-weight:600;
}

.topbar .btn {
  background:#a855f7;
  border:none;
  padding:6px 14px;
  border-radius:8px;
  color:white;
  cursor:pointer;
  transition:.3s;
}

.topbar .btn:hover {
  background:#9333ea;
}

/* READER */
.reader {
  margin-top:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-bottom:50px;
}

.reader img {
  width:100%;
  max-width:900px;
  margin-bottom:15px;
  border-radius:6px;
  box-shadow:0 0 15px #000a;
}

/* NAVIGATION */
.nav {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:1000;
}

.nav .btn {
  background:#a855f7;
  padding:8px 16px;
  border-radius:8px;
  cursor:pointer;
  color:white;
  font-weight:600;
  transition:.3s;
}

.nav .btn:hover {
  background:#9333ea;
}

/* COMMENTS */
.comments-section {
  max-width:900px;
  margin:40px auto;
  padding:20px;
  background:#14141c;
  border-radius:12px;
}

.comments-section h2 {
  font-size:20px;
  margin-bottom:15px;
}

.comment-form {
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:20px;
}

.comment-form textarea {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  resize:none;
  background:#0f0f15;
  color:white;
}

.comment-form button {
  width:150px;
  padding:8px 12px;
  background:#a855f7;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
  transition:.3s;
}

.comment-form button:hover {
  background:#9333ea;
}

.comment {
  display:flex;
  gap:10px;
  margin-bottom:12px;
  align-items:flex-start;
}

.comment img {
  width:32px;
  height:32px;
  border-radius:50%;
}

.comment span {
  color:#aaa;
  font-size:14px;
}

.comment p {
  margin:0;
  color:white;
  font-size:15px;
}
</style>
</head>

<body>

<div class="topbar">
  <div id="info">Carregando...</div>
  <div>
    <span class="btn" onclick="voltar()">Voltar</span>
  </div>
</div>

<div class="reader" id="reader"></div>

<div class="nav">
  <div class="btn" onclick="prevCap()">◀ Anterior</div>
  <div class="btn" onclick="nextCap()">Próximo ▶</div>
</div>

<!-- COMMENTS -->
<div class="comments-section">
  <h2>Comentários</h2>
  <div id="comments-list"></div>

  <div class="comment-form">
    <textarea id="comment-input" rows="3" placeholder="Digite seu comentário..."></textarea>
    <button onclick="addComment()">Enviar comentário</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "SUA_API_KEY_AQUI",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:6cd65bc3a0267878e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// URL Params
const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap"));

// Validar params
if(!id || !cap){ alert("Erro ao abrir capítulo"); location.href="index.html"; }

// Obras simuladas
const obras = {
  solo:{
    nome:"Solo Leveling",
    caps:{
      1:["https://i.imgur.com/8Km9tLL.jpg","https://i.imgur.com/8Km9tLL.jpg"],
      2:["https://i.imgur.com/8Km9tLL.jpg","https://i.imgur.com/8Km9tLL.jpg"]
    }
  },
  nano:{
    nome:"Nano Machine",
    caps:{
      1:["https://i.imgur.com/qIufhof.png","https://i.imgur.com/qIufhof.png"]
    }
  }
};

const obra = obras[id];
if(!obra || !obra.caps[cap]){ alert("Capítulo não encontrado"); location.href="manhwas.html?id="+id; }

// Info
document.getElementById("info").innerText = obra.nome + " • Capítulo " + cap;

// Render imagens
const reader = document.getElementById("reader");
reader.innerHTML="";
obra.caps[cap].forEach(src => {
  let img = document.createElement("img");
  img.src = src;
  reader.appendChild(img);
});

// Salvar progresso
onAuthStateChanged(auth, async user=>{
  if(!user) return;
  await setDoc(doc(db,"progress",user.uid), { [id]:{cap:cap} }, { merge:true });
});

// Navegação
window.voltar = ()=> location.href="manhwas.html?id="+id;
window.nextCap = ()=> {
  if(cap<Object.keys(obra.caps).length){ cap++; location.href=`reader.html?id=${id}&cap=${cap}`; }
  else alert("Último capítulo");
};
window.prevCap = ()=> {
  if(cap>1){ cap--; location.href=`reader.html?id=${id}&cap=${cap}`; }
  else alert("Primeiro capítulo");
};

// Comentários
const commentsList = document.getElementById("comments-list");
const commentInput = document.getElementById("comment-input");
let currentUser = null;

onAuthStateChanged(auth, user=>{
  currentUser = user;
});

// Função para adicionar comentário
window.addComment = async ()=>{
  if(!currentUser){ alert("Faça login primeiro"); return; }
  const text = commentInput.value.trim();
  if(!text) return;
  await addDoc(collection(db,"comments"),{
    obra:id,
    cap:cap,
    userName:currentUser.displayName,
    userPhoto:currentUser.photoURL,
    text:text,
    timestamp:new Date()
  });
  commentInput.value="";
};

// Render em tempo real
const q = query(collection(db,"comments"), orderBy("timestamp","asc"));
onSnapshot(q, snap=>{
  commentsList.innerHTML="";
  snap.docs.forEach(doc=>{
    const c = doc.data();
    if(c.obra===id && c.cap===cap){
      const div = document.createElement("div");
      div.className="comment";
      div.innerHTML=`<img src="${c.userPhoto}"><div><span>${c.userName}</span><p>${c.text}</p></div>`;
      commentsList.appendChild(div);
    }
  });
});
</script>

</body>
</html>
