<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>
<link rel="icon" href="./noctra-logo.png">

<style>
body{
  margin:0;
  background:#0b0b12;
  color:white;
  font-family: 'Poppins', sans-serif;
}
.topbar{
  position:fixed;
  top:0;
  width:100%;
  background:#111;
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}
.topbar .btn{
  background:#a855f7;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  color:white;
}
.reader{
  margin-top:70px;
  max-width:800px;
  margin-left:auto;
  margin-right:auto;
  padding:10px;
}
.reader img{
  width:100%;
  margin-bottom:10px;
  border-radius:10px;
}
.nav{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}
.nav .btn{
  background:#9333ea;
  padding:10px 14px;
  border-radius:6px;
  cursor:pointer;
  color:white;
}
#like-dislike{
  display:flex;
  gap:10px;
  justify-content:center;
  margin:20px 0;
}
#like-dislike button{
  background:#a855f7;
  border:none;
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  color:white;
  font-weight:bold;
}
#like-dislike span{
  margin-left:6px;
  font-weight:bold;
}
#chat-container{
  max-width:800px;
  margin:20px auto 50px;
}
#chat-list{
  max-height:400px;
  overflow-y:auto;
  padding:10px;
  background:#14141c;
  border-radius:10px;
  margin-bottom:10px;
}
#chat-container input[type=text]{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#1c1c2a;
  color:white;
}
#chat-container button{
  padding:10px 14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
@media(max-width:600px){
  .topbar, #chat-container, .reader{
    padding:10px;
  }
  .nav{
    flex-direction:column;
    gap:8px;
  }
  #like-dislike{
    flex-direction:column;
    gap:8px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div id="info">Capítulo</div>
  <div>
    <span class="btn" onclick="voltar()">Voltar</span>
  </div>
</div>

<div class="reader" id="reader"></div>

<div id="like-dislike">
  <button id="btn-like">👍 Gostei <span id="like-count">0</span></button>
  <button id="btn-dislike">👎 Não gostei <span id="dislike-count">0</span></button>
</div>

<div class="nav">
  <div class="btn" onclick="prevCap()">◀ Anterior</div>
  <div class="btn" onclick="nextCap()">Próximo ▶</div>
</div>

<!-- Chat será carregado via script -->
<div id="chat-container"></div>

<script type="module">
// 🔥 FIREBASE CONFIG
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// PEGAR PARAMS
const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap"));

if(!id || !cap){
  alert("Erro ao abrir capítulo");
  location.href="index.html";
}

// SIMULAÇÃO DE OBRAS
const obras = {
  solo:{ nome:"Solo Leveling", caps:{
    1:["https://i.imgur.com/8Km9tLL.jpg","https://i.imgur.com/8Km9tLL.jpg"],
    2:["https://i.imgur.com/8Km9tLL.jpg","https://i.imgur.com/8Km9tLL.jpg"]
  }},
  nano:{ nome:"Nano Machine", caps:{
    1:["https://i.imgur.com/qIufhof.png","https://i.imgur.com/qIufhof.png"]
  }}
};

const obra = obras[id];
if(!obra || !obra.caps[cap]){
  alert("Capítulo não encontrado");
  location.href="manhwas.html?id="+id;
}

// SETAR INFO
document.getElementById("info").innerText = obra.nome + " • Capítulo " + cap;

// RENDERIZAR IMAGENS
const readerDiv = document.getElementById("reader");
readerDiv.innerHTML="";
obra.caps[cap].forEach(src=>{
  const img = document.createElement("img");
  img.src = src;
  readerDiv.appendChild(img);
});

// 🔥 Likes/Dislikes por usuário
const btnLike = document.getElementById("btn-like");
const btnDislike = document.getElementById("btn-dislike");
const likeCount = document.getElementById("like-count");
const dislikeCount = document.getElementById("dislike-count");

async function updateReaction(type){
  const user = auth.currentUser;
  if(!user) return alert("Faça login para reagir!");

  const docRef = doc(db,"reactions",`${id}_cap_${cap}`);
  const snap = await getDoc(docRef);
  let data = snap.exists() ? snap.data() : {likes:[],dislikes:[]};

  // impedir múltiplos
  if(type==="like" && data.likes.includes(user.uid)) return;
  if(type==="dislike" && data.dislikes.includes(user.uid)) return;

  // remover do outro tipo
  if(type==="like"){
    data.dislikes = data.dislikes.filter(uid => uid!==user.uid);
    data.likes.push(user.uid);
  } else {
    data.likes = data.likes.filter(uid => uid!==user.uid);
    data.dislikes.push(user.uid);
  }

  await setDoc(docRef,data);
  likeCount.innerText = data.likes.length;
  dislikeCount.innerText = data.dislikes.length;
}

btnLike.addEventListener("click",()=>updateReaction("like"));
btnDislike.addEventListener("click",()=>updateReaction("dislike"));

// CARREGAR CONTAGEM EXISTENTE
async function loadReactions(){
  const snap = await getDoc(doc(db,"reactions",`${id}_cap_${cap}`));
  if(!snap.exists()) return;
  const data = snap.data();
  likeCount.innerText = data.likes.length;
  dislikeCount.innerText = data.dislikes.length;
}
onAuthStateChanged(auth,()=>loadReactions());
loadReactions();

// 🔥 BOTÕES DE NAVEGAÇÃO
window.voltar = () => location.href="manhwas.html?id="+id;
window.nextCap = () => {
  cap++;
  if(!obra.caps[cap]){
    alert("Último capítulo");
    cap--; return;
  }
  location.href=`reader.html?id=${id}&cap=${cap}`;
};
window.prevCap = () => {
  if(cap>1) location.href=`reader.html?id=${id}&cap=${cap-1}`;
};

// 🔥 CHAT INTEGRADO
const chatContainer = document.getElementById("chat-container");
chatContainer.innerHTML = `
  <h2 style="margin-top:30px;color:#c084fc;">Comentários</h2>
  <div id="chat-list" style="max-height:400px;overflow-y:auto;padding:10px;background:#14141c;border-radius:10px;margin-bottom:10px;"></div>
  <div style="display:flex;gap:10px;margin-bottom:30px;">
    <input type="text" id="chat-input" placeholder="Digite seu comentário..." style="flex:1;padding:10px;border-radius:8px;border:none;background:#1c1c2a;color:white;">
    <input type="file" id="chat-file" style="display:none;">
    <button id="upload-btn" style="padding:10px 14px;border-radius:8px;background:#a855f7;color:white;cursor:pointer;">📎</button>
    <button id="send-btn" style="padding:10px 14px;border-radius:8px;background:#9333ea;color:white;cursor:pointer;">Enviar</button>
  </div>
`;

const chatList = document.getElementById("chat-list");
const chatInput = document.getElementById("chat-input");
const chatFile = document.getElementById("chat-file");
const sendBtn = document.getElementById("send-btn");
const uploadBtn = document.getElementById("upload-btn");
uploadBtn.addEventListener("click",()=>chatFile.click());

async function loadChat(){
  chatList.innerHTML="";
  const docRef = doc(db, "chat", `${id}_cap_${cap}`);
  const snap = await getDoc(docRef);
  if(!snap.exists()) return;
  const messages = snap.data().messages || [];
  messages.forEach(msg=>{
    const div = document.createElement("div");
    div.style.marginBottom="10px";
    div.style.background="#1c1c2a";
    div.style.padding="8px 10px";
    div.style.borderRadius="8px";
    let content = `<strong style="color:#c084fc;">${msg.user}:</strong> ${msg.text || ""}`;
    if(msg.img) content+=`<br><img src="${msg.img}" style="max-width:100px;border-radius:6px;margin-top:5px;">`;
    div.innerHTML = content;
    chatList.appendChild(div);
  });
  chatList.scrollTop = chatList.scrollHeight;
}

sendBtn.addEventListener("click",async()=>{
  const text = chatInput.value.trim();
  const user = auth.currentUser;
  if(!user) return alert("Faça login para comentar!");
  if(!text && !chatFile.files[0]) return;

  let imgUrl=null;
  if(chatFile.files[0]){
    const fileRef = ref(storage, `chat/${id}_cap_${cap}/${Date.now()}_${chatFile.files[0].name}`);
    await uploadBytes(fileRef,chatFile.files[0]);
    imgUrl = await getDownloadURL(fileRef);
  }

  const docRef = doc(db, "chat", `${id}_cap_${cap}`);
  await setDoc(docRef, {
    messages: arrayUnion({
      user: user.displayName,
      text: text,
      img: imgUrl || null,
      timestamp: Date.now()
    })
  }, { merge:true });

  chatInput.value="";
  chatFile.value="";
  loadChat();
});

onAuthStateChanged(auth,()=>loadChat());
window.addEventListener("load",loadChat);

</script>

</body>
</html>
