<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader • Noctra</title>
<link rel="icon" href="noctra-core-bat-icon-transparent.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  background:#202020;
  color:white;
  font-family:Poppins,sans-serif;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top,rgba(168,85,247,.12),transparent 30%),
    linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);
  background-size:auto,46px 46px,46px 46px;
  z-index:-2;
}

header{
  position:relative;
  z-index:10;
  background:rgba(10,10,18,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header-content{
  max-width:1100px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#e9d5ff;
  text-decoration:none;
  font-weight:800;
}

.logo img{
  width:30px;
  height:30px;
  border-radius:50%;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  background:#ff3154;
  color:white;
  padding:10px 14px;
  border-radius:6px;
  font-family:Poppins,sans-serif;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.reader{
  width:100%;
  max-width:980px;
  margin:auto;
  padding:24px 10px 70px;
}

.reader-top{
  background:#141414;
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  padding:20px;
  margin-bottom:24px;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.reader-top h1{
  font-size:28px;
  margin-bottom:8px;
}

.reader-top p{
  color:#aaa;
  font-size:14px;
}

.pages{
  --reader-zoom:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  overflow:visible;
}

.page{
  width:100%;
  display:flex;
  justify-content:center;
  overflow:visible;
}

.page img{
  width:calc(100% * var(--reader-zoom));
  max-width:none;
  height:auto;
  display:block;
  object-fit:contain;
  background:#111;
  transform-origin:top center;
}

.bottom-actions{
  margin-top:35px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}
.top-reader-actions{
  margin:0 0 24px;
}
.loading,
.error{
  background:#141414;
  border:1px solid rgba(255,255,255,.08);
  padding:30px;
  border-radius:10px;
  text-align:center;
  color:#bbb;
}

.error{
  color:#fca5a5;
}

.float-tools{
  position:fixed;
  right:18px;
  bottom:18px;
  display:grid;
  gap:10px;
  z-index:20;
}

.float-btn{
  width:54px;
  height:54px;
  border:none;
  border-radius:50%;
  background:#ff3154;
  color:white;
  font-size:22px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(255,49,84,.35);
}

.float-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.zoom-controls{
  position:fixed;
  left:18px;
  bottom:18px;
  display:flex;
  gap:8px;
  z-index:20;
  background:rgba(20,20,20,.72);
  border:1px solid rgba(255,255,255,.10);
  border-radius:999px;
  padding:8px;
  backdrop-filter:blur(10px);
}

.zoom-btn{
  min-width:46px;
  height:42px;
  border:none;
  border-radius:999px;
  background:#ff3154;
  color:white;
  font-family:Poppins,sans-serif;
  font-weight:800;
  cursor:pointer;
}

.zoom-btn:hover{
  filter:brightness(1.08);
}

.zoom-reset{
  min-width:66px;
  background:#141414;
  border:1px solid rgba(255,255,255,.12);
}

.comments-shell{
  max-width:760px;
  margin:55px auto 0;
  padding-top:12px;
}

.chat-title{
  font-size:20px;
  color:#f5f0ff;
  margin-bottom:18px;
}

.login-comment{
  border-top:1px solid rgba(255,255,255,.28);
  padding:22px 0;
  text-align:center;
  color:#999;
}

.comment-box{
  display:flex;
  gap:10px;
  margin:14px 0 22px;
}

.comment-box textarea{
  width:100%;
  min-height:84px;
  resize:vertical;
  border:1px solid rgba(255,255,255,.10);
  background:#181818;
  color:white;
  border-radius:8px;
  padding:12px;
  font-family:Poppins,sans-serif;
  outline:none;
}

.comment-box textarea:focus{
  border-color:#00a88a;
}

.comment-title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.28);
  margin-bottom:30px;
}

.comment-title{
  padding:0 18px 8px 6px;
  border-bottom:2px solid #00a88a;
  color:#d8d8d8;
  font-size:14px;
  font-weight:800;
  letter-spacing:1px;
}

.sorts{
  display:flex;
  gap:16px;
  color:#aaa;
  font-size:13px;
}

.comment{
  display:grid;
  grid-template-columns:54px 1fr;
  gap:18px;
  margin-bottom:26px;
}

.reply-comment{
  margin-left:72px;
  grid-template-columns:42px 1fr;
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  object-fit:cover;
  background:#333;
  border:3px solid #111;
}

.reply-comment .avatar{
  width:42px;
  height:42px;
}

.comment-name{
  color:#00a88a;
  font-size:14px;
  margin-bottom:4px;
}

.comment-date{
  color:#aaa;
  font-size:11px;
  border-bottom:1px dashed #008f78;
  padding-bottom:8px;
  margin-bottom:12px;
}

.comment-text{
  color:#cfcfcf;
  line-height:1.6;
  font-size:15px;
  padding-right:10px;
  white-space:pre-wrap;
}

.reply-btn{
  margin-top:10px;
  background:none;
  border:none;
  color:#00a88a;
  cursor:pointer;
  font-family:Poppins,sans-serif;
}

.replying{
  background:#171717;
  border-left:3px solid #00a88a;
  border-radius:8px;
  padding:10px;
  margin-bottom:10px;
  color:#ccc;
  font-size:13px;
}

.cancel-reply{
  color:#fca5a5;
  cursor:pointer;
  display:inline-block;
  margin-top:6px;
}

.empty-chat{
  background:#141414;
  border:1px solid rgba(255,255,255,.08);
  padding:20px;
  border-radius:10px;
  color:#888;
  text-align:center;
}

.comment-composer{position:relative;margin:14px 0 24px;padding:12px;background:#111116;border:1px solid rgba(255,255,255,.09);border-radius:12px}
.comment-composer .comment-box{margin:0}
.comment-tools{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.comment-tool{height:36px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:#202027;color:#eee;font:700 12px Poppins,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 11px}
.comment-tool.icon-only{width:38px;padding:0}
.comment-tool svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.comment-tool:hover{background:#303039}
.comment-tools .send-comment{margin-left:auto;min-height:36px;padding:8px 16px}
.picker{display:none;position:absolute;left:12px;bottom:58px;z-index:5;width:min(390px,calc(100vw - 48px));overflow:hidden;background:#18181f;border:1px solid rgba(255,255,255,.12);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.picker.open{display:block}
.emoji-search{width:calc(100% - 18px);height:36px;margin:9px 9px 5px;padding:0 11px;border:1px solid #34343e;border-radius:8px;background:#101014;color:#eee;font:400 12px Poppins,sans-serif;outline:none}
.emoji-search:focus{border-color:#676774}
.emoji-tabs{display:flex;gap:2px;padding:4px 7px 7px;overflow-x:auto;border-bottom:1px solid #292930;scrollbar-width:none}
.emoji-tabs::-webkit-scrollbar{display:none}
.emoji-tab{flex:0 0 auto;width:34px;height:32px;border:0;border-radius:7px;background:transparent;color:#a6a6af;font-size:17px;cursor:pointer}
.emoji-tab:hover,.emoji-tab.active{background:#303039;color:#fff}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:244px;padding:8px;overflow-y:auto}
.emoji-grid button{width:100%;aspect-ratio:1;border:0;border-radius:7px;background:transparent;font-size:22px;cursor:pointer}
.emoji-grid button:hover{background:#303039}
.emoji-empty{grid-column:1/-1;padding:22px;color:#888;text-align:center;font-size:12px}
.upload-preview{display:none;align-items:center;gap:10px;margin-top:10px;padding:8px;background:#19191f;border-radius:8px;color:#bbb;font-size:12px}
.upload-preview.show{display:flex}
.upload-preview img{width:58px;height:58px;border-radius:7px;object-fit:cover}
.upload-preview button{margin-left:auto;background:none;border:0;color:#fca5a5;cursor:pointer}
.comment-media{display:block;max-width:min(100%,480px);max-height:520px;margin-top:10px;border-radius:10px;object-fit:contain;background:#09090b}
.comment-sticker{font-size:54px;line-height:1.1;margin-top:8px}
.comment-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.comment-action{border:1px solid rgba(255,255,255,.09);background:#1c1c22;color:#aaa;border-radius:999px;padding:5px 10px;font:600 11px Poppins,sans-serif;cursor:pointer}
.comment-action:hover,.comment-action.active{background:#303039;color:#fff}
.login-comment .btn{margin-top:12px}
.sending{opacity:.65;pointer-events:none}

/* Comentários Noctra */
.comments-shell{max-width:820px;margin:64px auto 0;padding:0 0 24px}
.comments-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:15px;border-bottom:1px solid #373740}
.chat-title{margin:0;color:#f2f2f5;font-size:22px;font-weight:800}
.comment-count-badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;margin-left:8px;padding:0 7px;border-radius:999px;background:#34343d;color:#fff;font-size:11px}
.comment-session{border:0;background:none;color:#bdbdc5;font:700 13px Poppins,sans-serif;cursor:pointer}
.comment-session:hover{color:#fff}
.comment-composer{margin:20px 0 24px;padding:12px;border:1px solid #303039;background:#101014;border-radius:14px}
.comment-composer .comment-box textarea{min-height:118px;padding:15px;border:1px solid #292931;background:#17171a;border-radius:10px;color:#eee;font-size:14px}
.comment-composer .comment-box textarea:focus{border-color:#555560;box-shadow:0 0 0 3px rgba(255,255,255,.035)}
.comment-tools{margin-top:8px}
.comment-tool{height:36px;border-color:#373741;background:#1b1b22;color:#ddd}
.comment-tools .send-comment{width:auto!important;margin-left:auto;padding:8px 18px;background:#e5e5ea;color:#101014}
.comment-tools .send-comment:hover{background:#fff}
.comment-title-row{display:flex;align-items:center;justify-content:flex-start;margin:0 0 28px;border-bottom:1px solid #292930}
.comment-title{display:none}
.sorts{display:flex;gap:22px;color:#85858e;font-size:12px;font-weight:700}
.sort-btn{position:relative;border:0;background:none;color:inherit;padding:12px 1px;font:700 12px Poppins,sans-serif;cursor:pointer}
.sort-btn.active{color:#f0f0f3}
.sort-btn.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#8c8c98}
.comment{grid-template-columns:50px minmax(0,1fr);gap:13px;margin-bottom:28px;padding-bottom:2px}
.comment>div{min-width:0}
.avatar{width:50px;height:50px;border:1px solid #34343d;border-radius:12px;background:#17171c}
.comment-name{display:inline-block;margin:0 8px 2px 0;color:#f1f1f3;font-size:14px;font-weight:800}
.comment-date{display:inline;color:#777780;border:0;padding:0;margin:0;font-size:11px}
.comment-text{margin-top:8px;padding:0;color:#d2d2d6;font-size:14px;line-height:1.65}
.comment-actions{gap:15px;margin-top:9px}
.comment-action{border:0;background:none;border-radius:0;padding:3px 0;color:#85858e;font-size:11px}
.comment-action:hover,.comment-action.active{background:none;color:#fff}
.reply-comment{margin-left:62px;grid-template-columns:40px minmax(0,1fr)}
.reply-comment .avatar{width:40px;height:40px;border-radius:10px}
.replying{border-left-color:#777782;background:#151519}
.empty-chat{border:1px dashed #303038;background:#0d0d10}
.login-comment{margin:20px 0;padding:26px;border:1px solid #303039;border-radius:14px;background:#101014}
.comment-media{border:1px solid #292930}
@media(max-width:700px){
  .comments-shell{margin:44px 12px 0}
  .comments-head{align-items:flex-start}
  .chat-title{font-size:19px}
  .comment-composer{padding:10px}
  .comment-composer .comment-box textarea{min-height:104px}
  .sorts{gap:15px;overflow-x:auto}
  .sort-btn{white-space:nowrap;font-size:11px}
  .comment{grid-template-columns:42px minmax(0,1fr);gap:10px}
  .avatar{width:42px;height:42px;border-radius:10px}
  .reply-comment{margin-left:28px;grid-template-columns:34px minmax(0,1fr)}
  .reply-comment .avatar{width:34px;height:34px}
  .picker{position:fixed;left:8px;right:8px;bottom:8px;width:auto}
  .emoji-grid{grid-template-columns:repeat(7,1fr);max-height:42vh}
}

@media(max-width:700px){
  .header-content{
    flex-direction:column;
  }

  .reader{
    padding:14px 0 80px;
  }

  .reader-top{
    margin:0 10px 18px;
    padding:16px;
  }

  .reader-top h1{
    font-size:22px;
  }

  .bottom-actions{
    padding:0 12px;
  }

  .btn{
    width:100%;
    text-align:center;
  }

  .comments-shell{
    margin:45px 10px 0;
  }

  .comment-box{
    flex-direction:column;
  }

  .comment{
    grid-template-columns:44px 1fr;
    gap:12px;
  }

  .reply-comment{
    margin-left:28px;
  }

  .avatar{
    width:44px;
    height:44px;
  }

  .float-tools{
    right:14px;
    bottom:14px;
  }

  .float-btn{
    width:48px;
    height:48px;
  }

  .zoom-controls{
    left:10px;
    bottom:14px;
  }

  .zoom-btn{
    min-width:42px;
    height:38px;
  }

  .zoom-reset{
    min-width:58px;
  }
}
  /* ===== MOBILE READER NOCTRA ===== */
@media(max-width:700px){
  header{
  position:relative !important;
}

.zoom-controls{
  display:none !important;
}

.float-tools{
  right:10px;
  bottom:70px;
}

.float-btn{
  width:44px;
  height:44px;
  font-size:18px;
  opacity:.85;
}

  header{
    position:sticky;
    top:0;
  }

  .header-content{
    flex-direction:column;
    padding:10px;
    gap:10px;
  }

  .logo{
    justify-content:center;
  }

  .top-actions{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  }

  .reader{
    padding:10px 0 90px;
  }

    margin:0 8px 14px;

  }

  }

  }

    width:100%;
    max-width:100%;
  }

    transform:scale(.88);

  }

    margin:35px 10px 0;
  }

  .comment-title-row{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }

  .sorts{

  }

/* Leitor alinhado ao tema escuro da Noctra */
html{scrollbar-width:thin;scrollbar-color:#4b4b52 #101012}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#101012}
::-webkit-scrollbar-thumb{background:#4b4b52;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#66666f}
body{background:#09090d}
body:before{background:radial-gradient(circle at top,rgba(92,92,110,.10),transparent 30%),linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:auto,46px 46px,46px 46px}
header{position:fixed!important;top:0;left:0;right:0;width:100%;background:rgba(9,9,13,.97)}
body{padding-top:78px}
.btn,.float-btn,.zoom-btn{background:#303039;box-shadow:none}
.btn:hover,.float-btn:hover,.zoom-btn:hover{background:#44444e}
.reader-top,.loading,.error,.empty-chat{background:#121217}
.zoom-controls{left:10px;bottom:10px;gap:4px;padding:4px;background:rgba(14,14,18,.84)}
.zoom-btn{min-width:32px;width:32px;height:32px;font-size:12px}
.zoom-reset{width:auto;min-width:48px;background:#19191f}
.float-tools{right:10px;bottom:10px;gap:6px}
.float-btn{width:36px;height:36px;font-size:16px}
.reader-auth{display:flex;align-items:center;gap:8px}
.reader-auth .btn{padding:9px 12px}

/* Menu universal Noctra */
body{background:#000!important}
body:before,body::before{background:#000!important}
body:after,body::after{background:none!important}
html{scrollbar-width:thin;scrollbar-color:#4c4c55 #101014}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#101014}
::-webkit-scrollbar-thumb{background:#4c4c55;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#656570}
.site-menu-wrap{position:relative;z-index:1200;flex:0 0 auto}
.site-menu-toggle{min-height:42px;border:1px solid rgba(255,255,255,.13);background:#17171e;color:#f4f4f5;border-radius:10px;padding:9px 13px;font:700 13px Poppins,sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.site-menu-toggle:hover,.site-menu-toggle[aria-expanded="true"]{background:#24242d;border-color:#5d5d69}
.site-menu-panel{position:absolute;right:0;top:calc(100% + 9px);width:220px;padding:8px;display:none;overflow:hidden;background:rgba(13,13,18,.98);border:1px solid rgba(255,255,255,.12);border-radius:13px;box-shadow:0 22px 55px rgba(0,0,0,.55);backdrop-filter:blur(16px)}
.site-menu-panel.open{display:grid}
.site-menu-panel a{color:#e7e7ea;text-decoration:none;padding:10px 12px;border-radius:8px;font-size:13px;white-space:nowrap}
.site-menu-panel a:hover{background:#272730;color:#fff}
header{position:relative!important;top:auto!important}
body{padding-top:0!important}
.reader-community{width:min(820px,calc(100% - 20px));margin:24px auto 70px;display:grid;gap:12px}
.reader-community-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:17px;border:1px solid #292930;border-radius:14px;background:#101014}
.reader-community-card span{color:#92929d;font-size:10px;font-weight:800;letter-spacing:1.3px}
.reader-community-card h2{margin:3px 0;font-size:18px}
.reader-community-card p{color:#999;font-size:12px}

@media(max-width:640px){
  .site-menu-toggle{min-height:38px;padding:8px 11px;font-size:12px}
  .site-menu-panel{position:fixed;top:74px;right:10px;left:10px;width:auto;max-height:none}
}
@media(max-width:700px){
  header{position:relative!important;top:auto}

<script>
(() => {
  const toggles = document.querySelectorAll(".site-menu-toggle");
  const panels = document.querySelectorAll(".site-menu-panel");
  toggles.forEach((toggle, index) => {
    const panel = panels[index];
    if (!panel) return;
    toggle.addEventListener("click", event => {
      event.stopPropagation();
      const open = !panel.classList.contains("open");
      panels.forEach(item => item.classList.remove("open"));
      toggles.forEach(item => item.setAttribute("aria-expanded", "false"));
      panel.classList.toggle("open", open);
      toggle.setAttribute("aria-expanded", String(open));
    });
  });
  document.addEventListener("click", () => {
    panels.forEach(item => item.classList.remove("open"));
    toggles.forEach(item => item.setAttribute("aria-expanded", "false"));
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") document.dispatchEvent(new Event("click"));
  });
})();
</script>

function salvarProgressoLeitura(status="lendo"){
  if(!obraId || !cap) return;

function aplicarZoom(){
  const pages = document.getElementById("pages");
  const reset = document.getElementById("zoomReset");
  const mobile = window.matchMedia("(max-width:700px)").matches;

  if(pages){
    pages.style.setProperty("--reader-zoom", mobile ? 1 : readerZoom);
  }

  if(reset){
    reset.textContent = `${Math.round(readerZoom * 100)}%`;
  }

  localStorage.setItem("noctra_reader_zoom", readerZoom);
}

function alterarZoom(delta){
  readerZoom = Math.min(1.8, Math.max(0.6, readerZoom + delta));
  readerZoom = Number(readerZoom.toFixed(2));
  aplicarZoom();
}

document.getElementById("zoomOut").onclick = ()=>{
  if(window.matchMedia("(max-width:700px)").matches) return;
  alterarZoom(-0.1);
};

document.getElementById("zoomIn").onclick = ()=>{
  if(window.matchMedia("(max-width:700px)").matches) return;
  alterarZoom(0.1);
};

document.getElementById("zoomReset").onclick = ()=>{
  if(window.matchMedia("(max-width:700px)").matches) return;
  readerZoom = 1;
  aplicarZoom();
};

document.addEventListener("keydown",event=>{
  if(!event.ctrlKey && !event.metaKey) return;

  if(event.key === "+" || event.key === "=" || event.code === "NumpadAdd"){
    event.preventDefault();
    alterarZoom(0.1);
  }

  if(event.key === "-" || event.key === "_" || event.code === "NumpadSubtract"){
    event.preventDefault();
    alterarZoom(-0.1);
  }

  if(event.key === "0" || event.code === "Numpad0"){
    event.preventDefault();
    readerZoom = 1;
    aplicarZoom();
  }
});

document.addEventListener("wheel",event=>{
  if(!event.ctrlKey && !event.metaKey) return;

  event.preventDefault();

  if(event.deltaY < 0){
    alterarZoom(0.1);
  }else{
    alterarZoom(-0.1);
  }
},{passive:false});

function esc(texto){
  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function date(valor){
  if(!valor) return "Agora";

  const data = valor.toDate ? valor.toDate() : new Date(valor);

  return Number.isNaN(data.getTime()) ? "Agora" : data.toLocaleString("pt-BR");
}

    <input class="emoji-search" id="emojiSearch" placeholder="Buscar emoji ou categoria...">

    tabs.innerHTML = Object.entries(categories).map(([key,category])=>
      `<button class="emoji-tab ${key===activeCategory?"active":""}" type="button" data-category="${key}" title="${category.label}">${category.icon}</button>`
    ).join("");

    const term = search.value.trim().toLocaleLowerCase("pt-BR");
    let items = categories[activeCategory].items;
    if(term){
      items = Object.values(categories)
        .filter(category=>category.label.toLocaleLowerCase("pt-BR").includes(term) || category.items.includes(term))
        .flatMap(category=>category.items);
    }

    grid.innerHTML = items.length
      ? [...new Set(items)].map(item=>`<button type="button" data-emoji="${item}" title="${item}">${item}</button>`).join("")
      : `<div class="emoji-empty">Nenhum emoji encontrado.</div>`;

    tabs.querySelectorAll("[data-category]").forEach(button=>{

        const emoji = button.dataset.emoji;
        const start = input.selectionStart;
        input.value = input.value.slice(0,start) + emoji + input.value.slice(input.selectionEnd);
        input.focus();
        input.selectionStart = input.selectionEnd = start + emoji.length;

        categories.recent.items = [emoji,...categories.recent.items.filter(item=>item!==emoji)].slice(0,32);

      };
    });
  }

    event.stopPropagation();

    }
  };

  emojiPicker.onclick = event=>event.stopPropagation();
  search.oninput = renderEmojiPanel;
  document.addEventListener("click",()=>emojiPicker.classList.remove("open"));
}

async function enviarMensagem(){
  if(!currentUser){
    await signInWithPopup(auth,provider);
    return;
  }

  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;

  const send = document.getElementById("sendBtn");
  try{
    send.classList.add("sending");
    send.textContent = "Enviando...";

    await addDoc(collection(db,"manhwas",obraId,"chapters",String(cap),"comments"),{
      user:currentUser.displayName || "Usuário",
      name:currentUser.displayName || "Usuário",
      uid:currentUser.uid,
      photo:currentUser.photoURL || "noctra-core-bat-icon-transparent.png",
      text,
      likes:[],
      dislikes:[],
      parentId:replyingTo ? replyingTo.id : null,
      createdAt:serverTimestamp()
    });

    input.value = "";
    replyingTo = null;
    atualizarReply();
  }catch(error){
    console.error(error);
    alert("Não foi possível enviar o comentário. Verifique sua conexão e tente novamente.");
  }finally{
    send.classList.remove("sending");
    send.textContent = "Enviar";
  }
}

async function reagir(commentId,type){
  if(!currentUser){
    await signInWithPopup(auth,provider);
    return;
  }

  const comment = currentComments.find(item=>item.id === commentId);
  if(!comment) return;
  const likes = Array.isArray(comment.likes) ? comment.likes : [];
  const dislikes = Array.isArray(comment.dislikes) ? comment.dislikes : [];
  const target = doc(db,"manhwas",obraId,"chapters",String(cap),"comments",commentId);

  if(type === "like"){
    await updateDoc(target,{
      likes:likes.includes(currentUser.uid) ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid),
      dislikes:arrayRemove(currentUser.uid)
    });
  }else{
    await updateDoc(target,{
      dislikes:dislikes.includes(currentUser.uid) ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid),
      likes:arrayRemove(currentUser.uid)
    });
  }
}

function carregarMensagens(){
  const list = document.getElementById("chatList");
  const count = document.getElementById("commentCount");

  if(unsubscribeComments){
    unsubscribeComments();
  }

  const q = query(
    collection(db,"manhwas",obraId,"chapters",String(cap),"comments"),
    orderBy("createdAt","desc")
  );

  unsubscribeComments = onSnapshot(q,snapshot=>{
    const all = [];

    snapshot.forEach(docSnap=>{
      all.push({
        id:docSnap.id,
        ...docSnap.data()
      });
    });
    currentComments = all;

    if(count){
      count.textContent = String(all.length);
    }

    if(!all.length){
      list.innerHTML = `<div class="empty-chat">Nenhum comentário ainda.</div>`;
      return;
    }

    const timestamp = item=>{
      if(!item.createdAt) return 0;
      if(typeof item.createdAt.toMillis === "function") return item.createdAt.toMillis();
      const value = item.createdAt.toDate ? item.createdAt.toDate() : new Date(item.createdAt);
      return Number.isNaN(value.getTime()) ? 0 : value.getTime();
    };

    const ordered = [...all].sort((a,b)=>{
      if(commentSort === "oldest") return timestamp(a)-timestamp(b);
      if(commentSort === "best"){
        const scoreA = (Array.isArray(a.likes)?a.likes.length:0) - (Array.isArray(a.dislikes)?a.dislikes.length:0);
        const scoreB = (Array.isArray(b.likes)?b.likes.length:0) - (Array.isArray(b.dislikes)?b.dislikes.length:0);
        return scoreB-scoreA || timestamp(b)-timestamp(a);
      }
      return timestamp(b)-timestamp(a);
    });

    const parents = ordered.filter(item=>!item.parentId);
    const replies = ordered.filter(item=>item.parentId);
    
    function item(comentario,resposta=false){
      const likes = Array.isArray(comentario.likes) ? comentario.likes : [];
      const dislikes = Array.isArray(comentario.dislikes) ? comentario.dislikes : [];
      const liked = currentUser && likes.includes(currentUser.uid);
      const disliked = currentUser && dislikes.includes(currentUser.uid);
      return `
        <article class="comment ${resposta ? "reply-comment" : ""}">
          <img class="avatar" src="${comentario.photo || "noctra-core-bat-icon-transparent.png"}">

          <div>
            <div class="comment-name">${esc(comentario.name || comentario.user || "Usuário")}</div>
            <div class="comment-date">${date(comentario.createdAt)}</div>
            <div class="comment-text">${esc(comentario.text)}</div>
            ${comentario.imageUrl ? `<img class="comment-media" src="${esc(comentario.imageUrl)}" alt="Imagem enviada no comentário" loading="lazy">` : ""}
            ${comentario.sticker ? `<div class="comment-sticker">${esc(comentario.sticker)}</div>` : ""}
            <div class="comment-actions">
              <button class="comment-action ${liked ? "active" : ""}" data-like="${comentario.id}">Curtir ${likes.length}</button>
              <button class="comment-action ${disliked ? "active" : ""}" data-dislike="${comentario.id}">Não curtir ${dislikes.length}</button>
              <button class="comment-action" data-reply="${comentario.id}">Responder</button>
            </div>
          </div>
        </article>
      `;
    }

    list.innerHTML = parents.map(parent=>{
      const filhos = replies
        .filter(reply=>reply.parentId === parent.id)
        .reverse()
        .map(reply=>item(reply,true))
        .join("");

      return item(parent,false) + filhos;
    }).join("");

    document.querySelectorAll("[data-reply]").forEach(btn=>{
      btn.onclick = ()=>{
        if(!currentUser){
          signInWithPopup(auth,provider);
          return;
        }
        const comentario = all.find(item=>item.id === btn.dataset.reply);

        replyingTo = {
          id:comentario.id,
          name:comentario.name || comentario.user || "Usuário",
          text:comentario.text || ""
        };

        atualizarReply();

        document.getElementById("chatInput")?.focus();

        scrollTo({
          top:document.body.scrollHeight,
          behavior:"smooth"
        });
      };
    });

    document.querySelectorAll("[data-like]").forEach(btn=>{
      btn.onclick = ()=>reagir(btn.dataset.like,"like").catch(error=>{
        console.error(error);
        alert("Não foi possível registrar a curtida.");
      });
    });

    document.querySelectorAll("[data-dislike]").forEach(btn=>{
      btn.onclick = ()=>reagir(btn.dataset.dislike,"dislike").catch(error=>{
        console.error(error);
        alert("Não foi possível registrar a reação.");
      });
    });

  },error=>{
    console.error(error);

    list.innerHTML = `
      <div class="empty-chat">
        Não foi possível carregar comentários. Verifique as regras do Firestore.
      </div>
    `;
  });
}

onAuthStateChanged(auth,user=>{
  currentUser = user;
  const isAdmin = Boolean(user && ADMIN_UIDS.includes(user.uid));
  document.querySelectorAll(".menu-admin-link").forEach(link=>link.style.display=isAdmin?"block":"none");
  readerAuth.innerHTML = user
    ? `<span class="user-label">${esc(user.displayName || "Usuário")}</span><button class="btn" id="readerLogout">Sair</button>`
    : `<button class="btn" id="readerLogin">Entrar</button>`;
  const login = document.getElementById("readerLogin");
  const logout = document.getElementById("readerLogout");
  if(login) login.onclick = ()=>signInWithPopup(auth,provider);
  if(logout) logout.onclick = ()=>signOut(auth);
  carregar();
});
  window.addEventListener("scroll", ()=>{
  const chegouPertoDoFim =
    window.innerHeight + window.scrollY >= document.body.scrollHeight - 0.45;

  if(chegouPertoDoFim){
    salvarProgressoLeitura("lido");
  }
});
