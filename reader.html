<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>
<link rel="icon" href="noctra-logo.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#0b0b12;
  color:white;
  font-family:'Poppins', sans-serif;
}

.topbar{
  position:fixed;
  top:0;
  width:100%;
  background:#111a2e;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  z-index:1000;
  border-bottom:1px solid #1f1f2e;
}

.topbar #info{
  font-weight:600;
}

.btn{
  background:#a855f7;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  transition:.2s;
  color:white;
}

.btn:hover{transform:scale(1.05);}

.reader{
  margin-top:60px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

.reader img{
  width:100%;
  max-width:800px;
  border-radius:10px;
}

/* NAVIGATION */
.nav{
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:15px;
}

/* CHAT */
.chat-section{
  margin:30px auto;
  padding:15px;
  background:#14141c;
  border-radius:10px;
  max-width:800px;
}

.chat-section h3{
  margin-bottom:10px;
}

.chat-box{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.chat-box button{
  padding:6px 12px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  transition:.2s;
}

.chat-box button.gostei{background:#22c55e;color:white;}
.chat-box button.naogostei{background:#ef4444;color:white;}

#chatLog div{margin-bottom:6px;}
</style>
</head>

<body>

<div class="topbar">
  <div id="info"></div>
  <div>
    <span class="btn" onclick="voltar()">Voltar</span>
  </div>
</div>

<div class="reader" id="reader"></div>

<div class="nav">
  <div class="btn" onclick="prevCap()">◀ Anterior</div>
  <div class="btn" onclick="nextCap()">Próximo ▶</div>
</div>

<div class="chat-section">
  <h3>Deixe sua opinião</h3>
  <div class="chat-box">
    <button class="gostei" onclick="opinar('gostei')">Gostei 👍</button>
    <button class="naogostei" onclick="opinar('naogostei')">Não Gostei 👎</button>
  </div>
  <div id="chatLog"></div>
</div>

<script type="module">
// 🔥 FIREBASE MESMO DO INDEX
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap"));

const obras = {
  solo:{
    nome:"Solo Leveling",
    caps:{
      1:["https://i.imgur.com/8Km9tLL.jpg","https://i.imgur.com/8Km9tLL.jpg"],
      2:["https://i.imgur.com/8Km9tLL.jpg","https://i.imgur.com/8Km9tLL.jpg"],
      3:["https://i.imgur.com/8Km9tLL.jpg"],
      4:["https://i.imgur.com/8Km9tLL.jpg"],
      5:["https://i.imgur.com/8Km9tLL.jpg"],
      6:["https://i.imgur.com/8Km9tLL.jpg"],
      7:["https://i.imgur.com/8Km9tLL.jpg"],
      8:["https://i.imgur.com/8Km9tLL.jpg"],
      9:["https://i.imgur.com/8Km9tLL.jpg"],
      10:["https://i.imgur.com/8Km9tLL.jpg"]
    }
  },
  nano:{
    nome:"Nano Machine",
    caps:{
      1:["https://i.imgur.com/qIufhof.png","https://i.imgur.com/qIufhof.png"],
      2:["https://i.imgur.com/qIufhof.png"]
    }
  }
};

if(!id || !cap || !obras[id] || !obras[id].caps[cap]){
  alert("Erro ao abrir capítulo");
  location.href="manhwas.html";
}

const obra = obras[id];
document.getElementById("info").innerText = `${obra.nome} • Capítulo ${cap}`;

const reader = document.getElementById("reader");
reader.innerHTML="";

// RENDER PÁGINAS
obra.caps[cap].forEach(src=>{
  let img = document.createElement("img");
  img.src = src;
  reader.appendChild(img);
});

// SALVAR PROGRESSO
onAuthStateChanged(auth, async user=>{
  if(!user) return;
  await setDoc(doc(db,"progress",user.uid),{
    [id]:{cap:cap}
  },{merge:true});
});

// NAVIGATION
window.voltar = ()=>{ location.href=`manhwas.html?id=${id}`; }
window.nextCap = ()=>{
  const next = cap+1;
  if(obra.caps[next]) location.href=`reader.html?id=${id}&cap=${next}`;
  else alert("Último capítulo");
}
window.prevCap = ()=>{
  const prev = cap-1;
  if(obra.caps[prev]) location.href=`reader.html?id=${id}&cap=${prev}`;
  else alert("Primeiro capítulo");
}

// CHAT
function opinar(tipo){
  const chatLog = document.getElementById("chatLog");
  chatLog.innerHTML += `<div>${tipo=="gostei"?"👍 Gostei":"👎 Não Gostei"}</div>`;
}
</script>
</body>
</html>
