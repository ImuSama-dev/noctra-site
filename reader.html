<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#000;
  color:white;
}

/* TOPBAR */
.topbar{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(10,10,20,0.9);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  z-index:1000;
  border-bottom:1px solid #1f1f2e;
}

.topbar button{
  background:#a855f7;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

.title{
  font-size:14px;
  color:#ccc;
}

/* PROGRESS BAR */
.progress-bar{
  position:fixed;
  top:50px;
  left:0;
  height:3px;
  background:#a855f7;
  width:0%;
  z-index:1000;
}

/* READER */
.reader{
  margin-top:60px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.reader img{
  width:100%;
  max-width:900px;
  margin-bottom:10px;
  border-radius:6px;
}

/* CONTROLES */
.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}

.controls button{
  padding:10px 20px;
  border:none;
  background:#a855f7;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

/* BOTÃO TOPO */
.top-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#a855f7;
  padding:10px;
  border-radius:50%;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="voltar()">← Voltar</button>
  <div class="title" id="titulo"></div>
</div>

<div class="progress-bar" id="bar"></div>

<div class="reader" id="reader"></div>

<div class="controls">
  <button onclick="prevCap()">← Anterior</button>
  <button onclick="nextCap()">Próximo →</button>
</div>

<div class="top-btn" onclick="scrollToTop()">↑</div>

<script type="module">

// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC...",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

// PARAMS
const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap")) || 1;

// DADOS
const obras = {
  solo:{ nome:"Solo Leveling", caps:10 },
  nano:{ nome:"Nano Machine", caps:8 }
};

const dados = obras[id];

document.getElementById("titulo").innerText = `${dados.nome} • Capítulo ${cap}`;

// IMAGENS
const paginas = [
  "https://i.imgur.com/8Km9tLL.jpg",
  "https://i.imgur.com/qIufhof.png",
  "https://i.imgur.com/4AiXzf8.jpeg"
];

const reader = document.getElementById("reader");

paginas.forEach(src=>{
  let img = document.createElement("img");
  img.src = src;
  reader.appendChild(img);
});

// 🔥 RESTAURAR POSIÇÃO
onAuthStateChanged(auth, async user=>{
  if(!user) return;

  const snap = await getDoc(doc(db,"progress",user.uid));
  if(!snap.exists()) return;

  const prog = snap.data()[id];
  if(prog && prog.cap == cap){
    window.scrollTo(0, prog.scroll || 0);
  }
});

// 🔥 SALVAR PROGRESSO (CAP + SCROLL)
window.addEventListener("scroll", async ()=>{
  const scroll = window.scrollY;
  const height = document.body.scrollHeight - window.innerHeight;
  const percent = (scroll / height) * 100;

  document.getElementById("bar").style.width = percent + "%";

  const user = auth.currentUser;
  if(!user) return;

  await setDoc(doc(db,"progress",user.uid),{
    [id]: {
      cap: cap,
      scroll: scroll
    }
  },{merge:true});
});

// BOTÕES
window.voltar = ()=>history.back();

window.nextCap = ()=>{
  if(cap < dados.caps){
    location.href = `reader.html?id=${id}&cap=${cap+1}`;
  } else {
    alert("Último capítulo");
  }
}

window.prevCap = ()=>{
  if(cap > 1){
    location.href = `reader.html?id=${id}&cap=${cap-1}`;
  }
}

window.scrollToTop = ()=>{
  window.scrollTo({top:0, behavior:'smooth'});
}

</script>

</body>
</html>
