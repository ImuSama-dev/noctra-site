<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<link rel="icon" href="./noctra-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0b0b12;
  color:white;
}

.topbar{
  position:fixed; top:0; width:100%; background:rgba(15,15,25,0.95);
  backdrop-filter:blur(10px); padding:12px 20px; display:flex; justify-content:space-between; align-items:center;
  z-index:1000; border-bottom:1px solid #1f1f2e;
}
.topbar .btn{
  background:#a855f7; color:white; padding:6px 12px; border-radius:6px; cursor:pointer; transition:.2s;
}
.topbar .btn:hover{background:#9333ea;}

#info{font-weight:600;}

.reader{
  margin-top:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  padding-bottom:100px;
}

.reader img{
  width:100%;
  max-width:800px;
  border-radius:8px;
  box-shadow:0 0 15px #000;
}

.nav{
  position:fixed; bottom:10px; width:100%; display:flex; justify-content:center; gap:15px; z-index:1000;
}

.chat-box{
  max-width:800px;
  margin:30px auto;
  background:#14141c;
  padding:15px;
  border-radius:10px;
}
.chat-box h3{margin-bottom:10px;}
.chat-messages{max-height:200px;overflow-y:auto;margin-bottom:10px;}
.chat-messages div{padding:5px;background:#1c1c2a;margin-bottom:5px;border-radius:6px;}
.chat-input{display:flex;gap:10px;}
.chat-input input{flex:1;padding:8px;border-radius:6px;border:none;background:#12121a;color:white;}
.chat-input button{padding:6px 12px;border-radius:6px;background:#a855f7;color:white;border:none;cursor:pointer;}
.chat-input button:hover{background:#9333ea;}
</style>
</head>

<body>

<div class="topbar">
  <div id="info"></div>
  <div>
    <span class="btn" onclick="voltar()">Voltar</span>
  </div>
</div>

<div class="reader" id="reader"></div>

<div class="nav">
  <span class="btn" onclick="prevCap()">◀ Anterior</span>
  <span class="btn" onclick="nextCap()">Próximo ▶</span>
</div>

<div class="chat-box">
  <h3>Comentários</h3>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="Comente sobre este capítulo...">
    <button onclick="enviarComentario()">Enviar</button>
  </div>
</div>

<script type="module">
// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:14bd38c377336619e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// PEGAR PARAMS
const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap"));
if(!id || !cap){alert("Erro ao abrir capítulo"); location.href="index.html";}

// MANHWAS SIMULADOS
const obras = {
  solo:{
    nome:"Solo Leveling",
    caps:{
      1:["https://i.imgur.com/8Km9tLL.jpg","https://i.imgur.com/qIufhof.png"],
      2:["https://i.imgur.com/4AiXzf8.jpeg"]
    }
  },
  nano:{
    nome:"Nano Machine",
    caps:{
      1:["https://i.imgur.com/qIufhof.png"]
    }
  }
};

const obra = obras[id];
if(!obra || !obra.caps[cap]){alert("Capítulo não encontrado"); location.href="manhwas.html?id="+id;}
document.getElementById("info").innerText = obra.nome+" • Capítulo "+cap;

// RENDER IMAGENS
const reader = document.getElementById("reader");
function renderImages(){
  reader.innerHTML="";
  obra.caps[cap].forEach(src=>{
    const img = document.createElement("img");
    img.src = src;
    reader.appendChild(img);
  });
}
renderImages();

// SALVAR PROGRESSO
onAuthStateChanged(auth, async user=>{
  if(!user) return;
  await setDoc(doc(db,"progress",user.uid),{[id]:{cap:cap}},{merge:true});
});

// NAVEGAÇÃO CAPÍTULOS
window.voltar = () => location.href="manhwas.html?id="+id;
window.nextCap = () => {
  const capsKeys = Object.keys(obra.caps).map(Number);
  let idx = capsKeys.indexOf(cap);
  if(idx < capsKeys.length-1){
    cap = capsKeys[idx+1];
    location.href=`reader.html?id=${id}&cap=${cap}`;
  } else alert("Último capítulo!");
};
window.prevCap = () => {
  const capsKeys = Object.keys(obra.caps).map(Number);
  let idx = capsKeys.indexOf(cap);
  if(idx > 0){
    cap = capsKeys[idx-1];
    location.href=`reader.html?id=${id}&cap=${cap}`;
  } else alert("Primeiro capítulo!");
};

// CHAT
const messagesDiv = document.getElementById("messages");
let currentUser = null;
onAuthStateChanged(auth,user=>{currentUser=user;});

function carregarChat(){
  const q = query(collection(db,"chat",id,"cap"+cap),orderBy("time"));
  onSnapshot(q,snap=>{
    messagesDiv.innerHTML="";
    snap.forEach(doc=>{
      const d = doc.data();
      const div = document.createElement("div");
      div.innerText = d.user+": "+d.text;
      messagesDiv.appendChild(div);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}
carregarChat();

window.enviarComentario = async function(){
  if(!currentUser){alert("Faça login para comentar");return;}
  const text = document.getElementById("chatInput").value;
  if(!text) return;
  await addDoc(collection(db,"chat",id,"cap"+cap),{
    user: currentUser.displayName,
    text: text,
    time: Date.now()
  });
  document.getElementById("chatInput").value="";
};
</script>

</body>
</html>
