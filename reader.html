<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<link rel="icon" href="./noctra-logo.png">

<style>
body{
  margin:0;
  background:#0b0b12;
  color:white;
  text-align:center;
  font-family:Arial;
}

.topbar{
  position:fixed;
  top:0;
  width:100%;
  background:#111;
  padding:10px;
  display:flex;
  justify-content:space-between;
  z-index:1000;
}

.btn{
  background:#a855f7;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

.reader{
  margin-top:60px;
}

.reader img{
  width:100%;
  max-width:800px;
  margin-bottom:10px;
}

.nav{
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div id="info"></div>
  <div>
    <span class="btn" onclick="voltar()">Voltar</span>
  </div>
</div>

<div class="reader" id="reader"></div>

<div class="nav">
  <div class="btn" onclick="prevCap()">◀ Anterior</div>
  <div class="btn" onclick="nextCap()">Próximo ▶</div>
</div>

<script type="module">

// 🔥 FIREBASE (MESMO DO INDEX)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjfFjE0",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core",
  storageBucket: "noctra-core.firebasestorage.app",
  messagingSenderId: "506534658543",
  appId: "1:506534658543:web:6cd65bc3a0267878e2f61a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔥 PEGAR PARAMS
const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap"));

if(!id || !cap){
  alert("Erro ao abrir capítulo");
  location.href="index.html";
}

// 🔥 BANCO DE IMAGENS (SIMULAÇÃO)
const obras = {
  solo:{
    nome:"Solo Leveling",
    caps:{
      1:[
        "https://i.imgur.com/8Km9tLL.jpg",
        "https://i.imgur.com/8Km9tLL.jpg",
        "https://i.imgur.com/8Km9tLL.jpg"
      ],
      2:[
        "https://i.imgur.com/8Km9tLL.jpg",
        "https://i.imgur.com/8Km9tLL.jpg"
      ]
    }
  },
  nano:{
    nome:"Nano Machine",
    caps:{
      1:[
        "https://i.imgur.com/qIufhof.png",
        "https://i.imgur.com/qIufhof.png"
      ]
    }
  }
};

const obra = obras[id];

if(!obra || !obra.caps[cap]){
  alert("Capítulo não encontrado");
  location.href="manhwas.html?id="+id;
}

// 🔥 INFO
document.getElementById("info").innerText =
  obra.nome + " • Capítulo " + cap;

// 🔥 RENDER
const reader = document.getElementById("reader");

obra.caps[cap].forEach(src=>{
  let img = document.createElement("img");
  img.src = src;
  reader.appendChild(img);
});

// 🔥 SALVAR PROGRESSO
onAuthStateChanged(auth, async user=>{
  if(!user) return;

  await setDoc(doc(db,"progress",user.uid), {
    [id]: { cap: cap }
  }, { merge:true });
});

// 🔥 BOTÕES
window.voltar = () => {
  location.href = "manhwas.html?id="+id;
};

window.nextCap = () => {
  cap++;
  location.href = `reader.html?id=${id}&cap=${cap}`;
};

window.prevCap = () => {
  if(cap > 1){
    cap--;
    location.href = `reader.html?id=${id}&cap=${cap}`;
  }
};

</script>

</body>
</html>
