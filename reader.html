<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#000;
  color:white;
}

/* TOPBAR */
.topbar{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(10,10,20,0.9);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  z-index:1000;
  border-bottom:1px solid #1f1f2e;
}

.topbar button{
  background:#a855f7;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

.title{
  font-size:14px;
  color:#ccc;
}

/* READER */
.reader{
  margin-top:60px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.reader img{
  width:100%;
  max-width:900px;
  margin-bottom:10px;
  border-radius:6px;
}

/* CONTROLES */
.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}

.controls button{
  padding:10px 20px;
  border:none;
  background:#a855f7;
  border-radius:8px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="voltar()">← Voltar</button>
  <div class="title" id="titulo"></div>
</div>

<div class="reader" id="reader"></div>

<div class="controls">
  <button onclick="prevCap()">← Anterior</button>
  <button onclick="nextCap()">Próximo →</button>
</div>

<script type="module">

// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC...",
  authDomain: "noctra-core.firebaseapp.com",
  projectId: "noctra-core"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

// PEGAR PARAMS
const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap")) || 1;

// DADOS (MESMO PADRÃO)
const obras = {
  solo:{
    nome:"Solo Leveling",
    caps:10
  },
  nano:{
    nome:"Nano Machine",
    caps:8
  }
};

const dados = obras[id];

document.getElementById("titulo").innerText = `${dados.nome} • Capítulo ${cap}`;

// 🔥 LISTA DE IMAGENS (SIMULAÇÃO)
const paginas = [
  "https://i.imgur.com/8Km9tLL.jpg",
  "https://i.imgur.com/qIufhof.png",
  "https://i.imgur.com/4AiXzf8.jpeg"
];

// CARREGAR
const reader = document.getElementById("reader");

paginas.forEach(src=>{
  let img = document.createElement("img");
  img.src = src;
  reader.appendChild(img);
});

// 🔥 SALVAR PROGRESSO AUTOMÁTICO
onAuthStateChanged(auth, user=>{
  if(!user) return;

  setDoc(doc(db,"progress",user.uid),{
    [id]: cap
  },{merge:true});
});

// BOTÕES
window.voltar = function(){
  history.back();
}

window.nextCap = function(){
  if(cap < dados.caps){
    location.href = `reader.html?id=${id}&cap=${cap+1}`;
  } else {
    alert("Último capítulo");
  }
}

window.prevCap = function(){
  if(cap > 1){
    location.href = `reader.html?id=${id}&cap=${cap-1}`;
  }
}

</script>

</body>
</html>
