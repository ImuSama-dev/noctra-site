<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor • Noctra</title>

<link rel="icon" href="./noctra-logo.png">

<style>
body{
  margin:0;
  background:#0b0b12;
  color:white;
  font-family:'Poppins',sans-serif;
}

.topbar{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(15,15,25,0.95);
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
  border-bottom:1px solid #1f1f2e;
}

.topbar span, .topbar div{
  font-size:14px;
}

.btn{
  background:#a855f7;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  color:white;
  transition:.2s;
}

.btn:hover{
  background:#9333ea;
}

.reader{
  margin-top:60px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding-bottom:50px;
}

.reader img{
  width:100%;
  max-width:800px;
  border-radius:6px;
}

.nav{
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

/* CHAT */
#chatBox{
  max-width:800px;
  width:90%;
  margin:30px auto 50px;
  border:1px solid #333;
  border-radius:10px;
  padding:15px;
  background:#14141c;
}

#chatBox h3{
  margin-bottom:10px;
  font-size:16px;
  color:#a855f7;
}

#chatMessages{
  max-height:200px;
  overflow-y:auto;
  margin-bottom:10px;
}

#chatMessages div{
  padding:6px;
  border-bottom:1px solid #222;
  font-size:14px;
}

#chatInput{
  width:100%;
  padding:8px;
  border-radius:6px;
  border:none;
  background:#12121a;
  color:white;
}
</style>
</head>

<body>

<div class="topbar">
  <div id="info"></div>
  <div>
    <span class="btn" onclick="voltar()">Voltar</span>
  </div>
</div>

<div class="reader" id="reader"></div>

<div class="nav">
  <div class="btn" onclick="prevCap()">◀ Anterior</div>
  <div class="btn" onclick="nextCap()">Próximo ▶</div>
</div>

<div id="chatBox">
  <h3>Comentários</h3>
  <div id="chatMessages"></div>
  <input type="text" id="chatInput" placeholder="Escreva um comentário..." onkeydown="if(event.key==='Enter') sendComment()">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC_2cJLezTKJy4WqUh-2DBVEHdLnjiFjE0",
    authDomain: "noctra-core.firebaseapp.com",
    projectId: "noctra-core",
    storageBucket: "noctra-core.firebasestorage.app",
    messagingSenderId: "506534658543",
    appId: "1:506534658543:web:14bd38c377336619e2f61a"
  };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// PEGAR PARAMS
const params = new URLSearchParams(location.search);
const id = params.get("id");
let cap = parseInt(params.get("cap"));

if(!id || !cap){
  alert("Erro ao abrir capítulo");
  location.href="index.html";
}

// BANCO DE IMAGENS SIMULADO
const obras = {
  solo:{nome:"Solo Leveling",caps:{1:["https://i.imgur.com/8Km9tLL.jpg", "https://i.imgur.com/qIufhof.png"],2:["https://i.imgur.com/8Km9tLL.jpg"]}},
  nano:{nome:"Nano Machine",caps:{1:["https://i.imgur.com/qIufhof.png"],2:["https://i.imgur.com/qIufhof.png"]}}
};

const obra = obras[id];

if(!obra || !obra.caps[cap]){
  alert("Capítulo não encontrado");
  location.href="manhwas.html?id="+id;
}

// INFO
document.getElementById("info").innerText = obra.nome + " • Capítulo " + cap;

// RENDER IMAGENS
const reader = document.getElementById("reader");
function renderImages(){
  reader.innerHTML = "";
  obra.caps[cap].forEach(src=>{
    let img=document.createElement("img");
    img.src=src;
    reader.appendChild(img);
  });
}
renderImages();

// SALVAR PROGRESSO
onAuthStateChanged(auth, async user=>{
  if(!user) return;
  await setDoc(doc(db,"progress",user.uid),{[id]:{cap:cap}},{merge:true});
});

// BOTÕES
window.voltar = () => location.href = "manhwas.html?id="+id;

window.nextCap = () => {
  const maxCap = Object.keys(obra.caps).length;
  if(cap >= maxCap){alert("Último capítulo!"); return;}
  cap++;
  location.href = `reader.html?id=${id}&cap=${cap}`;
};

window.prevCap = () => {
  if(cap <= 1){alert("Primeiro capítulo!"); return;}
  cap--;
  location.href = `reader.html?id=${id}&cap=${cap}`;
};

// CHAT
const chatInput = document.getElementById("chatInput");
const chatMessages = document.getElementById("chatMessages");

function loadComments(){
  const chatRef = collection(db,"comments",id,"cap"+cap);
  const q = query(chatRef, orderBy("timestamp","asc"));
  onSnapshot(q,snap=>{
    chatMessages.innerHTML="";
    snap.forEach(doc=>{
      const div = document.createElement("div");
      div.textContent = doc.data().user+": "+doc.data().message;
      chatMessages.appendChild(div);
    });
  });
}
loadComments();

window.sendComment = async ()=>{
  const user = auth.currentUser;
  if(!user){alert("Faça login para comentar"); return;}
  const msg = chatInput.value.trim();
  if(!msg) return;
  await addDoc(collection(db,"comments",id,"cap"+cap),{
    user: user.displayName,
    message: msg,
    timestamp: new Date()
  });
  chatInput.value="";
};
</script>

</body>
</html>
