      <img src="${user.photoURL||"noctra-logo.png"}" width="42" height="42" style="border-radius:50%;object-fit:cover;border:1px solid rgba(244,114,182,.5);">
      <div>
        <strong class="user-name">${esc(user.displayName||"Usuário")}${adminTag}</strong>
        <div style="font-size:11px;color:#aaa;">Bem-vindo de volta</div>
      </div>
      <button onclick="logout()">Sair</button>
    `;

    adminBtn.style.display=adm?"flex":"none";
  }else{
    mobileAuthBtn.style.display="flex";
mobileAuthText.textContent="Entrar";
mobileAuthBtn.onclick=(e)=>{
  e.preventDefault();
  login();
};
    userBox.innerHTML=`<button onclick="login()">Entrar</button>`;
    adminBtn.style.display="none";
  }
}

window.login=()=>signInWithPopup(auth,provider);
window.logout=()=>signOut(auth);

async function carregarFavoritos(){
  favoritos={};
  if(!currentUser) return;

  const snap=await getDoc(doc(db,"users",currentUser.uid));
  if(snap.exists()) favoritos=snap.data()||{};
}

async function carregarObra(id){
  const snap=await getDoc(doc(db,"manhwas",id));
  if(!snap.exists()) return null;
  return {id:snap.id,...snap.data()};
}

function obraVisivel(obra){
  return isAdmin()||(obra.publicado!==false&&obra.published!==false);
}

async function ratingData(id){
  try{
    const snap=await getDocs(collection(db,"manhwas",id,"ratings"));
    let soma=0;
    let votoUsuario=0;

    snap.forEach(item=>{
      const valor=Number(item.data().value||0);
      soma+=valor;
      if(currentUser&&item.id===currentUser.uid) votoUsuario=valor;
    });

    const total=snap.size;
    const media=total?soma/total:0;
    return {media,total,votoUsuario};
  }catch(error){
    return {media:0,total:0,votoUsuario:0};
  }
}

async function contarComentarios(id){
  try{
    const snap=await getDocs(collection(db,"manhwas",id,"comments"));
    return snap.size;
  }catch(error){
    return 0;
  }
}

async function contarFavoritosObra(id){
  try{
    const snap=await getDocs(collection(db,"manhwas",id,"favorites"));
    return snap.size;
  }catch(error){
    return 0;
  }
}

function starsHtml(votoUsuario){
  let html="";
  for(let i=1;i<=5;i++){
    html+=`
      <button class="star ${i<=votoUsuario?"on":""}" data-rate="${i}" title="Votar ${i} estrela(s)">
        &#9733;
      </button>
    `;
  }
  return html;
}

async function votar(id,value){
  if(!currentUser){
    alert("Faça login para votar.");
    await signInWithPopup(auth,provider);
    return;
  }

  try{
    await setDoc(doc(db,"manhwas",id,"ratings",currentUser.uid),{
      value:value,
      uid:currentUser.uid,
      name:currentUser.displayName||"Usuário",
      updatedAt:serverTimestamp()
    },{merge:true});

    visibleCaps=8;
    await renderDetalhe(id);
  }catch(error){
    console.error(error);
    alert("Não foi possível registrar seu voto.");
  }
}

function atualizarReply(){
  const box=document.getElementById("replyingBox");
  if(!box) return;

  if(!replyingTo){
    box.innerHTML="";
    return;
  }

  box.innerHTML=`
    <div class="replying">
      Respondendo ${esc(replyingTo.name)}:
      <br>
      "${esc(replyingTo.text)}"
      <br>
      <span class="cancel-reply" id="cancelReply">Cancelar resposta</span>
    </div>
  `;

  document.getElementById("cancelReply").onclick=()=>{
    replyingTo=null;
    atualizarReply();
  };
}

async function enviarComentario(id){
  if(!currentUser) return;

  const textarea=document.getElementById("commentText");
  const text=textarea.value.trim();

  if(!text) return;

  try{
    await addDoc(collection(db,"manhwas",id,"comments"),{
      text:text,
      uid:currentUser.uid,
      name:currentUser.displayName||"Usuário",
      photo:currentUser.photoURL||"noctra-logo.png",
      parentId:replyingTo?replyingTo.id:null,
      createdAt:serverTimestamp()
    });

    textarea.value="";
    replyingTo=null;
    atualizarReply();

    await carregarComentarios(id);
  }catch(error){
    console.error(error);
    alert("Não foi possível enviar o comentário.");
  }
}

async function carregarComentarios(id){
  const list=document.getElementById("commentsList");
  if(!list) return;

  list.innerHTML=`<div class="empty">Carregando comentários...</div>`;

  try{
    const snap=await getDocs(query(collection(db,"manhwas",id,"comments"),orderBy("createdAt","desc")));
    const todos=[];

    snap.forEach(item=>{
      todos.push({
        id:item.id,
        ...item.data()
      });
    });

    if(todos.length===0){
      list.innerHTML=`<div class="empty">Nenhum comentário ainda.</div>`;
      return;
    }

    const principais=todos.filter(item=>!item.parentId);
    const respostas=todos.filter(item=>item.parentId);

    function itemComentario(comentario,resposta=false){
      return `
        <article class="comment ${resposta?"reply-comment":""}">
          <img class="avatar" src="${comentario.photo||"noctra-logo.png"}" alt="${esc(comentario.name||"Usuário")}">
          <div>
            <div class="comment-name">${esc(comentario.name||"Usuário")}</div>
            <div class="comment-date">${dataCurta(comentario.createdAt)||"Agora"}</div>
            <div class="comment-text">${esc(comentario.text)}</div>
            ${currentUser?`<button class="reply-btn" data-reply="${comentario.id}">Responder</button>`:""}
          </div>
        </article>
      `;
    }

    list.innerHTML=principais.map(comentario=>{
      const filhos=respostas
        .filter(resposta=>resposta.parentId===comentario.id)
        .reverse()
        .map(resposta=>itemComentario(resposta,true))
        .join("");

      return itemComentario(comentario,false)+filhos;
    }).join("");

    document.querySelectorAll("[data-reply]").forEach(btn=>{
      btn.onclick=()=>{
        const comentario=todos.find(item=>item.id===btn.dataset.reply);

        replyingTo={
          id:comentario.id,
          name:comentario.name||"Usuário",
          text:comentario.text||""
        };

        atualizarReply();

        const textarea=document.getElementById("commentText");
        if(textarea) textarea.focus();
      };
    });
  }catch(error){
    console.error(error);
    list.innerHTML=`<div class="empty">Não foi possível carregar comentários.</div>`;
  }
}

async function favoritar(id){
  if(!currentUser){
    alert("Faça login para favoritar.");
    return;
  }

  favoritos[id]=!favoritos[id];

  await setDoc(doc(db,"users",currentUser.uid),favoritos,{merge:true});

  if(favoritos[id]){
    await setDoc(doc(db,"manhwas",id,"favorites",currentUser.uid),{
      uid:currentUser.uid,
      name:currentUser.displayName||"Usuário",
      createdAt:serverTimestamp()
    },{merge:true});
  }else{
    await deleteDoc(doc(db,"manhwas",id,"favorites",currentUser.uid));
  }

  await renderDetalhe(id);
}

globalSearch.addEventListener("keydown",event=>{
  if(event.key==="Enter"){
    const value=globalSearch.value.trim();

    if(value){
      location.href=`/manhwas?search=${encodeURIComponent(value)}`;
    }else{
      location.href="/manhwas";
    }
  }
});

async function iniciar(){
  await carregarFavoritos();

  const params=new URLSearchParams(location.search);
  const id=params.get("id");

  if(!id){
    app.innerHTML=`
      <div class="empty">
        Nenhuma obra selecionada.
        <br><br>
        <a class="btn" href="/manhwas">Ir para biblioteca</a>
      </div>
    `;
    return;
  }

  obraAtual=await carregarObra(id);

  visibleCaps=8;
  await renderDetalhe(id);
}

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  renderUser(user);
  await iniciar();
});
</script>
